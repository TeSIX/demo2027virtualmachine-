</style></head><body><a class="skip" href="#content">Перейти к содержимому</a><header class="topbar"><a href="#course" class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h1M7 17.5h1M15 6.5h3M15 17.5h3M12 10v4"/></svg></span>Сетевое администрирование</a><a href="#course" class="top-link">В начало</a><a href="#start" class="top-link">Перед началом</a><div class="environment"><span class="tag">Альт Сервер 11.1</span><span class="tag">CLI + GNOME</span></div><button id="theme-toggle" type="button" class="theme-toggle" aria-label="Включить тёмную тему" aria-pressed="false"><span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Тёмная тема</span></button><button id="menu" class="icon-button" aria-label="Оглавление курса" aria-expanded="true">☰</button></header><aside class="sidebar" id="sidebar" aria-label="Оглавление курса"></aside><div class="mobile-backdrop" id="backdrop"></div><main class="workspace" id="content" tabindex="-1"></main><div class="toast" id="toast" role="status" aria-live="polite"></div><script id="course-data" type="application/json">{"intro":"\u003ch1>Практическая инструкция: КИМ 09.02.06-1-2027\u003c/h1>\n\u003cp>Все машины: \u003cstrong>Альт Сервер 11.1\u003c/strong>. HQ-CLI: \u003cstrong>Альт Сервер 11.1 с GNOME\u003c/strong>. \u003ccode>CLI\u003c/code> здесь означает имя клиентской машины, а не требование работать без графики.\u003c/p>\n\u003cp>Инструкция составлена по заданиям ГИА базового уровня на страницах 44–62 предоставленного КИМ. Три модуля соответствуют заданиям 1, 2 и 3.\u003c/p>\n\u003col>\n\u003cli>\u003ca href=\"#m1\">Модуль 1 — сетевая инфраструктура\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"#m2\">Модуль 2 — сетевое администрирование\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"#m3\">Модуль 3 — эксплуатация\u003c/a>.\u003c/li>\n\u003c/ol>\n\u003ch2>Как выполнять\u003c/h2>\n\u003cp>Команды предназначены \u003cstrong>для терминалов виртуальных машин Linux\u003c/strong>, не для PowerShell на компьютере, где открыт этот документ. Перед блоком указано устройство. Войти в root: \u003ccode>su -\u003c/code>. Команды вводить по одной, сверяя результат проверок. Конфигурации редактируются вручную через nano: Ctrl+O → Enter для сохранения, Ctrl+X для выхода. Содержимое конфигурационных файлов вводится в редакторе, не в терминале.\u003c/p>\n\u003cp>Используются ваши интерфейсы: \u003cstrong>ens33, ens37, ens38\u003c/strong> (имена без пробелов). Первый адаптер — ens33, второй — ens37, третий — ens38. Сетевые настройки задаются через \u003cstrong>etcnet\u003c/strong>, в \u003ccode>/etc/net/ifaces/ИМЯ_ИНТЕРФЕЙСА/\u003c/code>. Сопоставление адаптеров с сетями указано в модуле 1. IP-адреса в инструкции — наш рассчитанный вариант, поскольку КИМ не задаёт их полностью. На готовом стенде модулей 2–3 используйте выданную адресацию.\u003c/p>\n\u003cp>\u003cstrong>Модуль 2 по КИМ выполняется на отдельном подготовленном стенде.\u003c/strong> В нём уже есть сеть, NAT, GRE, OSPF, DNS, DHCP, SSH и контроллер Samba DC на BR-SRV. Не создавайте домен заново. Модуль 3 требует работоспособных служб из модуля 2.\u003c/p>\n\u003cp>Для тренировки на едином стенде после модуля 1 потребуется отдельно подготовить Samba DC на BR-SRV и DNS домена. Это подготовка стенда, а не пункт экзаменационного задания; команды первичного развёртывания домена сюда намеренно не включены, чтобы не повредить готовый контроллер.\u003c/p>\n\u003ch2>Что нужно дополнительно\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>Additional.iso\u003c/code>: \u003ccode>users.csv\u003c/code>, \u003ccode>import.sh\u003c/code>, образы Docker, \u003ccode>compose.yaml\u003c/code>, \u003ccode>web/index.php\u003c/code>, \u003ccode>web/logo.png\u003c/code>, \u003ccode>web/dump.sql\u003c/code>, заготовки Ansible.\u003c/li>\n\u003cli>Приложения 1–6 к КИМ и фактические параметры готового стенда.\u003c/li>\n\u003cli>Сведения о портах и способе настройки HQ-SW в вашей среде виртуализации.\u003c/li>\n\u003c/ul>\n\u003cp>Этих приложений и ISO среди переданных файлов нет. Поэтому команды для их содержимого снабжены проверкой и местами для фактических значений. Пароль администратора уже созданного домена в КИМ не указан: вводите выданный пароль, не предполагая, что он совпадает с \u003ccode>P@ssw0rd\u003c/code>.\u003c/p>\n\u003ch2>Перед началом на каждой ВМ\u003c/h2>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>su -\nless /etc/altlinux-release\nip -br address\nip route\ntimedatectl\nsystemctl is-active network NetworkManager systemd-networkd\napt-get update\napt-get install curl nano\u003c/code>\u003c/pre>\u003c/div>\u003cp>Используйте репозитории своей ветки p11. Не подключайте Sisyphus ради одного пакета. Если имя пакета отличается, найдите его через \u003ccode>apt-cache search\u003c/code>, затем проверьте \u003ccode>apt-cache policy ИМЯ\u003c/code>.\u003c/p>\n\u003cp>Сетевые изменения модуля 1 выполняйте через консоль гипервизора: при перезапуске network SSH-соединение может разорваться. Используем вашу существующую службу etcnet (\u003ccode>network\u003c/code>); на готовом стенде модулей 2–3 сохраняем настроенную сеть.\u003c/p>\n\u003ch2>Отчёт\u003c/h2>\n\u003cp>Сохраняйте текстовые документы по пунктам с номером и описанием, например \u003ccode>1.4-VLAN\u003c/code>, \u003ccode>1.6-GRE\u003c/code>, \u003ccode>2.3-NFS\u003c/code>. Итоговые отчёты: \u003ccode>ФамилияУчастникаЗадание1\u003c/code>, \u003ccode>ФамилияУчастникаЗадание2\u003c/code>, \u003ccode>ФамилияУчастникаЗадание3\u003c/code>. Добавляйте реальные результаты проверок и читаемые скриншоты. Эти инструкции — руководство для выполнения, а не подтверждение уже выполненной настройки.\u003c/p>\n\u003ch2>Документация для проверки синтаксиса\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"https://docs.altlinux.org/ru-RU/alt-server/11.0/html/alt-server/etcnet.html\">Руководство ALT: etcnet\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://docs.altlinux.org/ru-RU/domain/10.4/html-single/alt-domain-p10/index.html\">Руководство Альт Домен: ввод клиента через system-auth и SSSD\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://docs.altlinux.org/ru-RU/alt-server/11.1/pdf/alt-server/alt-server-11.1-alt-server-ru-RU.pdf\">Руководство Альт Сервер 11.1\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://docs.altlinux.org/ru-RU/alt-server/11.1/html/alt-server/etcnet-vlan.html\">ALT 11.1: VLAN через etcnet\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://wiki.linuxfoundation.org/networking/tunneling\">GRE через /etc/net\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://docs.frrouting.org/en/latest/ospfd.html\">FRRouting: OSPF\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://chrony-project.org/doc/4.6/chrony.conf.html\">Chrony: chrony.conf\u003c/a>.\u003c/li>\n\u003cli>\u003ca href=\"https://yandex.com/support/browser/en/about/install\">Яндекс Браузер: установка\u003c/a>.\u003c/li>\n\u003c/ul>\n\u003cp>Команды подготовлены для указанной системы, но на реальных ВМ не запускались. Проверки в конце каждого пункта обязательны: состав пакетов, конфигурация стенда и содержимое ISO могут отличаться.\u003c/p>\n\u003ch2>Формат ручного выполнения\u003c/h2>\n\u003cp>В руководстве нет вспомогательных shell-функций, циклов или скриптов настройки. Для записи файла сначала выполняйте \u003ccode>nano /путь/к/файлу\u003c/code>, затем вписывайте показанный текст. В командах passwd вручную задавайте указанный рядом пароль; для sshuser, net_admin и irpoadmin по заданию — \u003ccode>P@ssw0rd\u003c/code>.\u003c/p>\n\u003cp>Исключения обусловлены самим КИМ: массовый импорт в модуле 3 требует доработать выданный \u003ccode>import.sh\u003c/code>, а сбор сведений — Ansible playbook в YAML. Их содержание и запуск описаны отдельно. Проверка разрешённой команды \u003ccode>sudo cat\u003c/code> сохранена, поскольку cat прямо входит в требуемый набор прав группы hq.\u003c/p>\n","modules":[{"n":1,"title":"Настройка сетевой инфраструктуры","preparation":"\u003cp>Основа: пункты 1–11 задания 1, страницы 46–51 КИМ. Читайте сначала \u003ccode>00-Начало.md\u003c/code>.\u003c/p>\n","lessons":[{"id":"m1-1","module":1,"n":1,"title":"Адресация и подключение ВМ","goal":"Назначить устройствам имена и IPv4-адреса. Подготовить VLAN 100, 200 и 999 через etcnet.","html":"\u003cp>Топология BR: \u003cstrong>ISP → BR-RTR → BR-FW → BR-SRV\u003c/strong>. BR-FW не стоит перед BR-RTR со стороны ISP. В HQ: HQ-RTR одним trunk-портом подключён к HQ-SW, сервер и клиент — к access-портам.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Машина\u003c/th>\n\u003cth>Интерфейс в примере\u003c/th>\n\u003cth>Адрес\u003c/th>\n\u003cth>Шлюз\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>ISP\u003c/td>\n\u003ctd>ens33, Интернет\u003c/td>\n\u003ctd>DHCP\u003c/td>\n\u003ctd>DHCP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ISP\u003c/td>\n\u003ctd>ens37, к HQ-RTR\u003c/td>\n\u003ctd>172.16.1.1/28\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ISP\u003c/td>\n\u003ctd>ens38, к BR-RTR\u003c/td>\n\u003ctd>172.16.2.1/28\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HQ-RTR\u003c/td>\n\u003ctd>ens33, к ISP\u003c/td>\n\u003ctd>172.16.1.2/28\u003c/td>\n\u003ctd>172.16.1.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HQ-RTR\u003c/td>\n\u003ctd>ens37, trunk\u003c/td>\n\u003ctd>без IP\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HQ-RTR\u003c/td>\n\u003ctd>vlan100\u003c/td>\n\u003ctd>192.168.100.1/27\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HQ-RTR\u003c/td>\n\u003ctd>vlan200\u003c/td>\n\u003ctd>192.168.200.1/28\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HQ-RTR\u003c/td>\n\u003ctd>vlan999\u003c/td>\n\u003ctd>192.168.99.1/29\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HQ-RTR\u003c/td>\n\u003ctd>gre1\u003c/td>\n\u003ctd>10.10.10.0/31\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BR-RTR\u003c/td>\n\u003ctd>ens33, к ISP\u003c/td>\n\u003ctd>172.16.2.2/28\u003c/td>\n\u003ctd>172.16.2.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BR-RTR\u003c/td>\n\u003ctd>ens37, к BR-FW\u003c/td>\n\u003ctd>192.168.10.0/31\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BR-RTR\u003c/td>\n\u003ctd>gre1\u003c/td>\n\u003ctd>10.10.10.1/31\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BR-FW\u003c/td>\n\u003ctd>ens33, к BR-RTR\u003c/td>\n\u003ctd>192.168.10.1/31\u003c/td>\n\u003ctd>192.168.10.0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BR-FW\u003c/td>\n\u003ctd>ens37, к BR-SRV\u003c/td>\n\u003ctd>192.168.30.1/28\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HQ-SRV\u003c/td>\n\u003ctd>ens33\u003c/td>\n\u003ctd>192.168.100.2/27\u003c/td>\n\u003ctd>192.168.100.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HQ-CLI\u003c/td>\n\u003ctd>ens33\u003c/td>\n\u003ctd>DHCP, резерв 192.168.200.2/28\u003c/td>\n\u003ctd>192.168.200.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>BR-SRV\u003c/td>\n\u003ctd>ens33\u003c/td>\n\u003ctd>192.168.30.2/28\u003c/td>\n\u003ctd>192.168.30.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HQ-SW\u003c/td>\n\u003ctd>управление VLAN 999\u003c/td>\n\u003ctd>192.168.99.2/29\u003c/td>\n\u003ctd>192.168.99.1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>/27 содержит 32 адреса, /28 — 16, /29 — 8. Для двухточечных соединений Linux используем /31: оба адреса пригодны для узлов (RFC 3021). Если оборудование площадки не поддерживает /31 и эксперт требует /30, замените адреса обоих концов и записи OSPF согласованно; это другой вариант адресного плана.\u003c/p>\n\u003ch3>Имена устройств: на каждой машине своя команда\u003c/h3>\n\u003ch4>ISP\u003c/h4>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>hostnamectl set-hostname isp.au-team.irpo\nhostname -f\u003c/code>\u003c/pre>\u003c/div>\u003ch4>HQ-RTR\u003c/h4>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>hostnamectl set-hostname hq-rtr.au-team.irpo\nhostname -f\u003c/code>\u003c/pre>\u003c/div>\u003ch4>BR-RTR\u003c/h4>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>hostnamectl set-hostname br-rtr.au-team.irpo\nhostname -f\u003c/code>\u003c/pre>\u003c/div>\u003ch4>BR-FW\u003c/h4>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>hostnamectl set-hostname br-fw.au-team.irpo\nhostname -f\u003c/code>\u003c/pre>\u003c/div>\u003ch4>HQ-SRV\u003c/h4>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>hostnamectl set-hostname hq-srv.au-team.irpo\nhostname -f\u003c/code>\u003c/pre>\u003c/div>\u003ch4>BR-SRV\u003c/h4>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>hostnamectl set-hostname br-srv.au-team.irpo\nhostname -f\u003c/code>\u003c/pre>\u003c/div>\u003ch4>HQ-CLI\u003c/h4>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>hostnamectl set-hostname hq-cli.au-team.irpo\nhostname -f\u003c/code>\u003c/pre>\u003c/div>\u003cp>Выполняйте только команды для текущей машины. На всех машинах настройте часовой пояс:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode># Для площадки в Иркутской области. В другом регионе замените пояс.\ntimedatectl set-timezone Asia/Irkutsk\nhostname -f\u003c/code>\u003c/pre>\u003c/div>\u003ch3>Постоянные адреса: вручную через etcnet\u003c/h3>\n\u003cp>Используем \u003cstrong>ens33, ens37, ens38\u003c/strong>. Все файлы редактируем в nano. Команды из блока «Терминал» вводите в терминале; блок «Содержимое файла» вводите \u003cstrong>в редакторе\u003c/strong>, а не в командной строке.\u003c/p>\n\u003cp>На каждой машине сначала:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>su -\napt-get install nano\nip -br link\nmkdir -p /root/network-before\ncp -a /etc/net /root/network-before/net-original\u003c/code>\u003c/pre>\u003c/div>\u003cp>Резервную копию \u003ccode>net-original\u003c/code> создайте один раз до изменений. Если она уже существует, используйте другое понятное имя.\u003c/p>\n\u003cp>В nano: \u003cstrong>Ctrl+O → Enter\u003c/strong> — сохранить, \u003cstrong>Ctrl+X\u003c/strong> — выйти. \u003cstrong>Ctrl+K\u003c/strong> — удалить текущую строку. Каталог создавайте через mkdir перед открытием нового файла. Никакие EOF, кавычки-обёртки или перенаправления \u003ccode>&gt;\u003c/code> вводить не нужно.\u003c/p>\n\u003cp>Ниже выполняйте только подраздел для текущей ВМ. На статических интерфейсах шлюз по умолчанию записываем только там, где он указан. Если на внутреннем интерфейсе остался старый \u003ccode>ipv4route\u003c/code> с default route, откройте его в nano и удалите эту строку.\u003c/p>\n\u003ch4>ISP\u003c/h4>\n\u003cp>\u003cstrong>ens33:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p /etc/net/ifaces/ens33\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens33/options\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>TYPE=eth\nBOOTPROTO=dhcp\nONBOOT=yes\nDISABLED=no\nNM_CONTROLLED=no\nSYSTEMD_CONTROLLED=no\nCONFIG_IPV4=yes\nCONFIG_IPV6=no\nCONFIG_WIRELESS=no\u003c/code>\u003c/pre>\u003c/div>\u003cp>Адрес, шлюз и DNS будут получены по DHCP. Если ранее здесь был статический адрес или шлюз, очистите содержимое \u003ccode>ipv4address\u003c/code> и \u003ccode>ipv4route\u003c/code> этого интерфейса через nano.\u003c/p>\n\u003cp>\u003cstrong>ens37:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p /etc/net/ifaces/ens37\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens37/options\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>TYPE=eth\nBOOTPROTO=static\nONBOOT=yes\nDISABLED=no\nNM_CONTROLLED=no\nSYSTEMD_CONTROLLED=no\nCONFIG_IPV4=yes\nCONFIG_IPV6=no\nCONFIG_WIRELESS=no\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens37/ipv4address\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>172.16.1.1/28\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>ens38:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p /etc/net/ifaces/ens38\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens38/options\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>TYPE=eth\nBOOTPROTO=static\nONBOOT=yes\nDISABLED=no\nNM_CONTROLLED=no\nSYSTEMD_CONTROLLED=no\nCONFIG_IPV4=yes\nCONFIG_IPV6=no\nCONFIG_WIRELESS=no\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens38/ipv4address\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>172.16.2.1/28\u003c/code>\u003c/pre>\u003c/div>\u003ch4>HQ-RTR\u003c/h4>\n\u003cp>\u003cstrong>ens33:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p /etc/net/ifaces/ens33\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens33/options\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>TYPE=eth\nBOOTPROTO=static\nONBOOT=yes\nDISABLED=no\nNM_CONTROLLED=no\nSYSTEMD_CONTROLLED=no\nCONFIG_IPV4=yes\nCONFIG_IPV6=no\nCONFIG_WIRELESS=no\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по rong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p /etc/net/ifaces/ens33\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens33/options\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>TYPE=eth\nBOOTPROTO=static\nONBOOT=yes\nDISABLED=no\nNM_CONTROLLED=no\nSYSTEMD_CONTROLLED=no\nCONFIG_IPV4=yes\nCONFIG_IPV6=no\nCONFIG_WIRELESS=no\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens33/ipv4address\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>192.168.30.2/28\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens33/ipv4route\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>default via 192.168.30.1\u003c/code>\u003c/pre>\u003c/div>\u003ch4>HQ-CLI\u003c/h4>\n\u003cp>\u003cstrong>ens33:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p /etc/net/ifaces/ens33\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens33/options\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>TYPE=eth\nBOOTPROTO=dhcp\nONBOOT=yes\nDISABLED=no\nNM_CONTROLLED=no\nSYSTEMD_CONTROLLED=no\nCONFIG_IPV4=yes\nCONFIG_IPV6=no\nCONFIG_WIRELESS=no\u003c/code>\u003c/pre>\u003c/div>\u003cp>Адрес, шлюз и DNS будут получены по DHCP. Если ранее здесь был статический адрес или шлюз, очистите содержимое \u003ccode>ipv4address\u003c/code> и \u003ccode>ipv4route\u003c/code> этого интерфейса через nano.\u003c/p>\n\u003ch4>DNS до запуска внутреннего DNS\u003c/h4>\n\u003cp>На HQ-RTR, BR-RTR, BR-FW, HQ-SRV и BR-SRV:\u003c/p>\n\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens33/resolv.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>search au-team.irpo\nnameserver 77.88.8.8\u003c/code>\u003c/pre>\u003c/div>\u003cp>На ISP и HQ-CLI DNS получаем по DHCP. После запуска DNS на HQ-SRV настройки серверов изменим в пункте 10; HQ-CLI получит нужный DNS в пункте 9.\u003c/p>\n\u003ch4>Применение на каждой ВМ\u003c/h4>\n\u003cp>Выполняйте из консоли гипервизора: SSH может разорваться.\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>systemctl enable network\nsystemctl restart network\nip -br address\nip route\nless /etc/resolv.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>DHCP на HQ-RTR будет запущен в пункте 9, поэтому до этого HQ-CLI может оставаться без адреса.\u003c/p>\n\u003cp>Если etcnet уже используется, сетевую службу менять не нужно. Если вы ранее включали systemd-networkd по первой версии руководства, после заполнения etcnet-файлов остановите его командой \u003ccode>systemctl disable --now systemd-networkd\u003c/code>, затем перезапустите \u003ccode>network\u003c/code>. Файлы других служб пока сохраняйте как резервную копию. \u003ccode>NM_CONTROLLED=no\u003c/code> запрещает NetworkManager управлять указанными интерфейсами.\u003c/p>\n","search":"адресация и подключение вм \nтопология br: **isp → br-rtr → br-fw → br-srv**. br-fw не стоит перед br-rtr со стороны isp. в hq: hq-rtr одним trunk-портом подключён к hq-sw, сервер и клиент — к access-портам.\n\n| машина | интерфейс в примере | адрес | шлюз |\n|---|---|---|---|\n| isp | ens33, интернет | dhcp | dhcp |\n| isp | ens37, к hq-rtr | 172.16.1.1/28 | — |\n| isp | ens38, к br-rtr | 172.16.2.1/28 | — |\n| hq-rtr | ens33, к isp | 172.16.1.2/28 | 172.16.1.1 |\n| hq-rtr | ens37, trunk | без ip | — |\n| hq-rtr | vlan100 | 192.168.100.1/27 | — |\n| hq-rtr | vlan200 | 192.168.200.1/28 | — |\n| hq-rtr | vlan999 | 192.168.99.1/29 | — |\n| hq-rtr | gre1 | 10.10.10.0/31 | — |\n| br-rtr | ens33, к isp | 172.16.2.2/28 | 172.16.2.1 |\n| br-rtr | ens37, к br-fw | 192.168.10.0/31 | — |\n| br-rtr | gre1 | 10.10.10.1/31 | — |\n| br-fw | ens33, к br-rtr | 192.168.10.1/31 | 192.168.10.0 |\n| br-fw | ens37, к br-srv | 192.168.30.1/28 | — |\n| hq-srv | ens33 | 192.168.100.2/27 | 192.168.100.1 |\n| hq-cli | ens33 | dhcp, резерв 192.168.200.2/28 | 192.168.200.1 |\n| br-srv | ens33 | 192.168.30.2/28 | 192.168.30.1 |\n| hq-sw | управление vlan 999 | 192.168.99.2/29 | 192.168.99.1 |\n\n/27 содержит 32 адреса, /28 — 16, /29 — 8. для двухточечных соединений linux используем /31: оба адреса пригодны для узлов (rfc 3021). если оборудование площадки не поддерживает /31 и эксперт требует /30, замените адреса обоих концов и записи ospf согласованно; это другой вариант адресного плана.\n\n### имена устройств: на каждой машине своя команда\n\n#### isp\n\n```bash\nhostnamectl set-hostname isp.au-team.irpo\nhostname -f\n```\n\n#### hq-rtr\n\n```bash\nhostnamectl set-hostname hq-rtr.au-team.irpo\nhostname -f\n```\n\n#### br-rtr\n\n```bash\nhostnamectl set-hostname br-rtr.au-team.irpo\nhostname -f\n```\n\n#### br-fw\n\n```bash\nhostnamectl set-hostname br-fw.au-team.irpo\nhostname -f\n```\n\n#### hq-srv\n\n```bash\nhostnamectl set-hostname hq-srv.au-team.irpo\nhostname -f\n```\n\n#### br-srv\n\n```bash\nhostnamectl set-hostname br-srv.au-team.irpo\nhostname -f\n```\n\n#### hq-cli\n\n```bash\nhostnamectl set-hostname hq-cli.au-team.irpo\nhostname -f\n```\n\nвыполняйте только команды для текущей машины. на всех машинах настройте часовой пояс:\n\n```bash\n# для площадки в иркутской области. в другом регионе замените пояс.\ntimedatectl set-timezone asia/irkutsk\nhostname -f\n```\n\n### постоянные адреса: вручную через etcnet\n\nиспользуем **ens33, ens37, ens38**. все файлы редактируем в nano. команды из блока «терминал» вводите в терминале; блок «содержимое файла» вводите **в редакторе**, а не в командной строке.\n\nна каждой машине сначала:\n\n```bash\nsu -\napt-get install nano\nip -br link\nmkdir -p /root/network-before\ncp -a /etc/net /root/network-before/net-original\n```\n\nрезервную копию `net-original` создайте один раз до изменений. если она уже существует, используйте другое понятное имя.\n\nв nano: **ctrl+o → enter** — сохранить, **ctrl+x** — выйти. **ctrl+k** — удалить текущую строку. каталог создавайте через mkdir перед открытием нового файла. никакие eof, кавычки-обёртки или перенаправления `>` вводить не нужно.\n\nниже выполняйте только подраздел для текущей вм. на статических интерфейсах шлюз по умолчанию записываем только там, где он указан. если на внутреннем интерфейсе остался старый `ipv4route` с default route, откройте его в nano и удалите эту строку.\n\n#### isp\n\n**ens33:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens33\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=dhcp\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nадрес, шлюз и dns будут получены по dhcp. если ранее здесь был статический адрес или шлюз, очистите содержимое `ipv4address` и `ipv4route` этого интерфейса через nano.\n\n**ens37:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens37\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens37/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens37/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n172.16.1.1/28\n```\n\n**ens38:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens38\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens38/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens38/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n172.16.2.1/28\n```\n\n#### hq-rtr\n\n**ens33:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens33\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n172.16.1.2/28\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/ipv4route\n```\n\nвпишите содержимое и сохраните:\n\n```text\ndefault via 172.16.1.1\n```\n\n**ens37:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens37\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens37/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nна ens37 ip не назначаем. если файл `/etc/net/ifaces/ens37/ipv4address` уже содержит старый адрес, откройте его в nano и удалите адрес.\n\n#### hq-rtr: три vlan на ens37\n\nфизический ens37 — trunk без ip. все три vlan используют этот один адаптер.\n\n**vlan 100:**\n\n```bash\nmkdir -p /etc/net/ifaces/vlan100\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/vlan100/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=vlan\nhost=ens37\nvid=100\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/vlan100/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n192.168.100.1/27\n```\n\n**vlan 200:**\n\n```bash\nmkdir -p /etc/net/ifaces/vlan200\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/vlan200/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=vlan\nhost=ens37\nvid=200\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/vlan200/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n192.168.200.1/28\n```\n\n**vlan 999:**\n\n```bash\nmkdir -p /etc/net/ifaces/vlan999\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/vlan999/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=vlan\nhost=ens37\nvid=999\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/vlan999/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n192.168.99.1/29\n```\n\nв `ipv4route` vlan-интерфейсов default route не добавляем.\n\n#### br-rtr\n\n**ens33:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens33\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n172.16.2.2/28\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/ipv4route\n```\n\nвпишите содержимое и сохраните:\n\n```text\ndefault via 172.16.2.1\n```\n\n**ens37:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens37\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens37/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens37/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n192.168.10.0/31\n```\n\n#### br-fw\n\n**ens33:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens33\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n192.168.10.1/31\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/ipv4route\n```\n\nвпишите содержимое и сохраните:\n\n```text\ndefault via 192.168.10.0\n```\n\n**ens37:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens37\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens37/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens37/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n192.168.30.1/28\n```\n\n#### hq-srv\n\n**ens33:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens33\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n192.168.100.2/27\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/ipv4route\n```\n\nвпишите содержимое и сохраните:\n\n```text\ndefault via 192.168.100.1\n```\n\n#### br-srv\n\n**ens33:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens33\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n192.168.30.2/28\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/ipv4route\n```\n\nвпишите содержимое и сохраните:\n\n```text\ndefault via 192.168.30.1\n```\n\n#### hq-cli\n\n**ens33:**\n\n```bash\nmkdir -p /etc/net/ifaces/ens33\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=eth\nbootproto=dhcp\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\nconfig_wireless=no\n```\n\nадрес, шлюз и dns будут получены по dhcp. если ранее здесь был статический адрес или шлюз, очистите содержимое `ipv4address` и `ipv4route` этого интерфейса через nano.\n\n#### dns до запуска внутреннего dns\n\nна hq-rtr, br-rtr, br-fw, hq-srv и br-srv:\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/resolv.conf\n```\n\nвпишите содержимое и сохраните:\n\n```text\nsearch au-team.irpo\nnameserver 77.88.8.8\n```\n\nна isp и hq-cli dns получаем по dhcp. после запуска dns на hq-srv настройки серверов изменим в пункте 10; hq-cli получит нужный dns в пункте 9.\n\n#### применение на каждой вм\n\nвыполняйте из консоли гипервизора: ssh может разорваться.\n\n```bash\nsystemctl enable network\nsystemctl restart network\nip -br address\nip route\nless /etc/resolv.conf\n```\n\ndhcp на hq-rtr будет запущен в пункте 9, поэтому до этого hq-cli может оставаться без адреса.\n\nесли etcnet уже используется, сетевую службу менять не нужно. если вы ранее включали systemd-networkd по первой версии руководства, после заполнения etcnet-файлов остановите его командой `systemctl disable --now systemd-networkd`, затем перезапустите `network`. файлы других служб пока сохраняйте как резервную копию. `nm_controlled=no` запрещает networkmanager управлять указанными интерфейсами.\n\n"},{"id":"m1-2","module":1,"n":2,"title":"Интернет на ISP и маршрутизация пакетов","goal":"Настроить Интернет через ISP и включить пересылку IPv4 на маршрутизаторах.","html":"\u003cp>На \u003cstrong>ISP, HQ-RTR, BR-RTR, BR-FW\u003c/strong>:\u003c/p>\n\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/sysctl.d/90-exam-router.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>net.ipv4.ip_forward=1\nnet.ipv4.conf.all.rp_filter=0\nnet.ipv4.conf.default.rp_filter=0\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>sysctl --system\nsysctl -w net.ipv4.conf.ens33.rp_filter=0\nsysctl -w net.ipv4.conf.ens37.rp_filter=0\u003c/code>\u003c/pre>\u003c/div>\u003cp>На ISP также выполните \u003ccode>sysctl -w net.ipv4.conf.ens38.rp_filter=0\u003c/code>. Для сохранения настроек после перезагрузки допишите в созданный sysctl-файл строки \u003ccode>net.ipv4.conf.ens33.rp_filter=0\u003c/code> и \u003ccode>net.ipv4.conf.ens37.rp_filter=0\u003c/code>, а на ISP ещё \u003ccode>net.ipv4.conf.ens38.rp_filter=0\u003c/code>.\u003c/p>\n\u003cp>Правила ниже рассчитаны на чистый стенд с nftables. Сначала \u003ccode>nft list ruleset\u003c/code>, \u003ccode>systemctl is-active firewalld\u003c/code>: если уже настроен межсетевой экран, добавляйте разрешения в него, не запускайте конкурирующий менеджер. Разрешить нужны GRE (IP-протокол 47), OSPF (89) на внутренних связях, DHCP, DNS и доступ к службам. Здесь для начального сетевого стенда цепочки filter не создаются; существующая политика DROP автоматически не исчезнет.\u003c/p>\n\u003cp>На \u003cstrong>ISP\u003c/strong>:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install nftables\nmkdir -p /etc/nftables\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/nftables/exam.nft\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>table ip exam_nat {\n chain postrouting {\n  type nat hook postrouting priority srcnat; policy accept;\n  ip saddr { 172.16.1.0/28, 172.16.2.0/28 } oifname &quot;ens33&quot; masquerade\n }\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>На \u003cstrong>HQ-RTR\u003c/strong>, аналогично установите nftables и создайте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install nftables\nmkdir -p /etc/nftables\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/nftables/exam.nft\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>table ip exam_nat {\n chain postrouting {\n  type nat hook postrouting priority srcnat; policy accept;\n  ip saddr { 192.168.100.0/27, 192.168.200.0/28, 192.168.99.0/29 } oifname &quot;ens33&quot; masquerade\n }\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>На \u003cstrong>BR-RTR\u003c/strong>:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install nftables\nmkdir -p /etc/nftables\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/nftables/exam.nft\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>table ip exam_nat {\n chain postrouting {\n  type nat hook postrouting priority srcnat; policy accept;\n  ip saddr { 192.168.30.0/28, 192.168.10.0/31 } oifname &quot;ens33&quot; masquerade\n }\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>На \u003cstrong>каждой из этих трёх машин\u003c/strong> обеспечьте загрузку своего файла:\u003c/p>\n\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/systemd/system/exam-nat.service\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>[Unit]\nDescription=Exam NAT rules\nAfter=network.target\n[Service]\nType=oneshot\nRemainAfterExit=yes\nExecStartPre=/usr/sbin/nft -c -f /etc/nftables/exam.nft\nExecStart=/usr/sbin/nft -f /etc/nftables/exam.nft\nExecStop=/usr/sbin/nft delete table ip exam_nat\n[Install]\nWantedBy=multi-user.target\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>command -v nft\n# Если путь отличается от /usr/sbin/nft, поправьте unit.\nsystemctl daemon-reload\nsystemctl enable --now exam-nat\nnft list table ip exam_nat\u003c/code>\u003c/pre>\u003c/div>\u003cp>После редактирования этого файла: \u003ccode>systemctl restart exam-nat\u003c/code>. Межофисный трафик идёт через gre1, поэтому правило NAT для него не срабатывает.\u003c/p>\n","search":"интернет на isp и маршрутизация пакетов \nна **isp, hq-rtr, br-rtr, br-fw**:\n\nоткройте файл:\n\n```bash\nnano /etc/sysctl.d/90-exam-router.conf\n```\n\nвпишите содержимое и сохраните:\n\n```text\nnet.ipv4.ip_forward=1\nnet.ipv4.conf.all.rp_filter=0\nnet.ipv4.conf.default.rp_filter=0\n```\n\n```bash\nsysctl --system\nsysctl -w net.ipv4.conf.ens33.rp_filter=0\nsysctl -w net.ipv4.conf.ens37.rp_filter=0\n```\n\nна isp также выполните `sysctl -w net.ipv4.conf.ens38.rp_filter=0`. для сохранения настроек после перезагрузки допишите в созданный sysctl-файл строки `net.ipv4.conf.ens33.rp_filter=0` и `net.ipv4.conf.ens37.rp_filter=0`, а на isp ещё `net.ipv4.conf.ens38.rp_filter=0`.\n\nправила ниже рассчитаны на чистый стенд с nftables. сначала `nft list ruleset`, `systemctl is-active firewalld`: если уже настроен межсетевой экран, добавляйте разрешения в него, не запускайте конкурирующий менеджер. разрешить нужны gre (ip-протокол 47), ospf (89) на внутренних связях, dhcp, dns и доступ к службам. здесь для начального сетевого стенда цепочки filter не создаются; существующая политика drop автоматически не исчезнет.\n\nна **isp**:\n\n```bash\napt-get install nftables\nmkdir -p /etc/nftables\n```\n\nоткройте файл:\n\n```bash\nnano /etc/nftables/exam.nft\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntable ip exam_nat {\n chain postrouting {\n  type nat hook postrouting priority srcnat; policy accept;\n  ip saddr { 172.16.1.0/28, 172.16.2.0/28 } oifname \"ens33\" masquerade\n }\n}\n```\n\nна **hq-rtr**, аналогично установите nftables и создайте файл:\n\n```bash\napt-get install nftables\nmkdir -p /etc/nftables\n```\n\nоткройте файл:\n\n```bash\nnano /etc/nftables/exam.nft\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntable ip exam_nat {\n chain postrouting {\n  type nat hook postrouting priority srcnat; policy accept;\n  ip saddr { 192.168.100.0/27, 192.168.200.0/28, 192.168.99.0/29 } oifname \"ens33\" masquerade\n }\n}\n```\n\nна **br-rtr**:\n\n```bash\napt-get install nftables\nmkdir -p /etc/nftables\n```\n\nоткройте файл:\n\n```bash\nnano /etc/nftables/exam.nft\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntable ip exam_nat {\n chain postrouting {\n  type nat hook postrouting priority srcnat; policy accept;\n  ip saddr { 192.168.30.0/28, 192.168.10.0/31 } oifname \"ens33\" masquerade\n }\n}\n```\n\nна **каждой из этих трёх машин** обеспечьте загрузку своего файла:\n\nоткройте файл:\n\n```bash\nnano /etc/systemd/system/exam-nat.service\n```\n\nвпишите содержимое и сохраните:\n\n```text\n[unit]\ndescription=exam nat rules\nafter=network.target\n[service]\ntype=oneshot\nremainafterexit=yes\nexecstartpre=/usr/sbin/nft -c -f /etc/nftables/exam.nft\nexecstart=/usr/sbin/nft -f /etc/nftables/exam.nft\nexecstop=/usr/sbin/nft delete table ip exam_nat\n[install]\nwantedby=multi-user.target\n```\n\n```bash\ncommand -v nft\n# если путь отличается от /usr/sbin/nft, поправьте unit.\nsystemctl daemon-reload\nsystemctl enable --now exam-nat\nnft list table ip exam_nat\n```\n\nпосле редактирования этого файла: `systemctl restart exam-nat`. межофисный трафик идёт через gre1, поэтому правило nat для него не срабатывает.\n\n"},{"id":"m1-3","module":1,"n":3,"title":"Локальные пользователи","goal":"Создать sshuser на серверах и net_admin на маршрутизаторах, настроить sudo.","html":"\u003cp>\u003cstrong>HQ-SRV и BR-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install sudo openssh-server\ncontrol sudo public\ngetent passwd 2027\n# Если UID 2027 свободен:\nuseradd -m -u 2027 -s /bin/bash sshuser\npasswd sshuser\nmkdir -p /etc/sudoers.d\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/sudoers.d/sshuser\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>sshuser ALL=(ALL:ALL) NOPASSWD: ALL\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>chmod 440 /etc/sudoers.d/sshuser\nvisudo -cf /etc/sudoers.d/sshuser\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если sshuser уже существует, проверьте \u003ccode>id sshuser\u003c/code> и настройте существующую запись вместо повторного useradd.\u003c/p>\n\u003cp>\u003cstrong>HQ-RTR и BR-RTR:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install sudo openssh-server\ncontrol sudo public\nuseradd -m -s /bin/bash net_admin\npasswd net_admin\nmkdir -p /etc/sudoers.d\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/sudoers.d/net_admin\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>net_admin ALL=(ALL:ALL) NOPASSWD: ALL\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>chmod 440 /etc/sudoers.d/net_admin\nvisudo -cf /etc/sudoers.d/net_admin\nsystemctl enable --now sshd\u003c/code>\u003c/pre>\u003c/div>","search":"локальные пользователи \n**hq-srv и br-srv:**\n\n```bash\napt-get install sudo openssh-server\ncontrol sudo public\ngetent passwd 2027\n# если uid 2027 свободен:\nuseradd -m -u 2027 -s /bin/bash sshuser\npasswd sshuser\nmkdir -p /etc/sudoers.d\n```\n\nоткройте файл:\n\n```bash\nnano /etc/sudoers.d/sshuser\n```\n\nвпишите содержимое и сохраните:\n\n```text\nsshuser all=(all:all) nopasswd: all\n```\n\n```bash\nchmod 440 /etc/sudoers.d/sshuser\nvisudo -cf /etc/sudoers.d/sshuser\n```\n\nесли sshuser уже существует, проверьте `id sshuser` и настройте существующую запись вместо повторного useradd.\n\n**hq-rtr и br-rtr:**\n\n```bash\napt-get install sudo openssh-server\ncontrol sudo public\nuseradd -m -s /bin/bash net_admin\npasswd net_admin\nmkdir -p /etc/sudoers.d\n```\n\nоткройте файл:\n\n```bash\nnano /etc/sudoers.d/net_admin\n```\n\nвпишите содержимое и сохраните:\n\n```text\nnet_admin all=(all:all) nopasswd: all\n```\n\n```bash\nchmod 440 /etc/sudoers.d/net_admin\nvisudo -cf /etc/sudoers.d/net_admin\nsystemctl enable --now sshd\n```\n\n"},{"id":"m1-4","module":1,"n":4,"title":"HQ-SW: VLAN 100, 200, 999","goal":"Настроить trunk к HQ-RTR и access-порты HQ-SRV и HQ-CLI.","html":"\u003cp>В гипервизоре/коммутаторе настройте:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Порт\u003c/th>\n\u003cth>Режим\u003c/th>\n\u003cth>VLAN\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>к ens37 HQ-RTR\u003c/td>\n\u003ctd>trunk/tagged\u003c/td>\n\u003ctd>100, 200, 999\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>к HQ-SRV\u003c/td>\n\u003ctd>access/untagged, PVID 100\u003c/td>\n\u003ctd>100\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>к HQ-CLI\u003c/td>\n\u003ctd>access/untagged, PVID 200\u003c/td>\n\u003ctd>200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>управление\u003c/td>\n\u003ctd>management\u003c/td>\n\u003ctd>999\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>HQ-SRV и HQ-CLI получают нетегированный Ethernet. VLAN-подинтерфейсы на них не нужны. Просто соединить все ВМ с одним обычным виртуальным коммутатором недостаточно.\u003c/p>\n\u003cp>Если HQ-SW — отдельная \u003cstrong>Linux-ВМ\u003c/strong>, используйте следующие команды по одной. В этом примере ens33 подключён к HQ-RTR, ens37 к HQ-SRV, ens38 к HQ-CLI. Выполняйте только на HQ-SW. Его портами не должна одновременно управлять другая конфигурация интерфейсов.\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>ip link add br0 type bridge vlan_filtering 1 vlan_default_pvid 0\nip link set br0 up\nip link set ens33 master br0\nip link set ens33 up\nip link set ens37 master br0\nip link set ens37 up\nip link set ens38 master br0\nip link set ens38 up\nbridge vlan add dev ens33 vid 100\nbridge vlan add dev ens33 vid 200\nbridge vlan add dev ens33 vid 999\nbridge vlan add dev ens37 vid 100 pvid untagged\nbridge vlan add dev ens38 vid 200 pvid untagged\nbridge vlan add dev br0 vid 999 self\nip link add link br0 name br0.999 type vlan id 999\nip addr add 192.168.99.2/29 dev br0.999\nip link set br0.999 up\nip route add default via 192.168.99.1\nbridge vlan show\u003c/code>\u003c/pre>\u003c/div>\u003cp>Для сохранения Linux HQ-SW без shell-скрипта создайте unit. Сначала \u003ccode>command -v ip\u003c/code> и \u003ccode>command -v bridge\u003c/code>: если пути отличаются от \u003ccode>/usr/sbin/\u003c/code>, подставьте фактические.\u003c/p>\n\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/systemd/system/hq-switch.service\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>[Unit]\nDescription=HQ VLAN switch\nAfter=network.target\n[Service]\nType=oneshot\nRemainAfterExit=yes\nExecStart=/usr/sbin/ip link add br0 type bridge vlan_filtering 1 vlan_default_pvid 0\nExecStart=/usr/sbin/ip link set br0 up\nExecStart=/usr/sbin/ip link set ens33 master br0\nExecStart=/usr/sbin/ip link set ens33 up\nExecStart=/usr/sbin/ip link set ens37 master br0\nExecStart=/usr/sbin/ip link set ens37 up\nExecStart=/usr/sbin/ip link set ens38 master br0\nExecStart=/usr/sbin/ip link set ens38 up\nExecStart=/usr/sbin/bridge vlan add dev ens33 vid 100\nExecStart=/usr/sbin/bridge vlan add dev ens33 vid 200\nExecStart=/usr/sbin/bridge vlan add dev ens33 vid 999\nExecStart=/usr/sbin/bridge vlan add dev ens37 vid 100 pvid untagged\nExecStart=/usr/sbin/bridge vlan add dev ens38 vid 200 pvid untagged\nExecStart=/usr/sbin/bridge vlan add dev br0 vid 999 self\nExecStart=/usr/sbin/ip link add link br0 name br0.999 type vlan id 999\nExecStart=/usr/sbin/ip addr add 192.168.99.2/29 dev br0.999\nExecStart=/usr/sbin/ip link set br0.999 up\nExecStart=/usr/sbin/ip route add default via 192.168.99.1\n[Install]\nWantedBy=multi-user.target\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>systemctl daemon-reload\nsystemctl enable hq-switch\u003c/code>\u003c/pre>\u003c/div>\u003cp>Мост сейчас уже создан вручную. Unit должен стартовать после перезагрузки, не запускайте его второй раз поверх существующего br0. Для встроенного коммутатора гипервизора используется его собственная постоянная конфигурация VLAN, этот Linux-unit не нужен.\u003c/p>\n\u003cp>Проверка на HQ-RTR:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>ip -d link show vlan100\nip -d link show vlan200\nip -d link show vlan999\nping -c 3 192.168.100.2\u003c/code>\u003c/pre>\u003c/div>","search":"hq-sw: vlan 100, 200, 999 \nв гипервизоре/коммутаторе настройте:\n\n| порт | режим | vlan |\n|---|---|---|\n| к ens37 hq-rtr | trunk/tagged | 100, 200, 999 |\n| к hq-srv | access/untagged, pvid 100 | 100 |\n| к hq-cli | access/untagged, pvid 200 | 200 |\n| управление | management | 999 |\n\nhq-srv и hq-cli получают нетегированный ethernet. vlan-подинтерфейсы на них не нужны. просто соединить все вм с одним обычным виртуальным коммутатором недостаточно.\n\nесли hq-sw — отдельная **linux-вм**, используйте следующие команды по одной. в этом примере ens33 подключён к hq-rtr, ens37 к hq-srv, ens38 к hq-cli. выполняйте только на hq-sw. его портами не должна одновременно управлять другая конфигурация интерфейсов.\n\n```bash\nip link add br0 type bridge vlan_filtering 1 vlan_default_pvid 0\nip link set br0 up\nip link set ens33 master br0\nip link set ens33 up\nip link set ens37 master br0\nip link set ens37 up\nip link set ens38 master br0\nip link set ens38 up\nbridge vlan add dev ens33 vid 100\nbridge vlan add dev ens33 vid 200\nbridge vlan add dev ens33 vid 999\nbridge vlan add dev ens37 vid 100 pvid untagged\nbridge vlan add dev ens38 vid 200 pvid untagged\nbridge vlan add dev br0 vid 999 self\nip link add link br0 name br0.999 type vlan id 999\nip addr add 192.168.99.2/29 dev br0.999\nip link set br0.999 up\nip route add default via 192.168.99.1\nbridge vlan show\n```\n\nдля сохранения linux hq-sw без shell-скрипта создайте unit. сначала `command -v ip` и `command -v bridge`: если пути отличаются от `/usr/sbin/`, подставьте фактические.\n\nоткройте файл:\n\n```bash\nnano /etc/systemd/system/hq-switch.service\n```\n\nвпишите содержимое и сохраните:\n\n```text\n[unit]\ndescription=hq vlan switch\nafter=network.target\n[service]\ntype=oneshot\nremainafterexit=yes\nexecstart=/usr/sbin/ip link add br0 type bridge vlan_filtering 1 vlan_default_pvid 0\nexecstart=/usr/sbin/ip link set br0 up\nexecstart=/usr/sbin/ip link set ens33 master br0\nexecstart=/usr/sbin/ip link set ens33 up\nexecstart=/usr/sbin/ip link set ens37 master br0\nexecstart=/usr/sbin/ip link set ens37 up\nexecstart=/usr/sbin/ip link set ens38 master br0\nexecstart=/usr/sbin/ip link set ens38 up\nexecstart=/usr/sbin/bridge vlan add dev ens33 vid 100\nexecstart=/usr/sbin/bridge vlan add dev ens33 vid 200\nexecstart=/usr/sbin/bridge vlan add dev ens33 vid 999\nexecstart=/usr/sbin/bridge vlan add dev ens37 vid 100 pvid untagged\nexecstart=/usr/sbin/bridge vlan add dev ens38 vid 200 pvid untagged\nexecstart=/usr/sbin/bridge vlan add dev br0 vid 999 self\nexecstart=/usr/sbin/ip link add link br0 name br0.999 type vlan id 999\nexecstart=/usr/sbin/ip addr add 192.168.99.2/29 dev br0.999\nexecstart=/usr/sbin/ip link set br0.999 up\nexecstart=/usr/sbin/ip route add default via 192.168.99.1\n[install]\nwantedby=multi-user.target\n```\n\n```bash\nsystemctl daemon-reload\nsystemctl enable hq-switch\n```\n\nмост сейчас уже создан вручную. unit должен стартовать после перезагрузки, не запускайте его второй раз поверх существующего br0. для встроенного коммутатора гипервизора используется его собственная постоянная конфигурация vlan, этот linux-unit не нужен.\n\nпроверка на hq-rtr:\n\n```bash\nip -d link show vlan100\nip -d link show vlan200\nip -d link show vlan999\nping -c 3 192.168.100.2\n```\n\n"},{"id":"m1-5","module":1,"n":5,"title":"SSH: порт 2027, только sshuser, две попытки, баннер","goal":"Настроить SSH на порту 2027: только sshuser, две попытки входа и баннер.","html":"\u003cp>\u003cstrong>HQ-SRV и BR-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>cp -a /etc/openssh/sshd_config /etc/openssh/sshd_config.before-exam\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/openssh/banner\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>Authorized access only\u003c/code>\u003c/pre>\u003c/div>\u003cp>В \u003ccode>/etc/openssh/sshd_config\u003c/code> приведите существующие активные директивы к следующим значениям; не дописывайте противоречащие значения в конец файла:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/openssh/sshd_config\u003c/code>\u003c/pre>\u003c/div>\u003cp>Содержимое нужных строк:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>Port 2027\nAllowUsers sshuser\nMaxAuthTries 2\nBanner /etc/openssh/banner\nPermitRootLogin no\nPasswordAuthentication yes\nPubkeyAuthentication yes\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если есть \u003ccode>Include\u003c/code>, проверьте также подключённые файлы. \u003ccode>AllowUsers\u003c/code> впоследствии должен разрешать sshuser для Ansible, включая вход по ключу.\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>/usr/sbin/sshd -t\n/usr/sbin/sshd -T | grep -E '^(port|allowusers|maxauthtries|banner|permitrootlogin) '\nsystemctl enable --now sshd\nsystemctl restart sshd\nss -lntp | grep ':2027'\u003c/code>\u003c/pre>\u003c/div>\u003cp>С другой машины: \u003ccode>ssh -p 2027 sshuser@192.168.100.2\u003c/code>. Должен появиться баннер. Не путайте MaxAuthTries=2 (попытки внутри соединения) с fail2ban из модуля 3.\u003c/p>\n","search":"ssh: порт 2027, только sshuser, две попытки, баннер \n**hq-srv и br-srv:**\n\n```bash\ncp -a /etc/openssh/sshd_config /etc/openssh/sshd_config.before-exam\n```\n\nоткройте файл:\n\n```bash\nnano /etc/openssh/banner\n```\n\nвпишите содержимое и сохраните:\n\n```text\nauthorized access only\n```\n\nв `/etc/openssh/sshd_config` приведите существующие активные директивы к следующим значениям; не дописывайте противоречащие значения в конец файла:\n\n```bash\nnano /etc/openssh/sshd_config\n```\n\nсодержимое нужных строк:\n\n```text\nport 2027\nallowusers sshuser\nmaxauthtries 2\nbanner /etc/openssh/banner\npermitrootlogin no\npasswordauthentication yes\npubkeyauthentication yes\n```\n\nесли есть `include`, проверьте также подключённые файлы. `allowusers` впоследствии должен разрешать sshuser для ansible, включая вход по ключу.\n\n```bash\n/usr/sbin/sshd -t\n/usr/sbin/sshd -t | grep -e '^(port|allowusers|maxauthtries|banner|permitrootlogin) '\nsystemctl enable --now sshd\nsystemctl restart sshd\nss -lntp | grep ':2027'\n```\n\nс другой машины: `ssh -p 2027 sshuser@192.168.100.2`. должен появиться баннер. не путайте maxauthtries=2 (попытки внутри соединения) с fail2ban из модуля 3.\n\n"},{"id":"m1-6","module":1,"n":6,"title":"GRE между HQ-RTR и BR-RTR через etcnet","goal":"Создать постоянный GRE-туннель между HQ-RTR и BR-RTR через etcnet.","html":"\u003cp>\u003cstrong>HQ-RTR:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p /etc/net/ifaces/gre1\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/gre1/options\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>TYPE=iptun\nTUNTYPE=gre\nHOST=ens33\nTUNLOCAL=172.16.1.2\nTUNREMOTE=172.16.2.2\nTUNOPTIONS='ttl 64'\nMTU=1476\nBOOTPROTO=static\nONBOOT=yes\nDISABLED=no\nNM_CONTROLLED=no\nSYSTEMD_CONTROLLED=no\nCONFIG_IPV4=yes\nCONFIG_IPV6=no\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/gre1/ipv4address\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>10.10.10.0/31\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>BR-RTR:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p /etc/net/ifaces/gre1\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/gre1/options\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>TYPE=iptun\nTUNTYPE=gre\nHOST=ens33\nTUNLOCAL=172.16.2.2\nTUNREMOTE=172.16.1.2\nTUNOPTIONS='ttl 64'\nMTU=1476\nBOOTPROTO=static\nONBOOT=yes\nDISABLED=no\nNM_CONTROLLED=no\nSYSTEMD_CONTROLLED=no\nCONFIG_IPV4=yes\nCONFIG_IPV6=no\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/gre1/ipv4address\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>10.10.10.1/31\u003c/code>\u003c/pre>\u003c/div>\u003cp>На обоих маршрутизаторах примените:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>modprobe ip_gre\nifup gre1\nip -d link show gre1\nip -4 address show gre1\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если gre1 уже поднят со старой конфигурацией: \u003ccode>ifdown gre1\u003c/code>, затем \u003ccode>ifup gre1\u003c/code>. Параметры будут подниматься через etcnet и после перезагрузки. Проверьте, что MTU в выводе равен 1476.\u003c/p>\n\u003cp>Проверка с HQ-RTR:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>ping -c 3 172.16.2.2\nping -c 3 10.10.10.1\u003c/code>\u003c/pre>\u003c/div>","search":"gre между hq-rtr и br-rtr через etcnet \n**hq-rtr:**\n\n```bash\nmkdir -p /etc/net/ifaces/gre1\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/gre1/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=iptun\ntuntype=gre\nhost=ens33\ntunlocal=172.16.1.2\ntunremote=172.16.2.2\ntunoptions='ttl 64'\nmtu=1476\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/gre1/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n10.10.10.0/31\n```\n\n**br-rtr:**\n\n```bash\nmkdir -p /etc/net/ifaces/gre1\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/gre1/options\n```\n\nвпишите содержимое и сохраните:\n\n```text\ntype=iptun\ntuntype=gre\nhost=ens33\ntunlocal=172.16.2.2\ntunremote=172.16.1.2\ntunoptions='ttl 64'\nmtu=1476\nbootproto=static\nonboot=yes\ndisabled=no\nnm_controlled=no\nsystemd_controlled=no\nconfig_ipv4=yes\nconfig_ipv6=no\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/gre1/ipv4address\n```\n\nвпишите содержимое и сохраните:\n\n```text\n10.10.10.1/31\n```\n\nна обоих маршрутизаторах примените:\n\n```bash\nmodprobe ip_gre\nifup gre1\nip -d link show gre1\nip -4 address show gre1\n```\n\nесли gre1 уже поднят со старой конфигурацией: `ifdown gre1`, затем `ifup gre1`. параметры будут подниматься через etcnet и после перезагрузки. проверьте, что mtu в выводе равен 1476.\n\nпроверка с hq-rtr:\n\n```bash\nping -c 3 172.16.2.2\nping -c 3 10.10.10.1\n```\n\n"},{"id":"m1-7","module":1,"n":7,"title":"OSPF и MD5","goal":"Обеспечить доступность офис

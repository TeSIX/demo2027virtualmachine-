ных сетей через OSPF и защитить соседство MD5.","html":"\u003cp>В тексте КИМ есть неоднозначность: на BR-RTR OSPF предписан только на GRE, но BR-FW должен участвовать через линк к BR-RTR. Чтобы BR-FW действительно установил соседство, на BR-RTR OSPF необходим \u003cstrong>ещё на линке к BR-FW\u003c/strong>. Ниже рабочий вариант с GRE и этой внутренней связью; на WAN к ISP OSPF не включён. Зафиксируйте это решение в отчёте.\u003c/p>\n\u003cp>\u003cstrong>HQ-RTR, BR-RTR, BR-FW:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install frr\nnano /etc/frr/daemons\u003c/code>\u003c/pre>\u003c/div>\u003cp>Замените \u003ccode>ospfd=no\u003c/code> на \u003ccode>ospfd=yes\u003c/code>, сохраните файл и выйдите. Затем:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>grep '^ospfd=' /etc/frr/daemons\nsystemctl enable --now frr\nsystemctl restart frr\u003c/code>\u003c/pre>\u003c/div>\u003cp>При открытии \u003ccode>/etc/frr/daemons\u003c/code> замените \u003ccode>ospfd=no\u003c/code> на \u003ccode>ospfd=yes\u003c/code>; если строки нет, добавьте её. Сохраните файл до выполнения следующих команд. Дальше каждый блок вводится через \u003ccode>vtysh\u003c/code> на соответствующей машине. Строки до \u003ccode>end\u003c/code> — команды FRR, не Bash.\u003c/p>\n\u003cp>\u003cstrong>HQ-RTR:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box console\">\u003cdiv class=\"command-caption\">\u003cspan>Консоль FRR · вводите по строкам\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>vtysh\nconfigure terminal\ninterface gre1\n ip ospf network point-to-point\n ip ospf authentication message-digest\n ip ospf message-digest-key 1 md5 P@ssw0rd\nexit\nrouter ospf\n ospf router-id 1.1.1.1\n passive-interface default\n no passive-interface gre1\n network 10.10.10.0/31 area 0\n network 192.168.100.0/27 area 0\n network 192.168.200.0/28 area 0\n network 192.168.99.0/29 area 0\nexit\nend\nwrite memory\nexit\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>BR-RTR:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box console\">\u003cdiv class=\"command-caption\">\u003cspan>Консоль FRR · вводите по строкам\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>vtysh\nconfigure terminal\ninterface gre1\n ip ospf network point-to-point\n ip ospf authentication message-digest\n ip ospf message-digest-key 1 md5 P@ssw0rd\nexit\ninterface ens37\n ip ospf network point-to-point\nexit\nrouter ospf\n ospf router-id 2.2.2.2\n passive-interface default\n no passive-interface gre1\n no passive-interface ens37\n network 10.10.10.0/31 area 0\n network 192.168.10.0/31 area 0\nexit\nend\nwrite memory\nexit\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>BR-FW:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box console\">\u003cdiv class=\"command-caption\">\u003cspan>Консоль FRR · вводите по строкам\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>vtysh\nconfigure terminal\ninterface ens33\n ip ospf network point-to-point\nexit\nrouter ospf\n ospf router-id 3.3.3.3\n passive-interface default\n no passive-interface ens33\n network 192.168.10.0/31 area 0\n network 192.168.30.0/28 area 0\nexit\nend\nwrite memory\nexit\u003c/code>\u003c/pre>\u003c/div>\u003cp>На BR-FW сеть сервера анонсируется пассивно: Hello в сторону BR-SRV не отправляются. Проверка:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>vtysh -c 'show ip ospf neighbor'\nvtysh -c 'show ip ospf interface gre1'\nvtysh -c 'show ip route ospf'\u003c/code>\u003c/pre>\u003c/div>\u003cp>Соседства FULL: HQ-RTR ↔ BR-RTR, BR-RTR ↔ BR-FW. На HQ-RTR должен появиться маршрут 192.168.30.0/28, на BR-FW — сети HQ.\u003c/p>\n","search":"ospf и md5 \nв тексте ким есть неоднозначность: на br-rtr ospf предписан только на gre, но br-fw должен участвовать через линк к br-rtr. чтобы br-fw действительно установил соседство, на br-rtr ospf необходим **ещё на линке к br-fw**. ниже рабочий вариант с gre и этой внутренней связью; на wan к isp ospf не включён. зафиксируйте это решение в отчёте.\n\n**hq-rtr, br-rtr, br-fw:**\n\n```bash\napt-get install frr\nnano /etc/frr/daemons\n```\n\nзамените `ospfd=no` на `ospfd=yes`, сохраните файл и выйдите. затем:\n\n```bash\ngrep '^ospfd=' /etc/frr/daemons\nsystemctl enable --now frr\nsystemctl restart frr\n```\n\nпри открытии `/etc/frr/daemons` замените `ospfd=no` на `ospfd=yes`; если строки нет, добавьте её. сохраните файл до выполнения следующих команд. дальше каждый блок вводится через `vtysh` на соответствующей машине. строки до `end` — команды frr, не bash.\n\n**hq-rtr:**\n\n```text\nvtysh\nconfigure terminal\ninterface gre1\n ip ospf network point-to-point\n ip ospf authentication message-digest\n ip ospf message-digest-key 1 md5 p@ssw0rd\nexit\nrouter ospf\n ospf router-id 1.1.1.1\n passive-interface default\n no passive-interface gre1\n network 10.10.10.0/31 area 0\n network 192.168.100.0/27 area 0\n network 192.168.200.0/28 area 0\n network 192.168.99.0/29 area 0\nexit\nend\nwrite memory\nexit\n```\n\n**br-rtr:**\n\n```text\nvtysh\nconfigure terminal\ninterface gre1\n ip ospf network point-to-point\n ip ospf authentication message-digest\n ip ospf message-digest-key 1 md5 p@ssw0rd\nexit\ninterface ens37\n ip ospf network point-to-point\nexit\nrouter ospf\n ospf router-id 2.2.2.2\n passive-interface default\n no passive-interface gre1\n no passive-interface ens37\n network 10.10.10.0/31 area 0\n network 192.168.10.0/31 area 0\nexit\nend\nwrite memory\nexit\n```\n\n**br-fw:**\n\n```text\nvtysh\nconfigure terminal\ninterface ens33\n ip ospf network point-to-point\nexit\nrouter ospf\n ospf router-id 3.3.3.3\n passive-interface default\n no passive-interface ens33\n network 192.168.10.0/31 area 0\n network 192.168.30.0/28 area 0\nexit\nend\nwrite memory\nexit\n```\n\nна br-fw сеть сервера анонсируется пассивно: hello в сторону br-srv не отправляются. проверка:\n\n```bash\nvtysh -c 'show ip ospf neighbor'\nvtysh -c 'show ip ospf interface gre1'\nvtysh -c 'show ip route ospf'\n```\n\nсоседства full: hq-rtr ↔ br-rtr, br-rtr ↔ br-fw. на hq-rtr должен появиться маршрут 192.168.30.0/28, на br-fw — сети hq.\n\n"},{"id":"m1-8","module":1,"n":8,"title":"Проверка NAT офисов","goal":"Проверить динамическую трансляцию адресов и Интернет из обоих офисов.","html":"\u003cp>Правила уже созданы в пункте 2. После OSPF с \u003cstrong>HQ-SRV и BR-SRV\u003c/strong>:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>ping -c 3 77.88.8.8\ncurl -I https://www.altlinux.org\u003c/code>\u003c/pre>\u003c/div>\u003cp>На BR-FW дополнительный NAT не нужен: он маршрутизирует сеть BR-SRV, а BR-RTR выполняет её трансляцию к ISP. Отсутствие ответа ICMP само по себе не доказывает неисправность: также проверьте HTTPS и таблицы маршрутов.\u003c/p>\n","search":"проверка nat офисов \nправила уже созданы в пункте 2. после ospf с **hq-srv и br-srv**:\n\n```bash\nping -c 3 77.88.8.8\ncurl -i https://www.altlinux.org\n```\n\nна br-fw дополнительный nat не нужен: он маршрутизирует сеть br-srv, а br-rtr выполняет её трансляцию к isp. отсутствие ответа icmp само по себе не доказывает неисправность: также проверьте https и таблицы маршрутов.\n\n"},{"id":"m1-9","module":1,"n":9,"title":"DHCP на HQ-RTR","goal":"Настроить DHCP на HQ-RTR для HQ-CLI: пул, шлюз, DNS и доменный суффикс.","html":"\u003cp>Узнайте MAC \u003cstrong>HQ-CLI\u003c/strong>: \u003ccode>ip link show ens33\u003c/code> (MAC находится после link/ether). В следующем файле замените пример MAC на реальный. Резерв нужен для стабильной A-записи HQ-CLI.\u003c/p>\n\u003cp>\u003cstrong>HQ-RTR:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install dnsmasq\ncp -a /etc/dnsmasq.conf /etc/dnsmasq.conf.before-exam\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/dnsmasq.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>port=0\ninterface=vlan200\nbind-interfaces\ndhcp-authoritative\ndhcp-range=192.168.200.2,192.168.200.14,255.255.255.240,12h\ndhcp-option=3,192.168.200.1\ndhcp-option=6,192.168.100.2\ndhcp-option=15,au-team.irpo\ndhcp-host=52:54:00:12:34:56,192.168.200.2,hq-cli,infinite\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>dnsmasq --test\nsystemctl enable --now dnsmasq\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>HQ-CLI:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>ifdown ens33\nifup ens33\nip -4 address show ens33\nip route\nless /etc/resolv.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Etcnet/DHCP-клиент должны применить адрес, маршрут, DNS 192.168.100.2 и search-домен au-team.irpo. Проверьте итоговый \u003ccode>/etc/resolv.conf\u003c/code>. Если DNS не применился, проверьте DHCP-опции и работу resolvconf; не оставляйте на HQ-CLI старый внешний DNS, перекрывающий доменный. Переподнятие ens33 выполняйте из консоли ВМ, так как SSH-сессия прервётся.\u003c/p>\n","search":"dhcp на hq-rtr \nузнайте mac **hq-cli**: `ip link show ens33` (mac находится после link/ether). в следующем файле замените пример mac на реальный. резерв нужен для стабильной a-записи hq-cli.\n\n**hq-rtr:**\n\n```bash\napt-get install dnsmasq\ncp -a /etc/dnsmasq.conf /etc/dnsmasq.conf.before-exam\n```\n\nоткройте файл:\n\n```bash\nnano /etc/dnsmasq.conf\n```\n\nвпишите содержимое и сохраните:\n\n```text\nport=0\ninterface=vlan200\nbind-interfaces\ndhcp-authoritative\ndhcp-range=192.168.200.2,192.168.200.14,255.255.255.240,12h\ndhcp-option=3,192.168.200.1\ndhcp-option=6,192.168.100.2\ndhcp-option=15,au-team.irpo\ndhcp-host=52:54:00:12:34:56,192.168.200.2,hq-cli,infinite\n```\n\n```bash\ndnsmasq --test\nsystemctl enable --now dnsmasq\n```\n\n**hq-cli:**\n\n```bash\nifdown ens33\nifup ens33\nip -4 address show ens33\nip route\nless /etc/resolv.conf\n```\n\netcnet/dhcp-клиент должны применить адрес, маршрут, dns 192.168.100.2 и search-домен au-team.irpo. проверьте итоговый `/etc/resolv.conf`. если dns не применился, проверьте dhcp-опции и работу resolvconf; не оставляйте на hq-cli старый внешний dns, перекрывающий доменный. переподнятие ens33 выполняйте из консоли вм, так как ssh-сессия прервётся.\n\n"},{"id":"m1-10","module":1,"n":10,"title":"DNS на HQ-SRV","goal":"Настроить A/PTR-записи устройств на HQ-SRV и пересылку внешних DNS-запросов.","html":"\u003cp>Для модуля 1 используем dnsmasq как основной DNS с A/PTR и пересылкой. \u003cstrong>В модуле 2 контроллер домена BR-SRV уже имеет собственный AD DNS: сохраните его и настройте пересылку доменной зоны, не подменяйте его этим конфигом.\u003c/strong>\u003c/p>\n\u003cp>\u003cstrong>HQ-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install dnsmasq bind-utils\nss -lntup | grep ':53 '\n# Если порт 53 уже занят другой DNS-службой, используйте её либо остановите\n# её осознанно на чистом стенде; два DNS не должны слушать один адрес.\ncp -a /etc/dnsmasq.conf /etc/dnsmasq.conf.before-exam\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/dnsmasq.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>interface=ens33\nlisten-address=127.0.0.1,192.168.100.2\nbind-interfaces\nno-resolv\nserver=77.88.8.8\nserver=77.88.8.1\ndomain=au-team.irpo\nlocal=/au-team.irpo/\nhost-record=hq-rtr.au-team.irpo,192.168.100.1\nhost-record=br-rtr.au-team.irpo,192.168.10.0\nhost-record=br-fw.au-team.irpo,192.168.30.1\nhost-record=hq-srv.au-team.irpo,192.168.100.2\nhost-record=hq-cli.au-team.irpo,192.168.200.2\nhost-record=br-srv.au-team.irpo,192.168.30.2\nhost-record=docker.au-team.irpo,172.16.1.1\nhost-record=web.au-team.irpo,172.16.2.1\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>dnsmasq --test\nsystemctl enable --now dnsmasq\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens33/resolv.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>search au-team.irpo\nnameserver 127.0.0.1\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/resolv.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>search au-team.irpo\nnameserver 127.0.0.1\u003c/code>\u003c/pre>\u003c/div>\u003cp>На \u003cstrong>BR-SRV\u003c/strong> сохраните DNS в \u003ccode>/etc/net/ifaces/ens33/resolv.conf\u003c/code>:\u003c/p>\n\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/net/ifaces/ens33/resolv.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>search au-team.irpo\nnameserver 192.168.100.2\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/resolv.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>search au-team.irpo\nnameserver 192.168.100.2\u003c/code>\u003c/pre>\u003c/div>\u003cp>HQ-CLI получает этот DNS по DHCP. На маршрутизаторах и ISP можно сохранить внешний DNS; для проверки внутренних имён используйте HQ-SRV. После перезапуска сети проверьте \u003ccode>/etc/resolv.conf\u003c/code> повторно.\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>dig @192.168.100.2 hq-srv.au-team.irpo A +short\ndig @192.168.100.2 br-srv.au-team.irpo A +short\ndig @192.168.100.2 -x 192.168.100.2 +short\ndig @192.168.100.2 -x 192.168.30.2 +short\ndig @192.168.100.2 docker.au-team.irpo +short\ndig @192.168.100.2 web.au-team.irpo +short\ndig @192.168.100.2 altlinux.org +short\u003c/code>\u003c/pre>\u003c/div>\u003cp>Обратите внимание: по таблице КИМ \u003cstrong>docker → ISP со стороны HQ (172.16.1.1)\u003c/strong>, \u003cstrong>web → ISP со стороны BR (172.16.2.1)\u003c/strong>. Позднее reverse proxy направит docker на BR-SRV, а web на HQ-SRV.\u003c/p>\n","search":"dns на hq-srv \nдля модуля 1 используем dnsmasq как основной dns с a/ptr и пересылкой. **в модуле 2 контроллер домена br-srv уже имеет собственный ad dns: сохраните его и настройте пересылку доменной зоны, не подменяйте его этим конфигом.**\n\n**hq-srv:**\n\n```bash\napt-get install dnsmasq bind-utils\nss -lntup | grep ':53 '\n# если порт 53 уже занят другой dns-службой, используйте её либо остановите\n# её осознанно на чистом стенде; два dns не должны слушать один адрес.\ncp -a /etc/dnsmasq.conf /etc/dnsmasq.conf.before-exam\n```\n\nоткройте файл:\n\n```bash\nnano /etc/dnsmasq.conf\n```\n\nвпишите содержимое и сохраните:\n\n```text\ninterface=ens33\nlisten-address=127.0.0.1,192.168.100.2\nbind-interfaces\nno-resolv\nserver=77.88.8.8\nserver=77.88.8.1\ndomain=au-team.irpo\nlocal=/au-team.irpo/\nhost-record=hq-rtr.au-team.irpo,192.168.100.1\nhost-record=br-rtr.au-team.irpo,192.168.10.0\nhost-record=br-fw.au-team.irpo,192.168.30.1\nhost-record=hq-srv.au-team.irpo,192.168.100.2\nhost-record=hq-cli.au-team.irpo,192.168.200.2\nhost-record=br-srv.au-team.irpo,192.168.30.2\nhost-record=docker.au-team.irpo,172.16.1.1\nhost-record=web.au-team.irpo,172.16.2.1\n```\n\n```bash\ndnsmasq --test\nsystemctl enable --now dnsmasq\n```\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/resolv.conf\n```\n\nвпишите содержимое и сохраните:\n\n```text\nsearch au-team.irpo\nnameserver 127.0.0.1\n```\n\nоткройте файл:\n\n```bash\nnano /etc/resolv.conf\n```\n\nвпишите содержимое и сохраните:\n\n```text\nsearch au-team.irpo\nnameserver 127.0.0.1\n```\n\nна **br-srv** сохраните dns в `/etc/net/ifaces/ens33/resolv.conf`:\n\nоткройте файл:\n\n```bash\nnano /etc/net/ifaces/ens33/resolv.conf\n```\n\nвпишите содержимое и сохраните:\n\n```text\nsearch au-team.irpo\nnameserver 192.168.100.2\n```\n\nоткройте файл:\n\n```bash\nnano /etc/resolv.conf\n```\n\nвпишите содержимое и сохраните:\n\n```text\nsearch au-team.irpo\nnameserver 192.168.100.2\n```\n\nhq-cli получает этот dns по dhcp. на маршрутизаторах и isp можно сохранить внешний dns; для проверки внутренних имён используйте hq-srv. после перезапуска сети проверьте `/etc/resolv.conf` повторно.\n\n```bash\ndig @192.168.100.2 hq-srv.au-team.irpo a +short\ndig @192.168.100.2 br-srv.au-team.irpo a +short\ndig @192.168.100.2 -x 192.168.100.2 +short\ndig @192.168.100.2 -x 192.168.30.2 +short\ndig @192.168.100.2 docker.au-team.irpo +short\ndig @192.168.100.2 web.au-team.irpo +short\ndig @192.168.100.2 altlinux.org +short\n```\n\nобратите внимание: по таблице ким **docker → isp со стороны hq (172.16.1.1)**, **web → isp со стороны br (172.16.2.1)**. позднее reverse proxy направит docker на br-srv, а web на hq-srv.\n\n"},{"id":"m1-11","module":1,"n":11,"title":"Часовой пояс и итоговая проверка","goal":"Проверить часовой пояс, сохранение настроек после перезагрузки и подготовить отчёт.","html":"\u003cp>На всех Linux-устройствах проверьте и при необходимости задайте часовой пояс площадки:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>timedatectl set-timezone Asia/Irkutsk\ntimedatectl\u003c/code>\u003c/pre>\u003c/div>\u003cp>Для другого региона замените Asia/Irkutsk.\u003c/p>\n\u003cp>Проверьте часовой пояс, затем перезагрузите машины и повторите проверки: адреса, VLAN, GRE, соседства OSPF, NAT, DHCP и DNS должны сохраниться.\u003c/p>\n\u003cp>В отчёт включите адресную таблицу; схему и режимы портов VLAN; адреса/маску GRE; конфигурацию и соседства OSPF с MD5; DHCP-пул, исключение адреса шлюза и аренду HQ-CLI; DNS A/PTR; результаты SSH; \u003ccode>timedatectl\u003c/code>.\u003c/p>\n","search":"часовой пояс и итоговая проверка на всех linux-устройствах проверьте и при необходимости задайте часовой пояс площадки:\n\n```bash\ntimedatectl set-timezone asia/irkutsk\ntimedatectl\n```\n\nдля другого региона замените asia/irkutsk.\n\n\nпроверьте часовой пояс, затем перезагрузите машины и повторите проверки: адреса, vlan, gre, соседства ospf, nat, dhcp и dns должны сохраниться.\n\nв отчёт включите адресную таблицу; схему и режимы портов vlan; адреса/маску gre; конфигурацию и соседства ospf с md5; dhcp-пул, исключение адреса шлюза и аренду hq-cli; dns a/ptr; результаты ssh; `timedatectl`.\n"}]},{"n":2,"title":"Организация сетевого администрирования","preparation":"\u003cp>Основа: задание 2, страницы 51–57 КИМ. Стенд отдельный, Samba DC уже работает на BR-SRV. Здесь \u003cstrong>не выполняем domain provision\u003c/strong> и не меняем готовую сеть.\u003c/p>\n\u003cp>Адреса ниже взяты из учебного плана модуля 1. Если на выданном стенде они другие, замените их, включая подсети NFS, адреса Ansible и DNAT.\u003c/p>\n\u003ch2>Подготовка: ISO, DNS, время\u003c/h2>\n\u003cp>На машинах, которым нужны файлы, подключите \u003ccode>Additional.iso\u003c/code> в виртуальный CD/DVD-привод. В Linux:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>lsblk -f\nmkdir -p /mnt/additional\nmount -o ro /dev/sr0 /mnt/additional\nfind /mnt/additional -maxdepth 3 -type f\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если привод называется иначе, замените \u003ccode>/dev/sr0\u003c/code>. Не монтируйте установочный ISO вместо Additional.iso.\u003c/p>\n\u003cp>Перед вводом HQ-CLI в домен сначала выполните настройку времени из пункта 4. Расхождение часов мешает Kerberos.\u003c/p>\n\u003ch2>Что сохранить в отчёт\u003c/h2>\n\u003cp>Состав группы hq, параметры паролей, доменный вход GNOME и ограничения sudo; \u003ccode>mdadm --detail\u003c/code>, ext4-раздел и mount; экспорт NFS и запись с клиента; stratum ISP и выбранный источник у клиентов; четыре \u003ccode>pong\u003c/code>; работа двух контейнеров и testapp; приложение Apache с БД; DNAT с проверкой с ISP; версия браузера. Перезагрузите узлы и повторно проверьте автозапуск RAID, NFS, chrony, Docker и Apache.\u003c/p>\n","lessons":[{"id":"m2-1","module":2,"n":1,"title":"Samba DC, пользователи и вход HQ-CLI в домен","goal":"Настроить политику паролей и группу hq на существующем Samba DC. Ввести HQ-CLI в домен и ограничить команды sudo.","html":"\u003cp>\u003cstrong>BR-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>testparm -s\nsamba-tool domain info 127.0.0.1\nsamba-tool user list\nsamba-tool domain passwordsettings show\u003c/code>\u003c/pre>\u003c/div>\u003cp>Ожидаемый realm: \u003ccode>AU-TEAM.IRPO\u003c/code>, NetBIOS-домен в примере \u003ccode>AU-TEAM\u003c/code>. Фактический NetBIOS-домен смотрите в \u003ccode>testparm -s\u003c/code>; используйте его вместо AU-TEAM, если стенд настроен иначе.\u003c/p>\n\u003cp>Настроить минимальную длину и блокировку после пяти ошибок:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>samba-tool domain passwordsettings set --min-pwd-length=8 --account-lockout-threshold=5\nsamba-tool group add hq\nsamba-tool user create hquser1 'P@ssw0rd'\nsamba-tool group addmembers hq hquser1\nsamba-tool user create hquser2 'P@ssw0rd'\nsamba-tool group addmembers hq hquser2\nsamba-tool user create hquser3 'P@ssw0rd'\nsamba-tool group addmembers hq hquser3\nsamba-tool user create hquser4 'P@ssw0rd'\nsamba-tool group addmembers hq hquser4\nsamba-tool user create hquser5 'P@ssw0rd'\nsamba-tool group addmembers hq hquser5\nsamba-tool group listmembers hq\nsamba-tool domain passwordsettings show\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если группа/пользователь уже созданы, проверьте их и выполните только недостающие действия. Пароль пользователей выбран для тренировки: КИМ задаёт для них политику, а не конкретный пароль.\u003c/p>\n\u003ch3>DNS домена\u003c/h3>\n\u003cp>\u003cstrong>HQ-CLI должен получать через HQ-SRV не только A-записи, но и SRV-записи AD.\u003c/strong> Проверьте:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>dig @192.168.100.2 _ldap._tcp.dc._msdcs.au-team.irpo SRV +short\ndig @192.168.100.2 _kerberos._udp.au-team.irpo SRV +short\ndig @192.168.100.2 br-srv.au-team.irpo A +short\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если SRV не возвращаются, проверьте их непосредственно на BR-SRV:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>dig @192.168.30.2 _ldap._tcp.dc._msdcs.au-team.irpo SRV +short\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если записи есть на BR-SRV, настройте на \u003cstrong>существующем DNS HQ-SRV\u003c/strong> условную пересылку зоны \u003ccode>au-team.irpo\u003c/code> на \u003ccode>192.168.30.2\u003c/code>. Для dnsmasq из учебного модуля 1: уберите \u003ccode>local=/au-team.irpo/\u003c/code>, добавьте \u003ccode>server=/au-team.irpo/192.168.30.2\u003c/code>, сохраните нужные host-record и выполните \u003ccode>dnsmasq --test\u003c/code>, \u003ccode>systemctl restart dnsmasq\u003c/code>. Для BIND эквивалентная зона — \u003ccode>type forward; forward only; forwarders { 192.168.30.2; };\u003c/code>. Не добавляйте её поверх уже существующей master-зоны того же имени: требуется осознанно изменить конфигурацию этой зоны.\u003c/p>\n\u003cp>На AD DNS должна существовать запись HQ-CLI с актуальным адресом. Проверяйте прямое и обратное разрешение BR-SRV. Не удаляйте зоны AD или базы Samba ради исправления одной записи.\u003c/p>\n\u003ch3>Ввод HQ-CLI в домен\u003c/h3>\n\u003cp>\u003cstrong>HQ-CLI, Альт Сервер 11.1 с GNOME:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install task-auth-ad-sssd bind-utils sudo\ncontrol sudo public\nhostnamectl set-hostname hq-cli.au-team.irpo\ngetent hosts br-srv.au-team.irpo\nchronyc tracking\nsystem-auth write ad au-team.irpo hq-cli AU-TEAM administrator 'ПАРОЛЬ_АДМИНИСТРАТОРА_ДОМЕНА'\nreboot\u003c/code>\u003c/pre>\u003c/div>\u003cp>В команде system-auth замените текст в кавычках на выданный пароль администратора домена.\u003c/p>\n\u003cp>После перезагрузки:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>system-auth status\nsystemctl status sssd --no-pager\nid 'hquser1@au-team.irpo'\ngetent group 'hq@au-team.irpo'\u003c/code>\u003c/pre>\u003c/div>\u003cp>В GNOME выйдите из локальной сессии, выберите «Нет в списке?» и войдите как \u003ccode>hquser1@au-team.irpo\u003c/code>. Это обязательная практическая проверка PAM/GDM, одного \u003ccode>id\u003c/code> недостаточно. Если домашняя папка не создаётся, проверьте наличие pam_mkhomedir в PAM и настройку создания home через штатную схему system-auth.\u003c/p>\n\u003ch3>Только cat, grep, id через sudo для группы hq\u003c/h3>\n\u003cp>В ALT команда \u003ccode>control sudo public\u003c/code> разрешает всем пользователям \u003cstrong>запускать сам sudo\u003c/strong>; выполняемые через него команды по-прежнему ограничиваются sudoers. Это нужно, потому что штатная политика \u003ccode>wheelonly\u003c/code> может не допускать доменную группу к бинарнику sudo. Не включайте группу hq в wheel ради обхода этого ограничения: она может получить лишние права. \u003ca href=\"https://docs.altlinux.org/ru-RU/alt-admin/11.1/html/alt-admin/control.html\">Документация control в ALT 11.1\u003c/a>.\u003c/p>\n\u003cp>На \u003cstrong>HQ-CLI\u003c/strong>:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>command -v cat grep id\ngetent group 'hq@au-team.irpo'\nnano /etc/sudoers.d/hq\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если SSSD показывает группу \u003ccode>hq@au-team.irpo\u003c/code>, содержимое файла:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>%hq@au-team.irpo ALL=(root) /usr/bin/cat, /usr/bin/grep, /usr/bin/id\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если NSS возвращает короткое имя \u003ccode>hq\u003c/code>, используйте \u003ccode>%hq\u003c/code>. Пути возьмите из \u003ccode>command -v\u003c/code>, если они отличаются. Затем:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>chmod 440 /etc/sudoers.d/hq\nvisudo -c\nsudo -l -U 'hquser1@au-team.irpo'\u003c/code>\u003c/pre>\u003c/div>\u003cp>В терминале доменного пользователя:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>sudo /usr/bin/id\nsudo /usr/bin/cat /etc/hostname\nsudo /usr/bin/grep root /etc/passwd\nsudo /usr/bin/bash\u003c/code>\u003c/pre>\u003c/div>\u003cp>Последняя команда должна быть запрещена. Убедитесь, что группа hq и её пользователи не получили \u003ccode>ALL\u003c/code> через wheel, другой локальный sudoers или доменную политику. Сам sshuser на сервере сохраняет свои административные права.\u003c/p>\n","search":"samba dc, пользователи и вход hq-cli в домен \n**br-srv:**\n\n```bash\ntestparm -s\nsamba-tool domain info 127.0.0.1\nsamba-tool user list\nsamba-tool domain passwordsettings show\n```\n\nожидаемый realm: `au-team.irpo`, netbios-домен в примере `au-team`. фактический netbios-домен смотрите в `testparm -s`; используйте его вместо au-team, если стенд настроен иначе.\n\nнастроить минимальную длину и блокировку после пяти ошибок:\n\n```bash\nsamba-tool domain passwordsettings set --min-pwd-length=8 --account-lockout-threshold=5\nsamba-tool group add hq\nsamba-tool user create hquser1 'p@ssw0rd'\nsamba-tool group addmembers hq hquser1\nsamba-tool user create hquser2 'p@ssw0rd'\nsamba-tool group addmembers hq hquser2\nsamba-tool user create hquser3 'p@ssw0rd'\nsamba-tool group addmembers hq hquser3\nsamba-tool user create hquser4 'p@ssw0rd'\nsamba-tool group addmembers hq hquser4\nsamba-tool user create hquser5 'p@ssw0rd'\nsamba-tool group addmembers hq hquser5\nsamba-tool group listmembers hq\nsamba-tool domain passwordsettings show\n```\n\nесли группа/пользователь уже созданы, проверьте их и выполните только недостающие действия. пароль пользователей выбран для тренировки: ким задаёт для них политику, а не конкретный пароль.\n\n### dns домена\n\n**hq-cli должен получать через hq-srv не только a-записи, но и srv-записи ad.** проверьте:\n\n```bash\ndig @192.168.100.2 _ldap._tcp.dc._msdcs.au-team.irpo srv +short\ndig @192.168.100.2 _kerberos._udp.au-team.irpo srv +short\ndig @192.168.100.2 br-srv.au-team.irpo a +short\n```\n\nесли srv не возвращаются, проверьте их непосредственно на br-srv:\n\n```bash\ndig @192.168.30.2 _ldap._tcp.dc._msdcs.au-team.irpo srv +short\n```\n\nесли записи есть на br-srv, настройте на **существующем dns hq-srv** условную пересылку зоны `au-team.irpo` на `192.168.30.2`. для dnsmasq из учебного модуля 1: уберите `local=/au-team.irpo/`, добавьте `server=/au-team.irpo/192.168.30.2`, сохраните нужные host-record и выполните `dnsmasq --test`, `systemctl restart dnsmasq`. для bind эквивалентная зона — `type forward; forward only; forwarders { 192.168.30.2; };`. не добавляйте её поверх уже существующей master-зоны того же имени: требуется осознанно изменить конфигурацию этой зоны.\n\nна ad dns должна существовать запись hq-cli с актуальным адресом. проверяйте прямое и обратное разрешение br-srv. не удаляйте зоны ad или базы samba ради исправления одной записи.\n\n### ввод hq-cli в домен\n\n**hq-cli, альт сервер 11.1 с gnome:**\n\n```bash\napt-get install task-auth-ad-sssd bind-utils sudo\ncontrol sudo public\nhostnamectl set-hostname hq-cli.au-team.irpo\ngetent hosts br-srv.au-team.irpo\nchronyc tracking\nsystem-auth write ad au-team.irpo hq-cli au-team administrator 'пароль_администратора_домена'\nreboot\n```\n\nв команде system-auth замените текст в кавычках на выданный пароль администратора домена.\n\nпосле перезагрузки:\n\n```bash\nsystem-auth status\nsystemctl status sssd --no-pager\nid 'hquser1@au-team.irpo'\ngetent group 'hq@au-team.irpo'\n```\n\nв gnome выйдите из локальной сессии, выберите «нет в списке?» и войдите как `hquser1@au-team.irpo`. это обязательная практическая проверка pam/gdm, одного `id` недостаточно. если домашняя папка не создаётся, проверьте наличие pam_mkhomedir в pam и настройку создания home через штатную схему system-auth.\n\n### только cat, grep, id через sudo для группы hq\n\nв alt команда `control sudo public` разрешает всем пользователям **запускать сам sudo**; выполняемые через него команды по-прежнему ограничиваются sudoers. это нужно, потому что штатная политика `wheelonly` может не допускать доменную группу к бинарнику sudo. не включайте группу hq в wheel ради обхода этого ограничения: она может получить лишние права. [документация control в alt 11.1](https://docs.altlinux.org/ru-ru/alt-admin/11.1/html/alt-admin/control.html).\n\nна **hq-cli**:\n\n```bash\ncommand -v cat grep id\ngetent group 'hq@au-team.irpo'\nnano /etc/sudoers.d/hq\n```\n\nесли sssd показывает группу `hq@au-team.irpo`, содержимое файла:\n\n```sudoers\n%hq@au-team.irpo all=(root) /usr/bin/cat, /usr/bin/grep, /usr/bin/id\n```\n\nесли nss возвращает короткое имя `hq`, используйте `%hq`. пути возьмите из `command -v`, если они отличаются. затем:\n\n```bash\nchmod 440 /etc/sudoers.d/hq\nvisudo -c\nsudo -l -u 'hquser1@au-team.irpo'\n```\n\nв терминале доменного пользователя:\n\n```bash\nsudo /usr/bin/id\nsudo /usr/bin/cat /etc/hostname\nsudo /usr/bin/grep root /etc/passwd\nsudo /usr/bin/bash\n```\n\nпоследняя команда должна быть запрещена. убедитесь, что группа hq и её пользователи не получили `all` через wheel, другой локальный sudoers или доменную политику. сам sshuser на сервере сохраняет свои административные права.\n\n"},{"id":"m2-2","module":2,"n":2,"title":"RAID 0 на HQ-SRV","goal":"Создать RAID 0 из двух дополнительных дисков, раздел ext4 и автомонтирование в /raid.","html":"\u003cp>Следующие команды форматируют \u003cstrong>только два дополнительных пустых диска по 1 ГБ\u003c/strong>. Сначала по \u003ccode>lsblk\u003c/code> подтвердите их имена. \u003ccode>/dev/sdb\u003c/code> и \u003ccode>/dev/sdc\u003c/code> ниже — пример, системный диск выбирать нельзя.\u003c/p>\n\u003cp>\u003cstrong>HQ-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install mdadm e2fsprogs parted\nlsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS,MODEL,SERIAL\nwipefs -n /dev/sdb /dev/sdc\u003c/code>\u003c/pre>\u003c/div>\u003cp>После проверки, что это нужные дополнительные диски без данных:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mdadm --create /dev/md0 --level=0 --raid-devices=2 /dev/sdb /dev/sdc\nless /proc/mdstat\nmdadm --detail /dev/md0\nparted -s /dev/md0 mklabel gpt\nparted -s /dev/md0 mkpart primary ext4 1MiB 100%\npartprobe /dev/md0\nudevadm settle\nlsblk /dev/md0\nmkfs.ext4 -L RAID /dev/md0p1\nmkdir -p /raid\nmdadm --detail --scan\u003c/code>\u003c/pre>\u003c/div>\u003cp>Строку \u003ccode>ARRAY ...\u003c/code> для нового массива из вывода внесите в \u003ccode>/etc/mdadm.conf\u003c/code> \u003cstrong>один раз\u003c/strong>, сохранив прочее содержимое. Получите UUID раздела:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>blkid /dev/md0p1\u003c/code>\u003c/pre>\u003c/div>\u003cp>В \u003ccode>/etc/fstab\u003c/code> добавьте одну строку с фактическим UUID:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/fstab\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>UUID=ВСТАВЬТЕ_UUID_РАЗДЕЛА /raid ext4 defaults 0 2\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>systemctl daemon-reload\nmount /raid\nfindmnt /raid\u003c/code>\u003c/pre>\u003c/div>\u003cp>Требуется именно раздел \u003ccode>/dev/md0p1\u003c/code> с ext4, а не только файловая система на всём md0. RAID 0 не переживает отказ одного из дисков; здесь выбран по условию задания.\u003c/p>\n","search":"raid 0 на hq-srv \nследующие команды форматируют **только два дополнительных пустых диска по 1 гб**. сначала по `lsblk` подтвердите их имена. `/dev/sdb` и `/dev/sdc` ниже — пример, системный диск выбирать нельзя.\n\n**hq-srv:**\n\n```bash\napt-get install mdadm e2fsprogs parted\nlsblk -o name,size,type,fstype,mountpoints,model,serial\nwipefs -n /dev/sdb /dev/sdc\n```\n\nпосле проверки, что это нужные дополнительные диски без данных:\n\n```bash\nmdadm --create /dev/md0 --level=0 --raid-devices=2 /dev/sdb /dev/sdc\nless /proc/mdstat\nmdadm --detail /dev/md0\nparted -s /dev/md0 mklabel gpt\nparted -s /dev/md0 mkpart primary ext4 1mib 100%\npartprobe /dev/md0\nudevadm settle\nlsblk /dev/md0\nmkfs.ext4 -l raid /dev/md0p1\nmkdir -p /raid\nmdadm --detail --scan\n```\n\nстроку `array ...` для нового массива из вывода внесите в `/etc/mdadm.conf` **один раз**, сохранив прочее содержимое. получите uuid раздела:\n\n```bash\nblkid /dev/md0p1\n```\n\nв `/etc/fstab` добавьте одну строку с фактическим uuid:\n\n```bash\nnano /etc/fstab\n```\n\n```fstab\nuuid=вставьте_uuid_раздела /raid ext4 defaults 0 2\n```\n\n```bash\nsystemctl daemon-reload\nmount /raid\nfindmnt /raid\n```\n\nтребуется именно раздел `/dev/md0p1` с ext4, а не только файловая система на всём md0. raid 0 не переживает отказ одного из дисков; здесь выбран по условию задания.\n\n"},{"id":"m2-3","module":2,"n":3,"title":"NFS: только клиентская подсеть, чтение и запись","goal":"Экспортировать /raid/nfs для чтения и записи только клиентской подсети. Настроить автомонтирование на HQ-CLI.","html":"\u003cp>\u003cstrong>HQ-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install nfs-server\nmkdir -p /raid/nfs\nchown 65534:65534 /raid/nfs\nchmod 0770 /raid/nfs\u003c/code>\u003c/pre>\u003c/div>\u003cp>В \u003ccode>/etc/exports\u003c/code> добавьте:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/exports\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>/raid/nfs 192.168.200.0/28(rw,sync,all_squash,anonuid=65534,anongid=65534,no_subtree_check)\u003c/code>\u003c/pre>\u003c/div>\u003cp>Здесь клиенты отображаются в единого анонимного владельца: это обеспечивает запись без согласования UID доменных и локальных пользователей. Проверьте \u003ccode>getent passwd 65534\u003c/code> и \u003ccode>getent group 65534\u003c/code>; при другом UID/GID анонимной записи замените значения и владельца согласованно.\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>systemctl enable --now nfs-server\nexportfs -rav\nexportfs -v\u003c/code>\u003c/pre>\u003c/div>\u003cp>Уберите старые экспорты этой папки для \u003ccode>*\u003c/code> или других сетей. На firewall разрешите NFS только из 192.168.200.0/28; для NFSv4 основной порт — TCP 2049. Не открывайте NFS всем подсетям ради теста.\u003c/p>\n\u003cp>\u003cstrong>HQ-CLI:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install nfs-clients\nsystemctl enable --now nfs-client.target\nmkdir -p /mnt/nfs\u003c/code>\u003c/pre>\u003c/div>\u003cp>В \u003ccode>/etc/fstab\u003c/code> добавьте строку:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/fstab\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>192.168.100.2:/raid/nfs /mnt/nfs nfs4 rw,_netdev,x-systemd.automount,x-systemd.idle-timeout=60 0 0\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>systemctl daemon-reload\nsystemctl start mnt-nfs.automount\nls /mnt/nfs\nfindmnt /mnt/nfs\nnano /mnt/nfs/hq-cli-test.txt\nless /mnt/nfs/hq-cli-test.txt\u003c/code>\u003c/pre>\u003c/div>\u003cp>В nano впишите строку \u003ccode>NFS test\u003c/code>, сохраните файл и выйдите. Запись также проверьте из обычной пользовательской сессии. С BR-SRV доступ к этому экспорту должен быть запрещён.\u003c/p>\n","search":"nfs: только клиентская подсеть, чтение и запись \n**hq-srv:**\n\n```bash\napt-get install nfs-server\nmkdir -p /raid/nfs\nchown 65534:65534 /raid/nfs\nchmod 0770 /raid/nfs\n```\n\nв `/etc/exports` добавьте:\n\n```bash\nnano /etc/exports\n```\n\n```exports\n/raid/nfs 192.168.200.0/28(rw,sync,all_squash,anonuid=65534,anongid=65534,no_subtree_check)\n```\n\nздесь клиенты отображаются в единого анонимного владельца: это обеспечивает запись без согласования uid доменных и локальных пользователей. проверьте `getent passwd 65534` и `getent group 65534`; при другом uid/gid анонимной записи замените значения и владельца согласованно.\n\n```bash\nsystemctl enable --now nfs-server\nexportfs -rav\nexportfs -v\n```\n\nуберите старые экспорты этой папки для `*` или других сетей. на firewall разрешите nfs только из 192.168.200.0/28; для nfsv4 основной порт — tcp 2049. не открывайте nfs всем подсетям ради теста.\n\n**hq-cli:**\n\n```bash\napt-get install nfs-clients\nsystemctl enable --now nfs-client.target\nmkdir -p /mnt/nfs\n```\n\nв `/etc/fstab` добавьте строку:\n\n```bash\nnano /etc/fstab\n```\n\n```fstab\n192.168.100.2:/raid/nfs /mnt/nfs nfs4 rw,_netdev,x-systemd.automount,x-systemd.idle-timeout=60 0 0\n```\n\n```bash\nsystemctl daemon-reload\nsystemctl start mnt-nfs.automount\nls /mnt/nfs\nfindmnt /mnt/nfs\nnano /mnt/nfs/hq-cli-test.txt\nless /mnt/nfs/hq-cli-test.txt\n```\n\nв nano впишите строку `nfs test`, сохраните файл и выйдите. запись также проверьте из обычной пользовательской сессии. с br-srv доступ к этому экспорту должен быть запрещён.\n\n"},{"id":"m2-4","module":2,"n":4,"title":"Chrony: ISP — сервер stratum 5","goal":"Настроить ISP как NTP-сервер stratum 5 и синхронизировать необходимые устройства.","html":"\u003cp>\u003cstrong>ISP:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install chrony\ncp -a /etc/chrony.conf /etc/chrony.conf.before-exam\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/chrony.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>server time.cloudflare.com iburst minstratum 4\ndriftfile /var/lib/chrony/drift\nmakestep 1.0 3\nrtcsync\nallow 172.16.1.0/28\nallow 172.16.2.0/28\nallow 192.168.100.0/27\nallow 192.168.200.0/28\nallow 192.168.30.0/28\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>systemctl enable --now chronyd\nsystemctl restart chronyd\nchronyc sources -v\nchronyc tracking\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003ccode>minstratum 4\u003c/code> увеличивает эффективный stratum вышестоящего источника минимум до 4, поэтому ISP после синхронизации должен иметь stratum 5. Выбирайте доступный внешний сервер со stratum не выше 4 и подтвердите \u003cstrong>\u003ccode>Stratum: 5\u003c/code> в tracking\u003c/strong>. Одна строка \u003ccode>local stratum 5\u003c/code> не гарантирует stratum 5 при нормальной синхронизации с внешним источником и здесь не используется.\u003c/p>\n\u003cp>\u003cstrong>HQ-SRV, HQ-CLI\u003c/strong>: сервер \u003ccode>172.16.1.1\u003c/code>. \u003cstrong>BR-RTR, BR-SRV\u003c/strong>: сервер \u003ccode>172.16.2.1\u003c/code>. На каждой машине:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install chrony\ncp -a /etc/chrony.conf /etc/chrony.conf.before-exam\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/chrony.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Запишите конфиг, подставив нужный адрес ISP:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>server 172.16.1.1 iburst\ndriftfile /var/lib/chrony/drift\nmakestep 1.0 3\nrtcsync\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>systemctl enable --now chronyd\nsystemctl restart chronyd\nchronyc makestep\nchronyc sources -v\nchronyc tracking\u003c/code>\u003c/pre>\u003c/div>\u003cp>Дождитесь отметки \u003ccode>^*\u003c/code> у ISP. Клиент при синхронизации с ISP stratum 5 обычно будет stratum 6. Разрешите UDP 123 на ISP. В нашем адресном плане отдельные статические маршруты ISP к клиентским сетям для ответов NTP не нужны: офисные маршрутизаторы выполняют NAT.\u003c/p>\n","search":"chrony: isp — сервер stratum 5 \n**isp:**\n\n```bash\napt-get install chrony\ncp -a /etc/chrony.conf /etc/chrony.conf.before-exam\n```\n\nоткройте файл:\n\n```bash\nnano /etc/chrony.conf\n```\n\nвпишите содержимое и сохраните:\n\n```text\nserver time.cloudflare.com iburst minstratum 4\ndriftfile /var/lib/chrony/drift\nmakestep 1.0 3\nrtcsync\nallow 172.16.1.0/28\nallow 172.16.2.0/28\nallow 192.168.100.0/27\nallow 192.168.200.0/28\nallow 192.168.30.0/28\n```\n\n```bash\nsystemctl enable --now chronyd\nsystemctl restart chronyd\nchronyc sources -v\nchronyc tracking\n```\n\n`minstratum 4` увеличивает эффективный stratum вышестоящего источника минимум до 4, поэтому isp после синхронизации должен иметь stratum 5. выбирайте доступный внешний сервер со stratum не выше 4 и подтвердите **`stratum: 5` в tracking**. одна строка `local stratum 5` не гарантирует stratum 5 при нормальной синхронизации с внешним источником и здесь не используется.\n\n**hq-srv, hq-cli**: сервер `172.16.1.1`. **br-rtr, br-srv**: сервер `172.16.2.1`. на каждой машине:\n\n```bash\napt-get install chrony\ncp -a /etc/chrony.conf /etc/chrony.conf.before-exam\n```\n\nоткройте файл:\n\n```bash\nnano /etc/chrony.conf\n```\n\nзапишите конфиг, подставив нужный адрес isp:\n\n```conf\nserver 172.16.1.1 iburst\ndriftfile /var/lib/chrony/drift\nmakestep 1.0 3\nrtcsync\n```\n\n```bash\nsystemctl enable --now chronyd\nsystemctl restart chronyd\nchronyc makestep\nchronyc sources -v\nchronyc tracking\n```\n\nдождитесь отметки `^*` у isp. клиент при синхронизации с isp stratum 5 обычно будет stratum 6. разрешите udp 123 на isp. в нашем адресном плане отдельные статические маршруты isp к клиентским сетям для ответов ntp не нужны: офисные маршрутизаторы выполняют nat.\n\n"},{"id":"m2-5","module":2,"n":5,"title":"Ansible на BR-SRV","goal":"Подготовить инвентарь Ansible на BR-SRV и получить pong от четырёх узлов.","html":"\u003cp>\u003cstrong>HQ-CLI\u003c/strong> дополнительно нужен SSH для Ansible. В исходном КИМ ограничение SSH только sshuser относится к HQ-SRV и BR-SRV. На клиенте для управления создаём отдельную локальную запись sshuser:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install openssh-server sudo python3\ncontrol sudo public\nid sshuser\n# Если пользователя нет:\nuseradd -m -s /bin/bash sshuser\npasswd sshuser\n# Задайте P@ssw0rd для учебного стенда.\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/sudoers.d/sshuser\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>sshuser ALL=(ALL:ALL) NOPASSWD: ALL\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>chmod 440 /etc/sudoers.d/sshuser\nvisudo -cf /etc/sudoers.d/sshuser\nsystemctl enable --now sshd\nss -lntp | grep sshd\u003c/code>\u003c/pre>\u003c/div>\u003cp>В этом примере HQ-CLI слушает стандартный порт 22; если на готовом стенде ему уже назначен 2027, используйте 2027 в инвентаре. Это не меняет ограничение sudo доменной группы hq.\u003c/p>\n\u003cp>На \u003cstrong>HQ-SRV, HQ-RTR, BR-RTR\u003c/strong> установите \u003ccode>python3\u003c/code>, если его нет. Ansible ping требует Python на управляемых машинах.\u003c/p>\n\u003cp>\u003cstrong>BR-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install ansible openssh-clients\nmkdir -p /etc/ansible /root/.ssh\nchmod 700 /root/.ssh\nssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -N ''\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если ключ уже есть, используйте его, не перезаписывайте. Добавьте ключи, при первом подключении сверяя отпечаток с \u003ccode>ssh-keygen -lf /etc/openssh/ssh_host_ed25519_key.pub\u003c/code> на целевой ВМ:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>ssh-copy-id -p 2027 sshuser@192.168.100.2\nssh-copy-id -p 22 sshuser@192.168.200.2\nssh-copy-id -p 22 net_admin@172.16.1.2\nssh-copy-id -p 22 net_admin@172.16.2.2\u003c/code>\u003c/pre>\u003c/div>\u003cp>Не выключайте проверку host key для сокрытия предупреждений. При смене ВМ проверяйте новый отпечаток и удаляйте только устаревшую запись known_hosts.\u003c/p>\n\u003cp>Откройте инвентарь:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/ansible/inventory.ini\u003c/code>\u003c/pre>\u003c/div>\u003cp>Содержимое:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>[servers]\nhq-srv ansible_host=192.168.100.2 ansible_user=sshuser ansible_port=2027\nhq-cli ansible_host=192.168.200.2 ansible_user=sshuser ansible_port=22\n\n[routers]\nhq-rtr ansible_host=172.16.1.2 ansible_user=net_admin ansible_port=22\nbr-rtr ansible_host=172.16.2.2 ansible_user=net_admin ansible_port=22\n\n[all:vars]\nansible_python_interpreter=/usr/bin/python3\nansible_become=true\nansible_become_method=sudo\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте конфигурацию:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/ansible/ansible.cfg\u003c/code>\u003c/pre>\u003c/div>\u003cp>Содержимое:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>[defaults]\ninventory = /etc/ansible/inventory.ini\nhost_key_checking = True\ninterpreter_python = /usr/bin/python3\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>cd /etc/ansible\nansible-inventory --list\nansible all -m ping\u003c/code>\u003c/pre>\u003c/div>\u003cp>Все четыре узла должны ответить \u003ccode>SUCCESS\u003c/code> и \u003ccode>pong\u003c/code>, без UNREACHABLE и предупреждений об интерпретаторе.\u003c/p>\n","search":"ansible на br-srv \n**hq-cli** дополнительно нужен ssh для ansible. в исходном ким ограничение ssh только sshuser относится к hq-srv и br-srv. на клиенте для управления создаём отдельную локальную запись sshuser:\n\n```bash\napt-get install openssh-server sudo python3\ncontrol sudo public\nid sshuser\n# если пользователя нет:\nuseradd -m -s /bin/bash sshuser\npasswd sshuser\n# задайте p@ssw0rd для учебного стенда.\n```\n\nоткройте файл:\n\n```bash\nnano /etc/sudoers.d/sshuser\n```\n\nвпишите содержимое и сохраните:\n\n```text\nsshuser all=(all:all) nopasswd: all\n```\n\n```bash\nchmod 440 /etc/sudoers.d/sshuser\nvisudo -cf /etc/sudoers.d/sshuser\nsystemctl enable --now sshd\nss -lntp | grep sshd\n```\n\nв этом примере hq-cli слушает стандартный порт 22; если на готовом стенде ему уже назначен 2027, используйте 2027 в инвентаре. это не меняет ограничение sudo доменной группы hq.\n\nна **hq-srv, hq-rtr, br-rtr** установите `python3`, если его нет. ansible ping требует python на управляемых машинах.\n\n**br-srv:**\n\n```bash\napt-get install ansible openssh-clients\nmkdir -p /etc/ansible /root/.ssh\nchmod 700 /root/.ssh\nssh-keygen -t ed25519 -f /root/.ssh/id_ed25519 -n ''\n```\n\nесли ключ уже есть, используйте его, не перезаписывайте. добавьте ключи, при первом подключении сверяя отпечаток с `ssh-keygen -lf /etc/openssh/ssh_host_ed25519_key.pub` на целевой вм:\n\n```bash\nssh-copy-id -p 2027 sshuser@192.168.100.2\nssh-copy-id -p 22 sshuser@192.168.200.2\nssh-copy-id -p 22 net_admin@172.16.1.2\nssh-copy-id -p 22 net_admin@172.16.2.2\n```\n\nне выключайте проверку host key для сокрытия предупреждений. при смене вм проверяйте новый отпечаток и удаляйте только устаревшую запись known_hosts.\n\nоткройте инвентарь:\n\n```bash\nnano /etc/ansible/inventory.ini\n```\n\nсодержимое:\n\n```ini\n[servers]\nhq-srv ansible_host=192.168.100.2 ansible_user=sshuser ansible_port=2027\nhq-cli ansible_host=192.168.200.2 ansible_user=sshuser ansible_port=22\n\n[routers]\nhq-rtr ansible_host=172.16.1.2 ansible_user=net_admin ansible_port=22\nbr-rtr ansible_host=172.16.2.2 ansible_user=net_admin ansible_port=22\n\n[all:vars]\nansible_python_interpreter=/usr/bin/python3\nansible_become=true\nansible_become_method=sudo\n```\n\nоткройте конфигурацию:\n\n```bash\nnano /etc/ansible/ansible.cfg\n```\n\nсодержимое:\n\n```ini\n[defaults]\ninventory = /etc/ansible/inventory.ini\nhost_key_checking = true\ninterpreter_python = /usr/bin/python3\n```\n\n```bash\ncd /etc/ansible\nansible-inventory --list\nansible all -m ping\n```\n\nвсе четыре узла должны ответить `success` и `pong`, без unreachable и предупреждений об интерпретаторе.\n\n"},{"id":"m2-6","module":2,"n":6,"title":"Docker-приложение testapp на BR-SRV","goal":"Развернуть приложение testapp и базу данных из образов Additional.iso, опубликовать порт 8080.","html":"\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install docker-engine\napt-cache search docker-compose\u003c/code>\u003c/pre>\u003c/div>\u003cp>В зависимости от обновления p11 пакет Compose может называться \u003ccode>docker-compose\u003c/code> или \u003ccode>docker-compose-v2\u003c/code>. Установите доступный пакет, предоставляющий \u003ccode>docker compose\u003c/code>, и проверьте:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>docker compose version\nsystemctl enable --now docker\nfind /mnt/additional -maxdepth 3 -type f\nmkdir -p /opt/testapp\u003c/code>\u003c/pre>\u003c/div>\u003cp>Загрузите \u003cstrong>два архива образов\u003c/strong> из каталога docker на ISO, подставив реальные имена:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>docker load -i /mnt/additional/docker/ИМЯ_АРХИВА_SITE\ndocker load -i /mnt/additional/docker/ИМЯ_АРХИВА_MARIADB\ndocker image ls\u003c/code>\u003c/pre>\u003c/div>\u003cp>Скопируйте выданный \u003ccode>compose.yaml\u003c/code> и все связанные с ним \u003ccode>.env\u003c/code>, конфиги и данные в \u003ccode>/opt/testapp\u003c/code>, сохраняя относительные пути. Не сочиняйте новый compose вместо выданного: внутренние порты, имена БД и переменные известны только из него.\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>cp /mnt/additional/compose.yaml /opt/testapp/compose.yaml\ncd /opt/testapp\nnano compose.yaml\ndocker compose config\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если compose находится в другой папке ISO, скорректируйте путь. В конфиге:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>image:\u003c/code> должны совпадать с тегами, показанными \u003ccode>docker image ls\u003c/code>;\u003c/li>\n\u003cli>у веб-сервиса должен быть опубликован \u003cstrong>8080 на хосте\u003c/strong>: например \u003ccode>8080:80\u003c/code>, только если приложение в контейнере слушает 80;\u003c/li>\n\u003cli>база данных доступна приложению по имени сервиса, не по \u003ccode>localhost\u003c/code>;\u003c/li>\n\u003cli>пароль, имя БД и init-скрипты берутся из выданных файлов;\u003c/li>\n\u003cli>для постоянной работы задайте сервисам \u003ccode>restart: unless-stopped\u003c/code>, если этого нет.\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>docker compose up -d\ndocker compose ps\ndocker compose logs --tail=80\ncurl -I http://127.0.0.1:8080/\u003c/code>\u003c/pre>\u003c/div>\u003cp>С HQ-CLI: \u003ccode>curl -I http://192.168.30.2:8080/\u003c/code>. Docker может вести свой ruleset, поэтому не используйте \u003ccode>nft flush ruleset\u003c/code> после его запуска.\u003c/p>\n","search":"docker-приложение testapp на br-srv \n```bash\napt-get install docker-engine\napt-cache search docker-compose\n```\n\nв зависимости от обновления p11 пакет compose может называться `docker-compose` или `docker-compose-v2`. установите доступный пакет, предоставляющий `docker compose`, и проверьте:\n\n```bash\ndocker compose version\nsystemctl enable --now docker\nfind /mnt/additional -maxdepth 3 -type f\nmkdir -p /opt/testapp\n```\n\nзагрузите **два архива образов** из каталога docker на iso, подставив реальные имена:\n\n```bash\ndocker load -i /mnt/additional/docker/имя_архива_site\ndocker load -i /mnt/additional/docker/имя_архива_mariadb\ndocker image ls\n```\n\nскопируйте выданный `compose.yaml` и все связанные с ним `.env`, конфиги и данные в `/opt/testapp`, сохраняя относительные пути. не сочиняйте новый compose вместо выданного: внутренние порты, имена бд и переменные известны только из него.\n\n```bash\ncp /mnt/additional/compose.yaml /opt/testapp/compose.yaml\ncd /opt/testapp\nnano compose.yaml\ndocker compose config\n```\n\nесли compose находится в другой папке iso, скорректируйте путь. в конфиге:\n\n- `image:` должны совпадать с тегами, показанными `docker image ls`;\n- у веб-сервиса должен быть опубликован **8080 на хосте**: например `8080:80`, только если приложение в контейнере слушает 80;\n- база данных доступна приложению по имени сервиса, не по `localhost`;\n- пароль, имя бд и init-скрипты берутся из выданных файлов;\n- для постоянной работы задайте сервисам `restart: unless-stopped`, если этого нет.\n\n```bash\ndocker compose up -d\ndocker compose ps\ndocker compose logs --tail=80\ncurl -i http://127.0.0.1:8080/\n```\n\nс hq-cli: `curl -i http://192.168.30.2:8080/`. docker может вести свой ruleset, поэтому не используйте `nft flush ruleset` после его запуска.\n\n"},{"id":"m2-7","module":2,"n":7,"title":"Apache, PHP и MariaDB на HQ-SRV","goal":"Настроить Apache, PHP и MariaDB на HQ-SRV, импортировать webdb и запустить приложение.","html":"\u003cp>В ALT служба Apache называется \u003cstrong>httpd2\u003c/strong>, конфигурация находится в \u003ccode>/etc/httpd2\u003c/code>. Это не пути Debian \u003ccode>/etc/apache2\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>HQ-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install apache2 apache2-mod_php8.3 php8.3 php8.3-mysqli mariadb\nsystemctl enable --now mariadb\nsystemctl enable --now httpd2\nsystemctl status mariadb httpd2 --no-pager\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если в вашей ветке используется другая версия PHP, выберите согласованные пакеты этой версии через \u003ccode>apt-cache search &#39;^php.*mysqli&#39;\u003c/code> и \u003ccode>apt-cache search apache2-mod_php\u003c/code>.\u003c/p>\n\u003cp>Откройте SQL-консоль \u003ccode>mariadb -u root -p\u003c/code> (на чистой установке с socket-аутентификацией может быть достаточно \u003ccode>mariadb\u003c/code> от root). Выполните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>CREATE DATABASE webdb CHARACTER SET utf8mb4;\nCREATE USER 'web'@'localhost' IDENTIFIED BY 'P@ssw0rd';\nGRANT ALL PRIVILEGES ON webdb.* TO 'web'@'localhost';\nFLUSH PRIVILEGES;\nEXIT;\u003c/code>\u003c/pre>\u003c/div>\u003cp>Импорт и файлы:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mariadb -u root -p webdb &lt; /mnt/additional/web/dump.sql\nmkdir -p /var/www/html\ncp /mnt/additional/web/index.php /mnt/additional/web/logo.png /var/www/html/\nchmod 644 /var/www/html/index.php /var/www/html/logo.png\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /var/www/html/index.php\u003c/code>\u003c/pre>\u003c/div>\u003cp>В \u003ccode>index.php\u003c/code> поправьте \u003cstrong>существующие\u003c/strong> переменные подключения: сервер \u003ccode>localhost\u003c/code>, БД \u003ccode>webdb\u003c/code>, пользователь \u003ccode>web\u003c/code>, пароль \u003ccode>P@ssw0rd\u003c/code>. Их имена в переданном PDF отсутствуют. Если приложение использует PDO, дополнительно нужен соответствующий PHP-модуль PDO MySQL.\u003c/p>\n\u003cp>Создайте конфигурацию сайта:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/httpd2/conf/sites-available/webapp.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>&lt;VirtualHost *:80&gt;\n    ServerName hq-srv.au-team.irpo\n    DocumentRoot /var/www/html\n    DirectoryIndex index.php\n    &lt;Directory /var/www/html&gt;\n        Require all granted\n        AllowOverride None\n    &lt;/Directory&gt;\n&lt;/VirtualHost&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cp>Включите сайт и PHP:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>a2enmod mod_php8.3\na2ensite webapp\napachectl -t\napachectl -S\nsystemctl restart httpd2\ncurl http://127.0.0.1/\ncurl -H 'Host: hq-srv.au-team.irpo' http://127.0.0.1/\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если \u003ccode>a2ensite webapp\u003c/code> требует имя с расширением, используйте \u003ccode>a2ensite webapp.conf\u003c/code>; список файлов покажет \u003ccode>ls /etc/httpd2/conf/sites-available\u003c/code>. Имя PHP-модуля проверьте по \u003ccode>/etc/httpd2/conf/mods-available\u003c/code>: для пакета ALT оно может содержать префикс \u003ccode>mod_\u003c/code>. Если утилиты \u003ccode>apachectl\u003c/code> нет, используйте установленный \u003ccode>apache2ctl\u003c/code> или путь, указанный \u003ccode>systemctl cat httpd2\u003c/code>. Проверьте \u003ccode>apachectl -M\u003c/code>: PHP-модуль должен быть загружен, а выбранный MPM совместим с mod_php. На чистом стенде отключите default-сайт через \u003ccode>a2dissite default\u003c/code>, если он перехватывает запросы по IP.\u003c/p>\n\u003cp>Ожидается работа приложения и чтение БД, а не выдача исходного PHP-кода или стандартной тестовой страницы.\u003c/p>\n","search":"apache, php и mariadb на hq-srv \nв alt служба apache называется **httpd2**, конфигурация находится в `/etc/httpd2`. это не пути debian `/etc/apache2`.\n\n**hq-srv:**\n\n```bash\napt-get install apache2 apache2-mod_php8.3 php8.3 php8.3-mysqli mariadb\nsystemctl enable --now mariadb\nsystemctl enable --now httpd2\nsystemctl status mariadb httpd2 --no-pager\n```\n\nесли в вашей ветке используется другая версия php, выберите согласованные пакеты этой версии через `apt-cache search '^php.*mysqli'` и `apt-cache search apache2-mod_php`.\n\nоткройте sql-консоль `mariadb -u root -p` (на чистой установке с socket-аутентификацией может быть достаточно `mariadb` от root). выполните:\n\n```sql\ncreate database webdb character set utf8mb4;\ncreate user 'web'@'localhost' identified by 'p@ssw0rd';\ngrant all privileges on webdb.* to 'web'@'localhost';\nflush privileges;\nexit;\n```\n\nимпорт и файлы:\n\n```bash\nmariadb -u root -p webdb \u003c /mnt/additional/web/dump.sql\nmkdir -p /var/www/html\ncp /mnt/additional/web/index.php /mnt/additional/web/logo.png /var/www/html/\nchmod 644 /var/www/html/index.php /var/www/html/logo.png\n```\n\nоткройте файл:\n\n```bash\nnano /var/www/html/index.php\n```\n\nв `index.php` поправьте **существующие** переменные подключения: сервер `localhost`, бд `webdb`, пользователь `web`, пароль `p@ssw0rd`. их имена в переданном pdf отсутствуют. если приложение использует pdo, дополнительно нужен соответствующий php-модуль pdo mysql.\n\nсоздайте конфигурацию сайта:\n\n```bash\nnano /etc/httpd2/conf/sites-available/webapp.conf\n```\n\nвпишите:\n\n```apache\n\u003cvirtualhost *:80>\n    servername hq-srv.au-team.irpo\n    documentroot /var/www/html\n    directoryindex index.php\n    \u003cdirectory /var/www/html>\n        require all granted\n        allowoverride none\n    \u003c/directory>\n\u003c/virtualhost>\n```\n\nвключите сайт и php:\n\n```bash\na2enmod mod_php8.3\na2ensite webapp\napachectl -t\napachectl -s\nsystemctl restart httpd2\ncurl http://127.0.0.1/\ncurl -h 'host: hq-srv.au-team.irpo' http://127.0.0.1/\n```\n\nесли `a2ensite webapp` требует имя с расширением, используйте `a2ensite webapp.conf`; список файлов покажет `ls /etc/httpd2/conf/sites-available`. имя php-модуля проверьте по `/etc/httpd2/conf/mods-available`: для пакета alt оно может содержать префикс `mod_`. если утилиты `apachectl` нет, используйте установленный `apache2ctl` или путь, указанный `systemctl cat httpd2`. проверьте `apachectl -m`: php-модуль должен быть загружен, а выбранный mpm совместим с mod_php. на чистом стенде отключите default-сайт через `a2dissite default`, если он перехватывает запросы по ip.\n\nожидается работа приложения и чтение бд, а не выдача исходного php-кода или стандартной тестовой страницы.\n\n"},{"id":"m2-8","module":2,"n":8,"title":"DNAT портов на HQ-RTR и BR-RTR","goal":"Пробросить веб-порты и SSH на маршрутизаторах HQ-RTR и BR-RTR.","html":"\u003cp>Используйте WAN-адреса маршрутизаторов, а не адреса ISP. На \u003cstrong>HQ-RTR\u003c/st

rong> в существующую таблицу \u003ccode>exam_nat\u003c/code> из модуля 1 добавьте цепочку:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>chain prerouting {\n type nat hook prerouting priority dstnat; policy accept;\n iifname &quot;ens33&quot; ip daddr 172.16.1.2 tcp dport 8080 dnat to 192.168.100.2:80\n iifname &quot;ens33&quot; ip daddr 172.16.1.2 tcp dport 2027 dnat to 192.168.100.2:2027\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>На \u003cstrong>BR-RTR\u003c/strong>:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>chain prerouting {\n type nat hook prerouting priority dstnat; policy accept;\n iifname &quot;ens33&quot; ip daddr 172.16.2.2 tcp dport 8080 dnat to 192.168.30.2:8080\n iifname &quot;ens33&quot; ip daddr 172.16.2.2 tcp dport 2027 dnat to 192.168.30.2:2027\n}\u003c/code>\u003c/pre>\u003c/div>\u003cp>Файл с NAT откройте командой \u003ccode>nano /etc/nftables/exam.nft\u003c/code>. Добавьте указанную цепочку внутрь существующей таблицы \u003ccode>exam_nat\u003c/code>, рядом с postrouting. После правки на каждом маршрутизаторе:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nft -c -f /etc/nftables/exam.nft\nsystemctl restart exam-nat\nnft list table ip exam_nat\u003c/code>\u003c/pre>\u003c/div>\u003cp>На готовом стенде с другим менеджером firewall добавляйте эквивалентные правила в его постоянную конфигурацию. Также разрешите FORWARD для новых соединений к указанным портам и обратного established/related-трафика.\u003c/p>\n\u003cp>\u003cstrong>Важный случай BR:\u003c/strong> ответ BR-SRV на адрес ISP должен идти обратно через BR-RTR, а ответы к HQ — через GRE. Проверьте маршруты OSPF и шлюз BR-FW.\u003c/p>\n\u003cp>С \u003cstrong>ISP\u003c/strong>:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>curl http://172.16.1.2:8080/\ncurl http://172.16.2.2:8080/\nssh -p 2027 sshuser@172.16.1.2\nssh -p 2027 sshuser@172.16.2.2\u003c/code>\u003c/pre>\u003c/div>\u003cp>Пробросы через ISP из внешней физической сети КИМ здесь не требует. Доступ по web/docker в модуле 3 обеспечит reverse proxy на ISP.\u003c/p>\n","search":"dnat портов на hq-rtr и br-rtr \nиспользуйте wan-адреса маршрутизаторов, а не адреса isp. на **hq-rtr** в существующую таблицу `exam_nat` из модуля 1 добавьте цепочку:\n\n```nft\nchain prerouting {\n type nat hook prerouting priority dstnat; policy accept;\n iifname \"ens33\" ip daddr 172.16.1.2 tcp dport 8080 dnat to 192.168.100.2:80\n iifname \"ens33\" ip daddr 172.16.1.2 tcp dport 2027 dnat to 192.168.100.2:2027\n}\n```\n\nна **br-rtr**:\n\n```nft\nchain prerouting {\n type nat hook prerouting priority dstnat; policy accept;\n iifname \"ens33\" ip daddr 172.16.2.2 tcp dport 8080 dnat to 192.168.30.2:8080\n iifname \"ens33\" ip daddr 172.16.2.2 tcp dport 2027 dnat to 192.168.30.2:2027\n}\n```\n\nфайл с nat откройте командой `nano /etc/nftables/exam.nft`. добавьте указанную цепочку внутрь существующей таблицы `exam_nat`, рядом с postrouting. после правки на каждом маршрутизаторе:\n\n```bash\nnft -c -f /etc/nftables/exam.nft\nsystemctl restart exam-nat\nnft list table ip exam_nat\n```\n\nна готовом стенде с другим менеджером firewall добавляйте эквивалентные правила в его постоянную конфигурацию. также разрешите forward для новых соединений к указанным портам и обратного established/related-трафика.\n\n**важный случай br:** ответ br-srv на адрес isp должен идти обратно через br-rtr, а ответы к hq — через gre. проверьте маршруты ospf и шлюз br-fw.\n\nс **isp**:\n\n```bash\ncurl http://172.16.1.2:8080/\ncurl http://172.16.2.2:8080/\nssh -p 2027 sshuser@172.16.1.2\nssh -p 2027 sshuser@172.16.2.2\n```\n\nпробросы через isp из внешней физической сети ким здесь не требует. доступ по web/docker в модуле 3 обеспечит reverse proxy на isp.\n\n"},{"id":"m2-9","module":2,"n":9,"title":"Яндекс Браузер на HQ-CLI","goal":"Установить Яндекс Браузер на HQ-CLI с GNOME и проверить работу приложений.","html":"\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-cache policy yandex-browser-stable\napt-get install yandex-browser-stable\nrpm -q yandex-browser-stable\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если пакета нет в подключённых источниках, используйте официальный установочный RPM для ALT/подходящей архитектуры из выданного ПО или по инструкции Яндекса и установите его через \u003ccode>apt-get install /полный/путь/пакет.rpm\u003c/code>. Не устанавливайте пакет Debian \u003ccode>.deb\u003c/code> на ALT.\u003c/p>\n\u003cp>Запустите браузер из меню GNOME \u003cstrong>под обычным пользователем\u003c/strong>. Проверьте оба приложения и сохраните скриншот версии браузера.\u003c/p>\n","search":"яндекс браузер на hq-cli \n```bash\napt-cache policy yandex-browser-stable\napt-get install yandex-browser-stable\nrpm -q yandex-browser-stable\n```\n\nесли пакета нет в подключённых источниках, используйте официальный установочный rpm для alt/подходящей архитектуры из выданного по или по инструкции яндекса и установите его через `apt-get install /полный/путь/пакет.rpm`. не устанавливайте пакет debian `.deb` на alt.\n\nзапустите браузер из меню gnome **под обычным пользователем**. проверьте оба приложения и сохраните скриншот версии браузера.\n\n"}]},{"n":3,"title":"Эксплуатация объектов сетевой инфраструктуры","preparation":"\u003cp>Основа: задание 3, страницы 57–62 КИМ. Требуются работающие домен на BR-SRV, DNS, Ansible, веб-приложения и DNAT из подготовленного стенда/модуля 2.\u003c/p>\n\u003ch2>Итоговые проверки и отчёт\u003c/h2>\n\u003cp>Сохраните импортированных пользователей и их DN/OU; вход импортированного пользователя в GNOME; два reverse proxy; отказ 401 и успешную WEB-аутентификацию; даты сертификатов, SAN и оба сайта без предупреждений; две записи atop с интервалом 420 секунд; PDF от сетевого задания печати; два YAML-файла PC-INFO; бан на 60 секунд после трёх ошибок; версию ПО резервного копирования, репозиторий irpo, список снимков, расписание и результат восстановления.\u003c/p>\n","lessons":[{"id":"m3-1","module":3,"n":1,"title":"Массовый импорт пользователей в au-team.irpo","goal":"Доработать выданный скрипт импорта, создать пользователей и подразделения из users.csv и проверить доменный вход.","html":"\u003cp>\u003cstrong>BR-SRV:\u003c/strong> подключите Additional.iso, как описано в модуле 2.\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>find /mnt/additional -type f \\( -name 'users.csv' -o -name 'import.sh' \\)\nmkdir -p /root/domain-import\ncp /mnt/additional/ПУТЬ/users.csv /root/domain-import/users.csv\ncp /mnt/additional/ПУТЬ/import.sh /root/domain-import/import.sh\ncd /root/domain-import\nhead -n 5 users.csv\nnano import.sh\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003ccode>ПУТЬ\u003c/code> замените на каталог из результата find. Скрипт из ISO является заготовкой задания. Его аргументы, имена колонок, разделитель CSV и правила размещения в OU \u003cstrong>не приведены в PDF\u003c/strong>: определите их из заготовки и CSV. Не подставляйте выдуманные номера колонок.\u003c/p>\n\u003cp>Доработайте скрипт так, чтобы он:\u003c/p>\n\u003col>\n\u003cli>Читал фактический CSV, пропуская заголовок и корректно обрабатывая его разделитель/кодировку.\u003c/li>\n\u003cli>Создавал указанные OU (подразделения) под \u003ccode>DC=au-team,DC=irpo\u003c/code>.\u003c/li>\n\u003cli>Создавал пользователей с атрибутами из CSV именно в соответствующих OU.\u003c/li>\n\u003cli>Проверял существование OU и пользователей, чтобы повторный запуск не дублировал записи.\u003c/li>\n\u003cli>Выдавал понятный результат для каждой импортированной строки.\u003c/li>\n\u003c/ol>\n\u003cp>Команды Samba для включения в заготовку, с \u003cstrong>реальными значениями из CSV\u003c/strong>:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode># Пример подразделения; реальное имя возьмите из CSV.\nsamba-tool ou create 'OU=OfficeHQ,DC=au-team,DC=irpo'\n\n# --userou задаётся относительно корня домена.\nsamba-tool user create 'csvuser' 'ПАРОЛЬ_ИЗ_CSV' --given-name='Имя' --surname='Фамилия' --userou='OU=OfficeHQ'\n\nsamba-tool user show csvuser\nsamba-tool ou list\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если OU вложенные, создавайте сначала родительские. Если файл содержит поле должности/отдела, перенесите его в соответствующий атрибут, поддерживаемый \u003ccode>samba-tool user create --help\u003c/code> либо через LDAP. Просто создать всех пользователей в \u003ccode>CN=Users\u003c/code> недостаточно.\u003c/p>\n\u003cp>После адаптации проверьте синтаксис и запускайте с фактическими аргументами из скрипта:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>bash -n import.sh\n# Если заготовка принимает путь CSV первым параметром:\nbash ./import.sh ./users.csv\nsamba-tool user list\u003c/code>\u003c/pre>\u003c/div>\u003cp>На \u003cstrong>HQ-CLI\u003c/strong> проверьте \u003ccode>id &#39;ЛОГИН_ИЗ_CSV@au-team.irpo&#39;\u003c/code>, затем вход этим пользователем через GNOME. Если на клиенте действует ограничение допуска по группе hq, включите нужных импортированных пользователей в эту группу либо согласуйте правило допуска с условием импорта.\u003c/p>\n","search":"массовый импорт пользователей в au-team.irpo \n**br-srv:** подключите additional.iso, как описано в модуле 2.\n\n```bash\nfind /mnt/additional -type f \\( -name 'users.csv' -o -name 'import.sh' \\)\nmkdir -p /root/domain-import\ncp /mnt/additional/путь/users.csv /root/domain-import/users.csv\ncp /mnt/additional/путь/import.sh /root/domain-import/import.sh\ncd /root/domain-import\nhead -n 5 users.csv\nnano import.sh\n```\n\n`путь` замените на каталог из результата find. скрипт из iso является заготовкой задания. его аргументы, имена колонок, разделитель csv и правила размещения в ou **не приведены в pdf**: определите их из заготовки и csv. не подставляйте выдуманные номера колонок.\n\nдоработайте скрипт так, чтобы он:\n\n1. читал фактический csv, пропуская заголовок и корректно обрабатывая его разделитель/кодировку.\n2. создавал указанные ou (подразделения) под `dc=au-team,dc=irpo`.\n3. создавал пользователей с атрибутами из csv именно в соответствующих ou.\n4. проверял существование ou и пользователей, чтобы повторный запуск не дублировал записи.\n5. выдавал понятный результат для каждой импортированной строки.\n\nкоманды samba для включения в заготовку, с **реальными значениями из csv**:\n\n```bash\n# пример подразделения; реальное имя возьмите из csv.\nsamba-tool ou create 'ou=officehq,dc=au-team,dc=irpo'\n\n# --userou задаётся относительно корня домена.\nsamba-tool user create 'csvuser' 'пароль_из_csv' --given-name='имя' --surname='фамилия' --userou='ou=officehq'\n\nsamba-tool user show csvuser\nsamba-tool ou list\n```\n\nесли ou вложенные, создавайте сначала родительские. если файл содержит поле должности/отдела, перенесите его в соответствующий атрибут, поддерживаемый `samba-tool user create --help` либо через ldap. просто создать всех пользователей в `cn=users` недостаточно.\n\nпосле адаптации проверьте синтаксис и запускайте с фактическими аргументами из скрипта:\n\n```bash\nbash -n import.sh\n# если заготовка принимает путь csv первым параметром:\nbash ./import.sh ./users.csv\nsamba-tool user list\n```\n\nна **hq-cli** проверьте `id 'логин_из_csv@au-team.irpo'`, затем вход этим пользователем через gnome. если на клиенте действует ограничение допуска по группе hq, включите нужных импортированных пользователей в эту группу либо согласуйте правило допуска с условием импорта.\n\n"},{"id":"m3-2","module":3,"n":2,"title":"Reverse proxy на ISP","goal":"Настроить reverse proxy на ISP: web направить на HQ-SRV, docker — на BR-SRV.","html":"\u003cp>Маршруты запросов:\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Имя\u003c/th>\n\u003cth>A-запись\u003c/th>\n\u003cth>Backend с ISP\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>web.au-team.irpo\u003c/td>\n\u003ctd>172.16.2.1\u003c/td>\n\u003ctd>\u003ca href=\"http://172.16.1.2:8080/\">http://172.16.1.2:8080/\u003c/a> → HQ-SRV:80\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>docker.au-team.irpo\u003c/td>\n\u003ctd>172.16.1.1\u003c/td>\n\u003ctd>\u003ca href=\"http://172.16.2.2:8080/\">http://172.16.2.2:8080/\u003c/a> → BR-SRV:8080\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>ISP:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install apache2 apache2-htpasswd\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если отдельного пакета \u003ccode>apache2-htpasswd\u003c/code> нет, найдите поставщика утилиты через \u003ccode>apt-cache search htpasswd\u003c/code>; в некоторых сборках она входит в уже установленный пакет Apache. Далее:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>a2enmod proxy\na2enmod proxy_http\ncurl http://172.16.1.2:8080/\ncurl http://172.16.2.2:8080/\u003c/code>\u003c/pre>\u003c/div>\u003cp>Сначала добейтесь ответа обоих backend. Откройте конфигурацию:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/httpd2/conf/sites-available/reverse.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>&lt;VirtualHost *:80&gt;\n    ServerName web.au-team.irpo\n    ProxyRequests Off\n    ProxyPreserveHost On\n    ProxyPass / http://172.16.1.2:8080/\n    ProxyPassReverse / http://172.16.1.2:8080/\n&lt;/VirtualHost&gt;\n\n&lt;VirtualHost *:80&gt;\n    ServerName docker.au-team.irpo\n    ProxyRequests Off\n    ProxyPreserveHost On\n    ProxyPass / http://172.16.2.2:8080/\n    ProxyPassReverse / http://172.16.2.2:8080/\n&lt;/VirtualHost&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>a2ensite reverse\napachectl -t\nsystemctl enable --now httpd2\nsystemctl reload httpd2\ncurl -H 'Host: web.au-team.irpo' http://172.16.2.1/\ncurl -H 'Host: docker.au-team.irpo' http://172.16.1.1/\u003c/code>\u003c/pre>\u003c/div>\u003cp>При необходимости используйте \u003ccode>reverse.conf\u003c/code> в a2ensite и установленное имя apachectl/apache2ctl. Не включайте forward proxy (\u003ccode>ProxyRequests On\u003c/code>) — задача требует reverse proxy.\u003c/p>\n","search":"reverse proxy на isp \nмаршруты запросов:\n\n| имя | a-запись | backend с isp |\n|---|---|---|\n| web.au-team.irpo | 172.16.2.1 | http://172.16.1.2:8080/ → hq-srv:80 |\n| docker.au-team.irpo | 172.16.1.1 | http://172.16.2.2:8080/ → br-srv:8080 |\n\n**isp:**\n\n```bash\napt-get install apache2 apache2-htpasswd\n```\n\nесли отдельного пакета `apache2-htpasswd` нет, найдите поставщика утилиты через `apt-cache search htpasswd`; в некоторых сборках она входит в уже установленный пакет apache. далее:\n\n```bash\na2enmod proxy\na2enmod proxy_http\ncurl http://172.16.1.2:8080/\ncurl http://172.16.2.2:8080/\n```\n\nсначала добейтесь ответа обоих backend. откройте конфигурацию:\n\n```bash\nnano /etc/httpd2/conf/sites-available/reverse.conf\n```\n\nвпишите:\n\n```apache\n\u003cvirtualhost *:80>\n    servername web.au-team.irpo\n    proxyrequests off\n    proxypreservehost on\n    proxypass / http://172.16.1.2:8080/\n    proxypassreverse / http://172.16.1.2:8080/\n\u003c/virtualhost>\n\n\u003cvirtualhost *:80>\n    servername docker.au-team.irpo\n    proxyrequests off\n    proxypreservehost on\n    proxypass / http://172.16.2.2:8080/\n    proxypassreverse / http://172.16.2.2:8080/\n\u003c/virtualhost>\n```\n\n```bash\na2ensite reverse\napachectl -t\nsystemctl enable --now httpd2\nsystemctl reload httpd2\ncurl -h 'host: web.au-team.irpo' http://172.16.2.1/\ncurl -h 'host: docker.au-team.irpo' http://172.16.1.1/\n```\n\nпри необходимости используйте `reverse.conf` в a2ensite и установленное имя apachectl/apache2ctl. не включайте forward proxy (`proxyrequests on`) — задача требует reverse proxy.\n\n"},{"id":"m3-3","module":3,"n":3,"title":"Web-аутентификация: WEB / P@ssw0rd","goal":"Настроить аутентификацию WEB / P@ssw0rd и хранение хеша пароля в файле.","html":"\u003cp>\u003cstrong>ISP:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>a2enmod auth_basic\na2enmod authn_file\nhtpasswd -c /etc/httpd2/conf/web.htpasswd WEB\n# Введите P@ssw0rd дважды.\nchown root:apache2 /etc/httpd2/conf/web.htpasswd\nchmod 640 /etc/httpd2/conf/web.htpasswd\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте \u003ccode>nano /etc/httpd2/conf/sites-available/reverse.conf\u003c/code> и в первый VirtualHost (web) добавьте:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>&lt;Location /&gt;\n    AuthType Basic\n    AuthName &quot;WEB&quot;\n    AuthBasicProvider file\n    AuthUserFile /etc/httpd2/conf/web.htpasswd\n    Require user WEB\n&lt;/Location&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apachectl -t\nsystemctl reload httpd2\ncurl -I -H 'Host: web.au-team.irpo' http://172.16.2.1/\ncurl -u WEB -H 'Host: web.au-team.irpo' http://172.16.2.1/\u003c/code>\u003c/pre>\u003c/div>\u003cp>Без учётных данных ожидается \u003ccode>401\u003c/code>, с правильными — ответ приложения. В файле хранится хеш, это можно показать командой \u003ccode>head -n 1 /etc/httpd2/conf/web.htpasswd\u003c/code>. Не запускайте htpasswd повторно с \u003ccode>-c\u003c/code>, когда потребуется добавить ещё пользователя: \u003ccode>-c\u003c/code> пересоздаёт файл.\u003c/p>\n","search":"web-аутентификация: web / p@ssw0rd \n**isp:**\n\n```bash\na2enmod auth_basic\na2enmod authn_file\nhtpasswd -c /etc/httpd2/conf/web.htpasswd web\n# введите p@ssw0rd дважды.\nchown root:apache2 /etc/httpd2/conf/web.htpasswd\nchmod 640 /etc/httpd2/conf/web.htpasswd\n```\n\nоткройте `nano /etc/httpd2/conf/sites-available/reverse.conf` и в первый virtualhost (web) добавьте:\n\n```apache\n\u003clocation />\n    authtype basic\n    authname \"web\"\n    authbasicprovider file\n    authuserfile /etc/httpd2/conf/web.htpasswd\n    require user web\n\u003c/location>\n```\n\n```bash\napachectl -t\nsystemctl reload httpd2\ncurl -i -h 'host: web.au-team.irpo' http://172.16.2.1/\ncurl -u web -h 'host: web.au-team.irpo' http://172.16.2.1/\n```\n\nбез учётных данных ожидается `401`, с правильными — ответ приложения. в файле хранится хеш, это можно показать командой `head -n 1 /etc/httpd2/conf/web.htpasswd`. не запускайте htpasswd повторно с `-c`, когда потребуется добавить ещё пользователя: `-c` пересоздаёт файл.\n\n"},{"id":"m3-4","module":3,"n":4,"title":"Самоподписанный сертификат на HQ-SRV, 30 дней, доверие HQ-CLI","goal":"Выпустить самоподписанный сертификат на 30 дней и настроить доверие HTTPS на HQ-CLI.","html":"\u003cp>Создаём \u003cstrong>один самоподписанный сертификат на 30 дней\u003c/strong> для обоих имён. Ключ генерируется на HQ-SRV; TLS для веб-приложений завершает ISP, поэтому ключ и сертификат сайта передаются на ISP. Для импорта в доверенные центры сертификат учебного стенда помечен CA:TRUE; отдельного промежуточного центра здесь нет.\u003c/p>\n\u003cp>\u003cstrong>HQ-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install openssl\ninstall -d -m 700 /root/exam-pki\ncd /root/exam-pki\nopenssl req -x509 -newkey rsa:3072 -nodes -sha256 -days 30 -keyout sites.key -out sites.crt -subj '/CN=web.au-team.irpo' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,digitalSignature,keyEncipherment,keyCertSign' -addext 'extendedKeyUsage=serverAuth' -addext 'subjectAltName=DNS:web.au-team.irpo,DNS:docker.au-team.irpo'\n# Та же публичная часть под удобным именем для импорта доверия:\ncp sites.crt ca.crt\nchmod 600 sites.key\nopenssl verify -CAfile ca.crt sites.crt\nopenssl x509 -in sites.crt -noout -dates -ext subjectAltName\u003c/code>\u003c/pre>\u003c/div>\u003cp>Для передачи с \u003cstrong>ISP\u003c/strong> используйте разрешённого sshuser и sudo на HQ-SRV. Пример временно поместить материалы в домашнюю папку sshuser на HQ-SRV:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode># HQ-SRV\ncp sites.key /home/sshuser/sites.key\ncp sites.crt /home/sshuser/sites.crt\ncp ca.crt /home/sshuser/ca.crt\nchown sshuser: /home/sshuser/sites.key /home/sshuser/sites.crt /home/sshuser/ca.crt\nchmod 600 /home/sshuser/sites.key\nchmod 644 /home/sshuser/sites.crt /home/sshuser/ca.crt\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>ISP:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>install -d -m 700 /etc/httpd2/ssl\nscp -P 2027 sshuser@172.16.1.2:/home/sshuser/sites.key /etc/httpd2/ssl/\nscp -P 2027 sshuser@172.16.1.2:/home/sshuser/sites.crt /etc/httpd2/ssl/\nchmod 600 /etc/httpd2/ssl/sites.key\na2enmod ssl\na2enmod headers\u003c/code>\u003c/pre>\u003c/div>\u003cp>После успешной передачи удалите только временную копию \u003ccode>/home/sshuser/sites.key\u003c/code> на HQ-SRV. Закрытый ключ не передавайте на HQ-CLI: ему нужен только публичный сертификат ca.crt.\u003c/p>\n\u003cp>Проверьте, что Apache слушает 443: \u003ccode>grep -R &#39;^[[:space:]]*Listen&#39; /etc/httpd2/conf\u003c/code>. Если после включения SSL нет \u003ccode>Listen 443\u003c/code>, добавьте его один раз в подключаемый конфигурационный файл.\u003c/p>\n\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/httpd2/conf/sites-available/reverse.conf\u003c/code>\u003c/pre>\u003c/div>\u003cp>Замените содержимое на:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>&lt;VirtualHost *:80&gt;\n    ServerName web.au-team.irpo\n    Redirect permanent / https://web.au-team.irpo/\n&lt;/VirtualHost&gt;\n&lt;VirtualHost *:80&gt;\n    ServerName docker.au-team.irpo\n    Redirect permanent / https://docker.au-team.irpo/\n&lt;/VirtualHost&gt;\n\n&lt;VirtualHost *:443&gt;\n    ServerName web.au-team.irpo\n    SSLEngine on\n    SSLCertificateFile /etc/httpd2/ssl/sites.crt\n    SSLCertificateKeyFile /etc/httpd2/ssl/sites.key\n    ProxyRequests Off\n    ProxyPreserveHost On\n    RequestHeader set X-Forwarded-Proto &quot;https&quot;\n    ProxyPass / http://172.16.1.2:8080/\n    ProxyPassReverse / http://172.16.1.2:8080/\n    &lt;Location /&gt;\n        AuthType Basic\n        AuthName &quot;WEB&quot;\n        AuthBasicProvider file\n        AuthUserFile /etc/httpd2/conf/web.htpasswd\n        Require user WEB\n    &lt;/Location&gt;\n&lt;/VirtualHost&gt;\n\n&lt;VirtualHost *:443&gt;\n    ServerName docker.au-team.irpo\n    SSLEngine on\n    SSLCertificateFile /etc/httpd2/ssl/sites.crt\n    SSLCertificateKeyFile /etc/httpd2/ssl/sites.key\n    ProxyRequests Off\n    ProxyPreserveHost On\n    RequestHeader set X-Forwarded-Proto &quot;https&quot;\n    ProxyPass / http://172.16.2.2:8080/\n    ProxyPassReverse / http://172.16.2.2:8080/\n&lt;/VirtualHost&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apachectl -t\nsystemctl reload httpd2\nss -lntp | grep ':443'\u003c/code>\u003c/pre>\u003c/div>\u003ch3>Доверие сертификату на HQ-CLI\u003c/h3>\n\u003cp>Скопируйте публичный \u003ccode>ca.crt\u003c/code> с HQ-SRV на HQ-CLI:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>scp -P 2027 sshuser@192.168.100.2:/home/sshuser/ca.crt /tmp/au-team-ca.crt\nopenssl x509 -in /tmp/au-team-ca.crt -noout -fingerprint -sha256\u003c/code>\u003c/pre>\u003c/div>\u003cp>Сверьте отпечаток с оригиналом на HQ-SRV. Установите CA в системное хранилище штатной утилитой \u003ccode>trust\u003c/code>:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>trust anchor --store /tmp/au-team-ca.crt\ntrust extract-compat\ncurl -I https://docker.au-team.irpo/\ncurl -I https://web.au-team.irpo/\ncurl -u WEB https://web.au-team.irpo/\u003c/code>\u003c/pre>\u003c/div>\u003cp>Без WEB-пароля на web допустим \u003ccode>401\u003c/code>, но ошибки сертификата быть не должно. Не используйте \u003ccode>curl -k\u003c/code> для итоговой проверки доверия.\u003c/p>\n\u003cp>В Яндекс Браузере под обычным пользователем откройте управление сертификатами, импортируйте \u003cstrong>ca.crt в доверенные центры сертификации\u003c/strong>, разрешив доверие для идентификации сайтов. При использовании системного хранилища отдельный импорт может не понадобиться; результат проверьте в самом браузере после полного перезапуска. Откройте оба HTTPS-адреса: предупреждения о сертификате и имени сайта должны отсутствовать. Добавление исключения для сайта не заменяет импорт доверенного CA.\u003c/p>\n\u003cp>Проверка самоподписи: \u003ccode>openssl x509 -in sites.crt -noout -issuer -subject\u003c/code> на HQ-SRV должна показать одинаковые issuer и subject. Сертификат должен покрывать оба DNS-имени через SAN, одного CN недостаточно.\u003c/p>\n","search":"самоподписанный сертификат на hq-srv, 30 дней, доверие hq-cli \nсоздаём **один самоподписанный сертификат на 30 дней** для обоих имён. ключ генерируется на hq-srv; tls для веб-приложений завершает isp, поэтому ключ и сертификат сайта передаются на isp. для импорта в доверенные центры сертификат учебного стенда помечен ca:true; отдельного промежуточного центра здесь нет.\n\n**hq-srv:**\n\n```bash\napt-get install openssl\ninstall -d -m 700 /root/exam-pki\ncd /root/exam-pki\nopenssl req -x509 -newkey rsa:3072 -nodes -sha256 -days 30 -keyout sites.key -out sites.crt -subj '/cn=web.au-team.irpo' -addext 'basicconstraints=critical,ca:true' -addext 'keyusage=critical,digitalsignature,keyencipherment,keycertsign' -addext 'extendedkeyusage=serverauth' -addext 'subjectaltname=dns:web.au-team.irpo,dns:docker.au-team.irpo'\n# та же публичная часть под удобным именем для импорта доверия:\ncp sites.crt ca.crt\nchmod 600 sites.key\nopenssl verify -cafile ca.crt sites.crt\nopenssl x509 -in sites.crt -noout -dates -ext subjectaltname\n```\n\nдля передачи с **isp** используйте разрешённого sshuser и sudo на hq-srv. пример временно поместить материалы в домашнюю папку sshuser на hq-srv:\n\n```bash\n# hq-srv\ncp sites.key /home/sshuser/sites.key\ncp sites.crt /home/sshuser/sites.crt\ncp ca.crt /home/sshuser/ca.crt\nchown sshuser: /home/sshuser/sites.key /home/sshuser/sites.crt /home/sshuser/ca.crt\nchmod 600 /home/sshuser/sites.key\nchmod 644 /home/sshuser/sites.crt /home/sshuser/ca.crt\n```\n\n**isp:**\n\n```bash\ninstall -d -m 700 /etc/httpd2/ssl\nscp -p 2027 sshuser@172.16.1.2:/home/sshuser/sites.key /etc/httpd2/ssl/\nscp -p 2027 sshuser@172.16.1.2:/home/sshuser/sites.crt /etc/httpd2/ssl/\nchmod 600 /etc/httpd2/ssl/sites.key\na2enmod ssl\na2enmod headers\n```\n\nпосле успешной передачи удалите только временную копию `/home/sshuser/sites.key` на hq-srv. закрытый ключ не передавайте на hq-cli: ему нужен только публичный сертификат ca.crt.\n\nпроверьте, что apache слушает 443: `grep -r '^[[:space:]]*listen' /etc/httpd2/conf`. если после включения ssl нет `listen 443`, добавьте его один раз в подключаемый конфигурационный файл.\n\nоткройте файл:\n\n```bash\nnano /etc/httpd2/conf/sites-available/reverse.conf\n```\n\nзамените содержимое на:\n\n```apache\n\u003cvirtualhost *:80>\n    servername web.au-team.irpo\n    redirect permanent / https://web.au-team.irpo/\n\u003c/virtualhost>\n\u003cvirtualhost *:80>\n    servername docker.au-team.irpo\n    redirect permanent / https://docker.au-team.irpo/\n\u003c/virtualhost>\n\n\u003cvirtualhost *:443>\n    servername web.au-team.irpo\n    sslengine on\n    sslcertificatefile /etc/httpd2/ssl/sites.crt\n    sslcertificatekeyfile /etc/httpd2/ssl/sites.key\n    proxyrequests off\n    proxypreservehost on\n    requestheader set x-forwarded-proto \"https\"\n    proxypass / http://172.16.1.2:8080/\n    proxypassreverse / http://172.16.1.2:8080/\n    \u003clocation />\n        authtype basic\n        authname \"web\"\n        authbasicprovider file\n        authuserfile /etc/httpd2/conf/web.htpasswd\n        require user web\n    \u003c/location>\n\u003c/virtualhost>\n\n\u003cvirtualhost *:443>\n    servername docker.au-team.irpo\n    sslengine on\n    sslcertificatefile /etc/httpd2/ssl/sites.crt\n    sslcertificatekeyfile /etc/httpd2/ssl/sites.key\n    proxyrequests off\n    proxypreservehost on\n    requestheader set x-forwarded-proto \"https\"\n    proxypass / http://172.16.2.2:8080/\n    proxypassreverse / http://172.16.2.2:8080/\n\u003c/virtualhost>\n```\n\n```bash\napachectl -t\nsystemctl reload httpd2\nss -lntp | grep ':443'\n```\n\n### доверие сертификату на hq-cli\n\nскопируйте публичный `ca.crt` с hq-srv на hq-cli:\n\n```bash\nscp -p 2027 sshuser@192.168.100.2:/home/sshuser/ca.crt /tmp/au-team-ca.crt\nopenssl x509 -in /tmp/au-team-ca.crt -noout -fingerprint -sha256\n```\n\nсверьте отпечаток с оригиналом на hq-srv. установите ca в системное хранилище штатной утилитой `trust`:\n\n```bash\ntrust anchor --store /tmp/au-team-ca.crt\ntrust extract-compat\ncurl -i https://docker.au-team.irpo/\ncurl -i https://web.au-team.irpo/\ncurl -u web https://web.au-team.irpo/\n```\n\nбез web-пароля на web допустим `401`, но ошибки сертификата быть не должно. не используйте `curl -k` для итоговой проверки доверия.\n\nв яндекс браузере под обычным пользователем откройте управление сертификатами, импортируйте **ca.crt в доверенные центры сертификации**, разрешив доверие для идентификации сайтов. при использовании системного хранилища отдельный импорт может не понадобиться; результат проверьте в самом браузере после полного перезапуска. откройте оба https-адреса: предупреждения о сертификате и имени сайта должны отсутствовать. добавление исключения для сайта не заменяет импорт доверенного ca.\n\nпроверка самоподписи: `openssl x509 -in sites.crt -noout -issuer -subject` на hq-srv должна показать одинаковые issuer и subject. сертификат должен покрывать оба dns-имени через san, одного cn недостаточно.\n\n"},{"id":"m3-5","module":3,"n":5,"title":"atop на HQ-SRV: запись каждые 7 минут","goal":"Записывать показатели CPU, памяти, дисков и сети с интервалом 420 секунд.","html":"\u003cp>\u003cstrong>HQ-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install atop\nmkdir -p /var/log/atop-exam\u003c/code>\u003c/pre>\u003c/div>\u003cp>Создайте службу, которая запускает atop напрямую, без скрипта:\u003c/p>\n\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/systemd/system/exam-atop.service\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>[Unit]\nDescription=Atop collection every 7 minutes\nAfter=local-fs.target\n[Service]\nType=simple\nExecStart=/usr/bin/atop -w /var/log/atop-exam/metrics.raw 420\nRestart=on-failure\n[Install]\nWantedBy=multi-user.target\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>systemctl daemon-reload\nsystemctl enable --now exam-atop\nsystemctl status exam-atop --no-pager\nls -lh /var/log/atop-exam\natop -r /var/log/atop-exam/metrics.raw\u003c/code>\u003c/pre>\u003c/div>\u003cp>420 секунд = 7 минут. Файл содержит показатели CPU, памяти, дисков и сети. Если штатный atop.service тоже собирает данные с другим интервалом, сначала проверьте \u003ccode>systemctl list-unit-files &#39;*atop*&#39;\u003c/code>, затем при наличии этого unit отключите дублирующий сбор командой \u003ccode>systemctl disable --now atop\u003c/code>. Наш exam-atop оставьте включённым.\u003c/p>\n\u003cp>Дождитесь как минимум двух записей с интервалом 7 минут и покажите их эксперту. Для длительной эксплуатации добавьте ротацию/ограничение хранения; КИМ конкретную глубину хранения не задаёт.\u003c/p>\n","search":"atop на hq-srv: запись каждые 7 минут \n**hq-srv:**\n\n```bash\napt-get install atop\nmkdir -p /var/log/atop-exam\n```\n\nсоздайте службу, которая запускает atop напрямую, без скрипта:\n\nоткройте файл:\n\n```bash\nnano /etc/systemd/system/exam-atop.service\n```\n\nвпишите содержимое и сохраните:\n\n```text\n[unit]\ndescription=atop collection every 7 minutes\nafter=local-fs.target\n[service]\ntype=simple\nexecstart=/usr/bin/atop -w /var/log/atop-exam/metrics.raw 420\nrestart=on-failure\n[install]\nwantedby=multi-user.target\n```\n\n```bash\nsystemctl daemon-reload\nsystemctl enable --now exam-atop\nsystemctl status exam-atop --no-pager\nls -lh /var/log/atop-exam\natop -r /var/log/atop-exam/metrics.raw\n```\n\n420 секунд = 7 минут. файл содержит показатели cpu, памяти, дисков и сети. если штатный atop.service тоже собирает данные с другим интервалом, сначала проверьте `systemctl list-unit-files '*atop*'`, затем при наличии этого unit отключите дублирующий сбор командой `systemctl disable --now atop`. наш exam-atop оставьте включённым.\n\nдождитесь как минимум двух записей с интервалом 7 минут и покажите их эксперту. для длительной эксплуатации добавьте ротацию/ограничение хранения; ким конкретную глубину хранения не задаёт.\n\n"},{"id":"m3-6","module":3,"n":6,"title":"CUPS и виртуальный PDF-принтер","goal":"Настроить сетевой PDF-принтер на HQ-SRV и сделать его принтером по умолчанию на HQ-CLI.","html":"\u003cp>\u003cstrong>HQ-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install cups cups-pdf\nsystemctl enable --now cups\nlpinfo -v | grep -i pdf\nlpinfo -m | grep -i 'cups.*pdf'\u003c/code>\u003c/pre>\u003c/div>\u003cp>Создайте очередь с драйвером, который \u003cstrong>фактически показал\u003c/strong> \u003ccode>lpinfo -m\u003c/code>. Первый столбец его строки — идентификатор модели. Пример команды после подстановки:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>lpadmin -p PDF -E -v cups-pdf:/ -m 'ИДЕНТИФИКАТОР_МОДЕЛИ_ИЗ_LPINFO'\nlpadmin -p PDF -o printer-is-shared=true\nlpoptions -d PDF\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если backend из \u003ccode>lpinfo -v\u003c/code> имеет другой URI, используйте его. Для CUPS-PDF нужен его PPD, а \u003ccode>-m everywhere\u003c/code> предназначен для IPP Everywhere и здесь не является универсальной заменой.\u003c/p>\n\u003cp>Откройте \u003ccode>nano /etc/cups/cupsd.conf\u003c/code>. В этом файле настройте прослушивание адреса сервера и доступ. Сохраните существующие Policy и административные ограничения. Не создавайте конфликтующие повторные блоки Location. Пример нужных значений:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>Listen localhost:631\nListen 192.168.100.2:631\nBrowsing On\nWebInterface Yes\n\n&lt;Location /&gt;\n  Order deny,allow\n  Deny from all\n  Allow from 127.0.0.1\n  Allow from 192.168.200.0/28\n&lt;/Location&gt;\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте \u003ccode>nano /etc/cups/cups-pdf.conf\u003c/code>. В этом файле проверьте \u003ccode>Out\u003c/code> и \u003ccode>AnonDirName\u003c/code>: они определяют, куда сохраняются PDF локальных и неизвестных серверу пользователей. Для сетевых заданий удобно явно задать:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>AnonDirName /var/spool/cups-pdf/ANONYMOUS\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p /var/spool/cups-pdf/ANONYMOUS\ncupsd -t\nsystemctl restart cups\nlpstat -t\u003c/code>\u003c/pre>\u003c/div>\u003cp>\u003cstrong>HQ-CLI:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install cups\nsystemctl enable --now cups\nlpadmin -p HQ-PDF -E -v ipp://hq-srv.au-team.irpo:631/printers/PDF -m everywhere\nlpoptions -d HQ-PDF\nlpstat -d\nlp -d HQ-PDF /etc/hostname\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если удалённая очередь не поддерживает driverless, выберите подходящий CUPS-PDF PPD и на клиенте. В GNOME проверьте, что HQ-PDF назначен по умолчанию \u003cstrong>в пользовательской сессии\u003c/strong>: пользовательские настройки могут перекрыть системные. На HQ-SRV найдите созданный PDF в путях из cups-pdf.conf; убедитесь, что это файл с содержимым задания, а не только успешный статус очереди.\u003c/p>\n","search":"cups и виртуальный pdf-принтер \n**hq-srv:**\n\n```bash\napt-get install cups cups-pdf\nsystemctl enable --now cups\nlpinfo -v | grep -i pdf\nlpinfo -m | grep -i 'cups.*pdf'\n```\n\nсоздайте очередь с драйвером, который **фактически показал** `lpinfo -m`. первый столбец его строки — идентификатор модели. пример команды после подстановки:\n\n```bash\nlpadmin -p pdf -e -v cups-pdf:/ -m 'идентификатор_модели_из_lpinfo'\nlpadmin -p pdf -o printer-is-shared=true\nlpoptions -d pdf\n```\n\nесли backend из `lpinfo -v` имеет другой uri, используйте его. для cups-pdf нужен его ppd, а `-m everywhere` предназначен для ipp everywhere и здесь не является универсальной заменой.\n\nоткройте `nano /etc/cups/cupsd.conf`. в этом файле настройте прослушивание адреса сервера и доступ. сохраните существующие policy и административные ограничения. не создавайте конфликтующие повторные блоки location. пример нужных значений:\n\n```conf\nlisten localhost:631\nlisten 192.168.100.2:631\nbrowsing on\nwebinterface yes\n\n\u003clocation />\n  order deny,allow\n  deny from all\n  allow from 127.0.0.1\n  allow from 192.168.200.0/28\n\u003c/location>\n```\n\nоткройте `nano /etc/cups/cups-pdf.conf`. в этом файле проверьте `out` и `anondirname`: они определяют, куда сохраняются pdf локальных и неизвестных серверу пользователей. для сетевых заданий удобно явно задать:\n\n```conf\nanondirname /var/spool/cups-pdf/anonymous\n```\n\n```bash\nmkdir -p /var/spool/cups-pdf/anonymous\ncupsd -t\nsystemctl restart cups\nlpstat -t\n```\n\n**hq-cli:**\n\n```bash\napt-get install cups\nsystemctl enable --now cups\nlpadmin -p hq-pdf -e -v ipp://hq-srv.au-team.irpo:631/printers/pdf -m everywhere\nlpoptions -d hq-pdf\nlpstat -d\nlp -d hq-pdf /etc/hostname\n```\n\nесли удалённая очередь не поддерживает driverless, выберите подходящий cups-pdf ppd и на клиенте. в gnome проверьте, что hq-pdf назначен по умолчанию **в пользовательской сессии**: пользовательские настройки могут перекрыть системные. на hq-srv найдите созданный pdf в путях из cups-pdf.conf; убедитесь, что это файл с содержимым задания, а не только успешный статус очереди.\n\n"},{"id":"m3-7","module":3,"n":7,"title":"Сведения о HQ-SRV и HQ-CLI через Ansible на BR-SRV","goal":"Собрать имена и IP HQ-SRV и HQ-CLI через Ansible в YAML-файлы PC-INFO на BR-SRV.","html":"\u003cp>КИМ предоставляет заготовку в каталоге \u003ccode>playbook\u003c/code> ISO. Скопируйте её в \u003ccode>/etc/ansible\u003c/code>, посмотрите содержимое и внесите следующие задачи, сохранив требуемую структуру. Ниже полный рабочий пример содержимого playbook; он создаёт отчёты \u003cstrong>на BR-SRV\u003c/strong>.\u003c/p>\n\u003cp>\u003cstrong>BR-SRV\u003c/strong>:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/ansible/pc-info.yml\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите YAML, сохраняя отступы пробелами:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>---\n- name: Collect HQ machine information\n  hosts: servers\n  gather_facts: true\n  become: true\n  tasks:\n    - name: Create reports directory on controller\n      ansible.builtin.file:\n        path: /etc/ansible/PC-INFO\n        state: directory\n        mode: '0755'\n      delegate_to: localhost\n      run_once: true\n\n    - name: Save host name and IPv4 addresses on controller\n      ansible.builtin.copy:\n        dest: &quot;/etc/ansible/PC-INFO/{{ inventory_hostname }}.yml&quot;\n        mode: '0644'\n        content: &quot;{{ {'hostname': ansible_facts['hostname'], 'fqdn': ansible_facts['fqdn'], 'ipv4': ansible_facts['all_ipv4_addresses']} | to_nice_yaml }}&quot;\n      delegate_to: localhost\u003c/code>\u003c/pre>\u003c/div>\u003cp>Группа \u003ccode>servers\u003c/code> в инвентаре модуля 2 содержит именно HQ-SRV и HQ-CLI. Если в выданном инвентаре группа называется иначе, поменяйте \u003ccode>hosts\u003c/code> либо перечислите \u003ccode>hq-srv:hq-cli\u003c/code>.\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>cd /etc/ansible\nansible-playbook pc-info.yml --syntax-check\nansible-playbook pc-info.yml\nls -l /etc/ansible/PC-INFO\nless /etc/ansible/PC-INFO/hq-srv.yml\nless /etc/ansible/PC-INFO/hq-cli.yml\u003c/code>\u003c/pre>\u003c/div>\u003cp>Файлы должны содержать реальные hostname/IP и называться по устройствам, без включения маршрутизаторов.\u003c/p>\n","search":"сведения о hq-srv и hq-cli через ansible на br-srv \nким предоставляет заготовку в каталоге `playbook` iso. скопируйте её в `/etc/ansible`, посмотрите содержимое и внесите следующие задачи, сохранив требуемую структуру. ниже полный рабочий пример содержимого playbook; он создаёт отчёты **на br-srv**.\n\n**br-srv**:\n\n```bash\nnano /etc/ansible/pc-info.yml\n```\n\nвпишите yaml, сохраняя отступы пробелами:\n\n```yaml\n---\n- name: collect hq machine information\n  hosts: servers\n  gather_facts: true\n  become: true\n  tasks:\n    - name: create reports directory on controller\n      ansible.builtin.file:\n        path: /etc/ansible/pc-info\n        state: directory\n        mode: '0755'\n      delegate_to: localhost\n      run_once: true\n\n    - name: save host name and ipv4 addresses on controller\n      ansible.builtin.copy:\n        dest: \"/etc/ansible/pc-info/{{ inventory_hostname }}.yml\"\n        mode: '0644'\n        content: \"{{ {'hostname': ansible_facts['hostname'], 'fqdn': ansible_facts['fqdn'], 'ipv4': ansible_facts['all_ipv4_addresses']} | to_nice_yaml }}\"\n      delegate_to: localhost\n```\n\nгруппа `servers` в инвентаре модуля 2 содержит именно hq-srv и hq-cli. если в выданном инвентаре группа называется иначе, поменяйте `hosts` либо перечислите `hq-srv:hq-cli`.\n\n```bash\ncd /etc/ansible\nansible-playbook pc-info.yml --syntax-check\nansible-playbook pc-info.yml\nls -l /etc/ansible/pc-info\nless /etc/ansible/pc-info/hq-srv.yml\nless /etc/ansible/pc-info/hq-cli.yml\n```\n\nфайлы должны содержать реальные hostname/ip и называться по устройствам, без включения маршрутизаторов.\n\n"},{"id":"m3-8","module":3,"n":8,"title":"Fail2ban для SSH на HQ-SRV","goal":"Настроить jail ssh: три неудачные попытки, бан на одну минуту.","html":"\u003cp>\u003cstrong>HQ-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install fail2ban nftables\nmkdir -p /etc/fail2ban/jail.d\u003c/code>\u003c/pre>\u003c/div>\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/fail2ban/jail.d/ssh.local\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>[ssh]\nenabled = true\nfilter = sshd\nport = 2027\nbackend = systemd\nmaxretry = 3\nfindtime = 600\nbantime = 60\nbanaction = nftables-multiport\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>fail2ban-client -t\nsystemctl enable --now fail2ban\nsystemctl restart fail2ban\nfail2ban-client status ssh\u003c/code>\u003c/pre>\u003c/div>\u003cp>Нужна jail с именем \u003cstrong>ssh\u003c/strong>; фильтр при этом \u003cstrong>sshd\u003c/strong>. Если в системе уже активна дублирующая jail sshd, отключите её или согласуйте настройки, чтобы она не банила на другой срок. Если действие \u003ccode>nftables-multiport\u003c/code> отсутствует в установленной версии, посмотрите \u003ccode>/etc/fail2ban/action.d/nftables*.conf\u003c/code> и выберите имеющееся действие, задав порт 2027.\u003c/p>\n\u003cp>Проверяйте с другой ВМ, не с localhost и не с адреса из ignoreip. При MaxAuthTries=2 из модуля 1 для трёх ошибок понадобится более одного подключения. Используйте sshuser и неверный пароль:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p 2027 sshuser@192.168.100.2\u003c/code>\u003c/pre>\u003c/div>\u003cp>На HQ-SRV:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>fail2ban-client status ssh\njournalctl -u fail2ban --since '-5 minutes' --no-pager\nnft list ruleset\u003c/code>\u003c/pre>\u003c/div>\u003cp>После трёх неудачных аутентификаций адрес должен оказаться в бане примерно на минуту. Затем подтвердите автоматическое снятие блокировки. SSH может фиксировать несколько событий в одном соединении: смотрите реальный счётчик Total failed, а не только число запусков команды ssh.\u003c/p>\n","search":"fail2ban для ssh на hq-srv \n**hq-srv:**\n\n```bash\napt-get install fail2ban nftables\nmkdir -p /etc/fail2ban/jail.d\n```\n\nоткройте файл:\n\n```bash\nnano /etc/fail2ban/jail.d/ssh.local\n```\n\nвпишите содержимое и сохраните:\n\n```text\n[ssh]\nenabled = true\nfilter = sshd\nport = 2027\nbackend = systemd\nmaxretry = 3\nfindtime = 600\nbantime = 60\nbanaction = nftables-multiport\n```\n\n```bash\nfail2ban-client -t\nsystemctl enable --now fail2ban\nsystemctl restart fail2ban\nfail2ban-client status ssh\n```\n\nнужна jail с именем **ssh**; фильтр при этом **sshd**. если в системе уже активна дублирующая jail sshd, отключите её или согласуйте настройки, чтобы она не банила на другой срок. если действие `nftables-multiport` отсутствует в установленной версии, посмотрите `/etc/fail2ban/action.d/nftables*.conf` и выберите имеющееся действие, задав порт 2027.\n\nпроверяйте с другой вм, не с localhost и не с адреса из ignoreip. при maxauthtries=2 из модуля 1 для трёх ошибок понадобится более одного подключения. используйте sshuser и неверный пароль:\n\n```bash\nssh -o preferredauthentications=password -o pubkeyauthentication=no -p 2027 sshuser@192.168.100.2\n```\n\nна hq-srv:\n\n```bash\nfail2ban-client status ssh\njournalctl -u fail2ban --since '-5 minutes' --no-pager\nnft list ruleset\n```\n\nпосле трёх неудачных аутентификаций адрес должен оказаться в бане примерно на минуту. затем подтвердите автоматическое снятие блокировки. ssh может фиксировать несколько событий в одном соединении: смотрите реальный счётчик total failed, а не только число запусков команды ssh.\n\n"},{"id":"m3-9","module":3,"n":9,"title":"Резервное копирование HQ-SRV на HQ-CLI","goal":"Настроить репозиторий irpo на HQ-CLI, выполнить резервное копирование HQ-SRV и проверить восстановление.","html":"\u003cp>КИМ разрешает выбрать ПО и рекомендует выпуск не позднее чем за 18 месяцев до начала экзамена. Для воспроизводимого примера выбрана \u003cstrong>restic 0.16.5\u003c/strong>, выпущенная 01.07.2024: \u003ca href=\"https://restic.net/blog/2024-07-01/restic-0.16.5-released/\">официальный выпуск\u003c/a>. Для экзамена в 2027 году этот выпуск удовлетворяет возрасту. Если площадка утвердила другое ПО, используйте его; современная версия из p11 может оказаться моложе указанного срока.\u003c/p>\n\u003cp>Пример реализует хранилище \u003ccode>irpo\u003c/code> как зашифрованный репозиторий restic на HQ-CLI. Доступ к нему — SFTP от пользователя \u003cstrong>irpoadmin\u003c/strong>, пароль \u003cstrong>P@ssw0rd\u003c/strong>. Это учётная запись доступа к хранилищу; пароль шифрования репозитория задаётся отдельно.\u003c/p>\n\u003ch3>9.1. Выбрать и установить restic на HQ-SRV\u003c/h3>\n\u003cp>Для обычной тренировки можно установить пакет из p11:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-cache policy restic\napt-get install restic\nrestic version\u003c/code>\u003c/pre>\u003c/div>\u003cp>Для точного соблюдения возраста используйте согласованную версию 0.16.5 из комплекта ПО площадки либо официальный standalone-бинарник для своей архитектуры. Перед использованием сверяйте SHA256 с официальным списком выпуска. Для x86_64 имя архива — \u003ccode>restic_0.16.5_linux_amd64.bz2\u003c/code>; это не RPM.\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode># Когда архив уже получен и проверен:\nbunzip2 -k restic_0.16.5_linux_amd64.bz2\ninstall -m 755 restic_0.16.5_linux_amd64 /usr/local/bin/restic-exam\n/usr/local/bin/restic-exam version\u003c/code>\u003c/pre>\u003c/div>\u003cp>Далее предполагается путь \u003cstrong>\u003ccode>/usr/local/bin/restic-exam\u003c/code>\u003c/strong>. При использовании системного пакета замените его во всех командах и файле службы на \u003ccode>/usr/bin/restic\u003c/code>.\u003c/p>\n\u003ch3>9.2. Каталог и пользователь на HQ-CLI\u003c/h3>\n\u003cp>\u003cstrong>HQ-CLI:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>apt-get install openssh-server\nid irpoadmin\n# Если пользователя нет:\nuseradd -m -s /bin/bash irpoadmin\npasswd irpoadmin\nmkdir -p /backup/irpo\nchown irpoadmin: /backup /backup/irpo\nchmod 700 /backup /backup/irpo\nsystemctl enable --now sshd\nss -lntp | grep sshd\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если на HQ-CLI задан \u003ccode>AllowUsers\u003c/code>, добавьте irpoadmin в существующее разрешение вместе с sshuser. В примере порт HQ-CLI — 22; при другом порте измените SSH-конфигурацию на HQ-SRV.\u003c/p>\n\u003ch3>9.3. Доступ с HQ-SRV по ключу\u003c/h3>\n\u003cp>\u003cstrong>HQ-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p /root/.ssh\nchmod 700 /root/.ssh\nssh-keygen -t ed25519 -f /root/.ssh/id_ed25519_irpo -N ''\nssh-copy-id -i /root/.ssh/id_ed25519_irpo.pub -p 22 irpoadmin@192.168.200.2\u003c/code>\u003c/pre>\u003c/div>\u003cp>При первом подключении сверяйте отпечаток ключа сервера. Откройте:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /root/.ssh/config\u003c/code>\u003c/pre>\u003c/div>\u003cp>Добавьте:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>Host hq-cli-backup\n    HostName 192.168.200.2\n    User irpoadmin\n    Port 22\n    IdentityFile /root/.ssh/id_ed25519_irpo\n    IdentitiesOnly yes\n    BatchMode yes\n    StrictHostKeyChecking yes\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>chmod 600 /root/.ssh/config\nssh hq-cli-backup\nls -ld /backup/irpo\nexit\u003c/code>\u003c/pre>\u003c/div>\u003ch3>9.4. Инициализация репозитория и первая копия\u003c/h3>\n\u003cp>\u003cstrong>HQ-SRV:\u003c/strong>\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>install -d -m 700 /root/.config/restic\nnano /root/.config/restic/irpo.password\nchmod 600 /root/.config/restic/irpo.password\n/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password init\n\n/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password backup --host hq-srv --tag irpo /etc /home /root /var/spool/mail\n/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password snapshots\n/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password check\u003c/code>\u003c/pre>\u003c/div>\u003cp>В файле \u003ccode>irpo.password\u003c/code> вручную впишите выбранную длинную парольную фразу одной строкой. Это пароль шифрования копий, он отличается от пароля входа irpoadmin.\u003c/p>\n\u003cp>Перед запуском проверьте существование \u003ccode>/var/spool/mail\u003c/code>: если каталога нет, уберите его. \u003ccode>/etc\u003c/code> включает passwd/shadow/group/gshadow и системную конфигурацию, \u003ccode>/home\u003c/code> и \u003ccode>/root\u003c/code> — локальные домашние каталоги; при нестандартном размещении home добавьте реальные пути из \u003ccode>getent passwd\u003c/code>. Локальные учётные записи HQ-SRV не заменяют базу пользователей домена на BR-SRV.\u003c/p>\n\u003cp>Сохраните пароль репозитория отдельно от HQ-SRV в защищённом месте: для восстановления после утраты сервера одного SSH-доступа к HQ-CLI недостаточно. Не размещайте его открытым текстом в отчёте.\u003c/p>\n\u003ch3>9.5. Автоматический запуск без shell-скрипта\u003c/h3>\n\u003cp>Расписание не задано КИМ; для примера — ежедневно в 02:00. Служба запускает restic напрямую.\u003c/p>\n\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/systemd/system/backup-irpo.service\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>[Unit]\nDescription=Backup HQ-SRV to irpo on HQ-CLI\nWants=network-online.target\nAfter=network-online.target\n[Service]\nType=oneshot\nExecStart=/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password backup --host hq-srv --tag irpo /etc /home /root /var/spool/mail\u003c/code>\u003c/pre>\u003c/div>\u003cp>Если \u003ccode>/var/spool/mail\u003c/code> отсутствует, уберите его из конца ExecStart. Строку ExecStart в файле вводите одной строкой. При использовании системного пакета замените путь restic-exam на \u003ccode>/usr/bin/restic\u003c/code>.\u003c/p>\n\u003cp>Откройте файл:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>nano /etc/systemd/system/backup-irpo.timer\u003c/code>\u003c/pre>\u003c/div>\u003cp>Впишите содержимое и сохраните:\u003c/p>\n\u003cdiv class=\"command-box config\">\u003cdiv class=\"command-caption\">\u003cspan>Содержимое файла · впишите в редакторе\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать содержимое файла\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>[Unit]\nDescription=Daily irpo backup\n[Timer]\nOnCalendar=*-*-* 02:00:00\nPersistent=true\n[Install]\nWantedBy=timers.target\u003c/code>\u003c/pre>\u003c/div>\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>systemctl daemon-reload\nsystemctl enable --now backup-irpo.timer\nsystemctl start backup-irpo.service\njournalctl -u backup-irpo.service -n 30 --no-pager\nsystemctl list-timers backup-irpo.timer\u003c/code>\u003c/pre>\u003c/div>\u003ch3>9.6. Проверка восстановления\u003c/h3>\n\u003cp>\u003cstrong>HQ-SRV\u003c/strong> — восстановите в отдельную папку, не поверх работающей \u003ccode>/etc\u003c/code>:\u003c/p>\n\u003cdiv class=\"command-box command\">\u003cdiv class=\"command-caption\">\u003cspan>Терминал · вводите команды по одной\u003c/span>\u003cbutton class=\"command-copy\" type=\"button\" aria-label=\"Копировать команды\">Копировать\u003c/button>\u003c/div>\u003cpre>\u003ccode>mkdir -p /root/restore-irpo-test\n/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password restore latest --host hq-srv --tag irpo --target /root/restore-irpo-test --include /etc/passwd --include /etc/group\ncmp /etc/passwd /root/restore-irpo-test/etc/passwd\ncmp /etc/group /root/restore-irpo-test/etc/group\u003c/code>\u003c/pre>\u003c/div>\u003cp>Коды возврата cmp должны быть 0, если файлы не изменились после копирования. На \u003cstrong>HQ-CLI\u003c/strong>: \u003ccode>du -sh /backup/irpo\u003c/code>, \u003ccode>ls -ld /backup /backup/irpo\u003c/code>. Репозиторий содержит служебную структуру restic, а не открытые копии \u003ccode>/etc\u003c/code>: это нормально. Итоговая проверка — успешное восстановление и совпадение файлов.\u003c/p>\n","search":"резервное копирование hq-srv на hq-cli \nким разрешает выбрать по и рекомендует выпуск не позднее чем за 18 месяцев до начала экзамена. для воспроизводимого примера выбрана **restic 0.16.5**, выпущенная 01.07.2024: [официальный выпуск](https://restic.net/blog/2024-07-01/restic-0.16.5-released/). для экзамена в 2027 году этот выпуск удовлетворяет возрасту. если площадка утвердила другое по, используйте его; современная версия из p11 может оказаться моложе указанного срока.\n\nпример реализует хранилище `irpo` как зашифрованный репозиторий restic на hq-cli. доступ к нему — sftp от пользователя **irpoadmin**, пароль **p@ssw0rd**. это учётная запись доступа к хранилищу; пароль шифрования репозитория задаётся отдельно.\n\n### 9.1. выбрать и установить restic на hq-srv\n\nдля обычной тренировки можно установить пакет из p11:\n\n```bash\napt-cache policy restic\napt-get install restic\nrestic version\n```\n\nдля точного соблюдения возраста используйте согласованную версию 0.16.5 из комплекта по площадки либо официальный standalone-бинарник для своей архитектуры. перед использованием сверяйте sha256 с официальным списком выпуска. для x86_64 имя архива — `restic_0.16.5_linux_amd64.bz2`; это не rpm.\n\n```bash\n# когда архив уже получен и проверен:\nbunzip2 -k restic_0.16.5_linux_amd64.bz2\ninstall -m 755 restic_0.16.5_linux_amd64 /usr/local/bin/restic-exam\n/usr/local/bin/restic-exam version\n```\n\nдалее предполагается путь **`/usr/local/bin/restic-exam`**. при использовании системного пакета замените его во всех командах и файле службы на `/usr/bin/restic`.\n\n### 9.2. каталог и пользователь на hq-cli\n\n**hq-cli:**\n\n```bash\napt-get install openssh-server\nid irpoadmin\n# если пользователя нет:\nuseradd -m -s /bin/bash irpoadmin\npasswd irpoadmin\nmkdir -p /backup/irpo\nchown irpoadmin: /backup /backup/irpo\nchmod 700 /backup /backup/irpo\nsystemctl enable --now sshd\nss -lntp | grep sshd\n```\n\nесли на hq-cli задан `allowusers`, добавьте irpoadmin в существующее разрешение вместе с sshuser. в примере порт hq-cli — 22; при другом порте измените ssh-конфигурацию на hq-srv.\n\n### 9.3. доступ с hq-srv по ключу\n\n**hq-srv:**\n\n```bash\nmkdir -p /root/.ssh\nchmod 700 /root/.ssh\nssh-keygen -t ed25519 -f /root/.ssh/id_ed25519_irpo -n ''\nssh-copy-id -i /root/.ssh/id_ed25519_irpo.pub -p 22 irpoadmin@192.168.200.2\n```\n\nпри первом подключении сверяйте отпечаток ключа сервера. откройте:\n\n```bash\nnano /root/.ssh/config\n```\n\nдобавьте:\n\n```sshconfig\nhost hq-cli-backup\n    hostname 192.168.200.2\n    user irpoadmin\n    port 22\n    identityfile /root/.ssh/id_ed25519_irpo\n    identitiesonly yes\n    batchmode yes\n    stricthostkeychecking yes\n```\n\n```bash\nchmod 600 /root/.ssh/config\nssh hq-cli-backup\nls -ld /backup/irpo\nexit\n```\n\n### 9.4. инициализация репозитория и первая копия\n\n**hq-srv:**\n\n```bash\ninstall -d -m 700 /root/.config/restic\nnano /root/.config/restic/irpo.password\nchmod 600 /root/.config/restic/irpo.password\n/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password init\n\n/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password backup --host hq-srv --tag irpo /etc /home /root /var/spool/mail\n/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password snapshots\n/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password check\n```\n\nв файле `irpo.password` вручную впишите выбранную длинную парольную фразу одной строкой. это пароль шифрования копий, он отличается от пароля входа irpoadmin.\n\nперед запуском проверьте существование `/var/spool/mail`: если каталога нет, уберите его. `/etc` включает passwd/shadow/group/gshadow и системную конфигурацию, `/home` и `/root` — локальные домашние каталоги; при нестандартном размещении home добавьте реальные пути из `getent passwd`. локальные учётные записи hq-srv не заменяют базу пользователей домена на br-srv.\n\nсохраните пароль репозитория отдельно от hq-srv в защищённом месте: для восстановления после утраты сервера одного ssh-доступа к hq-cli недостаточно. не размещайте его открытым текстом в отчёте.\n\n### 9.5. автоматический запуск без shell-скрипта\n\nрасписание не задано ким; для примера — ежедневно в 02:00. служба запускает restic напрямую.\n\nоткройте файл:\n\n```bash\nnano /etc/systemd/system/backup-irpo.service\n```\n\nвпишите содержимое и сохраните:\n\n```text\n[unit]\ndescription=backup hq-srv to irpo on hq-cli\nwants=network-online.target\nafter=network-online.target\n[service]\ntype=oneshot\nexecstart=/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password backup --host hq-srv --tag irpo /etc /home /root /var/spool/mail\n```\n\nесли `/var/spool/mail` отсутствует, уберите его из конца execstart. строку execstart в файле вводите одной строкой. при использовании системного пакета замените путь restic-exam на `/usr/bin/restic`.\n\nоткройте файл:\n\n```bash\nnano /etc/systemd/system/backup-irpo.timer\n```\n\nвпишите содержимое и сохраните:\n\n```text\n[unit]\ndescription=daily irpo backup\n[timer]\noncalendar=*-*-* 02:00:00\npersistent=true\n[install]\nwantedby=timers.target\n```\n\n```bash\nsystemctl daemon-reload\nsystemctl enable --now backup-irpo.timer\nsystemctl start backup-irpo.service\njournalctl -u backup-irpo.service -n 30 --no-pager\nsystemctl list-timers backup-irpo.timer\n```\n\n### 9.6. проверка восстановления\n\n**hq-srv** — восстановите в отдельную папку, не поверх работающей `/etc`:\n\n```bash\nmkdir -p /root/restore-irpo-test\n/usr/local/bin/restic-exam -r sftp:hq-cli-backup:/backup/irpo --password-file /root/.config/restic/irpo.password restore latest --host hq-srv --tag irpo --target /root/restore-irpo-test --include /etc/passwd --include /etc/group\ncmp /etc/passwd /root/restore-irpo-test/etc/passwd\ncmp /etc/group /root/restore-irpo-test/etc/group\n```\n\nкоды возврата cmp должны быть 0, если файлы не изменились после копирования. на **hq-cli**: `du -sh /backup/irpo`, `ls -ld /backup /backup/irpo`. репозиторий содержит служебную структуру restic, а не открытые копии `/etc`: это нормально. итоговая проверка — успешное восстановление и совпадение файлов.\n\n"}]}],"total":29}</script><script>(()=>{'use strict';
const THEME_KEY='alt-kim2027-theme-v1';
const themeButton=document.getElementById('theme-toggle');
function applyTheme(theme){const dark=theme==='dark';document.documentElement.dataset.theme=dark?'dark':'light';themeButton.setAttribute('aria-pressed',String(dark));themeButton.setAttribute('aria-label',dark?'Включить светлую тему':'Включить тёмную тему');themeButton.title=dark?'Включить светлую тему':'Включить тёмную тему';themeButton.innerHTML='<span class="theme-icon" aria-hidden="true">'+(dark?'☀':'☾')+'</span><span class="theme-label">'+(dark?'Светлая тема':'Тёмная тема')+'</span>';}
applyTheme(document.documentElement.dataset.theme);
themeButton.addEventListener('click',()=>{const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(theme);try{localStorage.setItem(THEME_KEY,theme);}catch{}});
window.addEventListener('storage',event=>{if(event.key===THEME_KEY)applyTheme(event.newValue);});
const data=JSON.parse(document.getElementById('course-data').textContent);
const all=data.modules.flatMap(m=>m.lessons),valid=new Set(all.map(x=>x.id));
const main=document.getElementById('content'),sidebar=document.getElementById('sidebar');
const KEY='alt-kim2027-completion-v1';let progress={},query='',filter='all',storageOK=true;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');if(saved&&typeof saved==='object'&&!Array.isArray(saved)){for(const [id,value] of Object.entries(saved))if(valid.has(id)&&value===true)progress[id]=true;}}catch{storageOK=false;}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon='<svg viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 2h10l5 5v19H5z"/><path d="M15 2v6h5M8 12h9M8 16h9M8 20h7"/></svg>';
const pageIcon='<span class="page-icon" aria-hidden="true">'+icon+'</span>';
function count(items=all){return items.filter(x=>progress[x.id]).length;}
function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('visible');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('visible'),2200);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress));storageOK=true;}catch{storageOK=false;}updateProgress();}
function completeButton(id){const done=Boolean(progress[id]);return `<button type="button" class="complete ${done?'is-done':''}" data-complete="${id}" aria-pressed="${done}" aria-label="${done?'Снять отметку':'Отметить как сделано'}: ${esc(all.find(x=>x.id===id).title)}"><span class="check" aria-hidden="true">${done?'✓':''}</span><span>${done?'Сделано':'Не сделано'}</span></button>`;}
function route(){return decodeURIComponent(location.hash.slice(1)||'course');}
function renderSidebar(){const current=route();sidebar.innerHTML=`<div class="sidebar-top">ОГЛАВЛЕНИЕ КУРСА <span>${count()}/29</span></div><a class="side-link ${current==='course'?'active':''}" href="#course"><small>⌂</small>Тематический план</a><a class="side-link ${current==='start'?'active':''}" href="#start"><small>☷</small>Перед началом</a>`+data.modules.map(m=>`<a class="side-module" href="#m${m.n}">Модуль ${m.n}<span>${count(m.lessons)}/${m.lessons.length}</span></a>`+m.lessons.map(l=>`<a class="side-link ${current===l.id?'active':''} ${progress[l.id]?'done':''}" href="#${l.id}" ${current===l.id?'aria-current="page"':''}><small>${progress[l.id]?'✓':l.n+'.'}</small><span>${esc(l.title)}</span></a>`).join('')).join('');}
function breadcrumb(label='',module){return `<nav class="breadcrumbs" aria-label="Путь"><a href="#course">DEMO2027</a>${module?`<span>›</span><a href="#m${module}">Модуль ${module}</a>`:''}${label?`<span>›</span><span>${esc(label)}</span>`:''}</nav>`;}
function progressPanel(){const n=count(),pct=Math.round(n/29*100);return `<div class="progress-panel"><div class="percentage" data-percent>${pct}%</div><div class="progress-main"><div class="progress-label">Ваш прогресс <span data-total>${n} из 29 заданий сделано</span></div><div class="progress-track" role="progressbar" aria-label="Прогресс курса" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="29"><div class="progress-fill" style="width:${pct}%"></div></div><div class="storage-note">${storageOK?'Отметки сохраняются в этом браузере автоматически.':'Хранилище недоступно. Отметки сохраняются только до закрытия страницы.'}</div></div><button class="plain-button" id="export-progress" title="Скачать отметки в JSON">Сохранить прогресс</button></div>`;}
function row(l){return `<div class="lesson-row" data-lesson-row="${l.id}">${pageIcon}<div class="lesson-main"><a class="lesson-link" href="#${l.id}">${l.n}. ${esc(l.title)}</a><span class="lesson-type">Страница · команды и проверка</span></div>${completeButton(l.id)}</div>`;}
function matches(l){return (!query||l.search.includes(query.toLowerCase()))&&(filter==='all'||filter==='done'&&progress[l.id]||filter==='todo'&&!progress[l.id]);}
function moduleCard(m){const visible=m.lessons.filter(matches);if(!visible.length)return '';return `<details class="module" open data-module="${m.n}"><summary><span class="chevron" aria-hidden="true">›</span><span class="module-title">Модуль ${m.n}. ${esc(m.title)}</span><span class="module-count" data-module-count="${m.n}">${count(m.lessons)} / ${m.lessons.length}</span></summary><div class="module-progress-mini"><div style="width:${count(m.lessons)/m.lessons.length*100}%"></div></div><p class="module-intro">${m.n===1?'Имена устройств, адресация, коммутация, туннель и маршрутизация. Все устройства — Альт Сервер 11.1; настройка сети через etcnet.':m.n===2?'Отдельный подготовленный стенд: сеть и контроллер Samba DC на BR-SRV уже работают. Выполните настройки служб и проверьте результат.':'Практическая работа с готовой инфраструктурой: HTTPS, печать, мониторинг, защита SSH и резервное копирование.'}</p><div class="lessons">${visible.map(row).join('')}</div><div class="module-links"><a href="#prep-${m.n}">Подготовка и условия модуля</a><button class="all-toggle" data-module-done="${m.n}">Отметить модуль сделанным</button></div></details>`;}
function renderCards(selected){const mods=selected?data.modules.filter(m=>m.n===selected):data.modules;document.getElementById('module-list').innerHTML=mods.map(moduleCard).join('')||'<div class="empty">Заданий по этому запросу нет. Измените поиск или фильтр.</div>';}

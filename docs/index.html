function course(selected){const name=selected?'Модуль '+selected+'. '+data.modules[selected-1].title:'DEMO2027 · Сетевое и системное администрирование';main.innerHTML=breadcrumb(selected?'Модуль '+selected:'Тематический план')+`<section class="course-heading"><div class="eyebrow">Практический курс · КИМ 09.02.06-1-2027</div><h1>${esc(name)}</h1><p class="course-subtitle">Пошаговое выполнение на Альт Сервер 11.1</p><div class="overview-meta"><span><b>3</b> модуля</span><span><b>29</b> заданий</span><span>ens33 / ens37 / ens38</span><span>etcnet · ручной ввод</span></div></section>${progressPanel()}${!selected?`<section class="general-card"><h2>Общее</h2><div class="general-links"><a class="resource-link" href="#start">▤ Перед началом работы</a><a class="resource-link" href="#m1-1">▤ Адресация и подключение ВМ</a><a class="resource-link" href="#help">✓ Как пользоваться отметками</a></div></section>`:''}<div class="course-tools"><div class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input type="search" id="search" placeholder="Найти задание, устройство или команду…" aria-label="Поиск по заданиям" value="${esc(query)}"></div><select id="filter" aria-label="Фильтр по выполнению"><option value="all">Все задания</option><option value="todo">Не сделано</option><option value="done">Сделано</option></select><button class="all-toggle" id="collapse-all">Свернуть всё</button></div><div id="module-list"></div><div class="footer">КИМ 2027 · Альт Сервер 11.1 · HQ-CLI с GNOME · Прогресс хранится только в вашем браузере</div>`;document.getElementById('filter').value=filter;renderCards(selected);document.getElementById('search').addEventListener('input',e=>{query=e.target.value;renderCards(selected);});document.getElementById('filter').addEventListener('change',e=>{filter=e.target.value;renderCards(selected);});document.getElementById('collapse-all').addEventListener('click',e=>{const boxes=[...main.querySelectorAll('details.module')],open=boxes.some(x=>x.open);boxes.forEach(x=>x.open=!open);e.target.textContent=open?'Развернуть всё':'Свернуть всё';});}
function lesson(l){const index=all.indexOf(l),previous=all[index-1],next=all[index+1];main.innerHTML=breadcrumb(l.n+'. '+l.title,l.module)+`<div class="reading-header"><div>${pageIcon}<div style="overflow:hidden"><span class="lesson-module-label">МОДУЛЬ ${l.module} · ЗАДАНИЕ ${l.n}</span><h1>${l.n}. ${esc(l.title)}</h1><span class="reading-subtitle">Альт Сервер 11.1 · ввод команд вручную</span></div></div>${completeButton(l.id)}</div><article class="lesson-article"><div class="goal"><h2>Задание:</h2><p>${esc(l.goal)}</p></div><h2 class="implementation">Вариант реализации:</h2><div class="legend"><span><i></i>Команда для терминала</span><span><i class="blue"></i>Содержимое конфигурационного файла</span></div><div class="prose">${l.html}</div><div class="lesson-footer"><span class="info-note">После выполнения команд и проверок отметьте задание.</span>${completeButton(l.id)}</div></article><nav class="pager" aria-label="Переход между заданиями">${previous?`<a href="#${previous.id}"><small>← Предыдущее задание</small>${previous.n}. ${esc(previous.title)}</a>`:`<a href="#course"><small>← В начало</small>Тематический план</a>`}${next?`<a class="next" href="#${next.id}"><small>Следующее задание →</small>${next.n}. ${esc(next.title)}</a>`:`<a class="next" href="#course"><small>Курс завершён →</small>Вернуться к тематическому плану</a>`}</nav>`;}
function information(title,html){main.innerHTML=breadcrumb(title)+`<div class="reading-header"><h1>${esc(title)}</h1><button class="plain-button print-button" data-print>Печать</button></div><article class="lesson-article"><div class="prose intro-content">${html}</div><a class="start-button" href="#m1-1">Перейти к первому заданию →</a></article>`;}
function render(){const id=route();renderSidebar();if(id==='course')course();else if(/^m[123]$/.test(id))course(Number(id[1]));else if(id==='start')information('Перед началом работы',data.intro);else if(/^prep-[123]$/.test(id)){const m=data.modules[Number(id.at(-1))-1];information('Подготовка · модуль '+m.n,m.preparation);}else if(id==='help')information('Отметки выполнения',`<h2>Сделано или не сделано</h2><p>Нажмите кнопку «Не сделано» напротив задания после его выполнения. Она станет зелёной и сменится на «Сделано». Повторное нажатие снимает отметку. Нажимать можно и в тематическом плане, и внутри урока.</p><p>Прогресс отображается для всего курса и каждого модуля. Фильтр помогает найти незавершённые задания. В боковом оглавлении сделанные задания отмечены галочкой.</p><h2>Где хранятся отметки</h2><p>В локальном хранилище этого браузера. На другом устройстве, в другом браузере и после очистки данных сайта прогресс может быть другим. «Сохранить прогресс» скачивает резервный JSON-файл. Его можно загрузить ниже.</p><p><label class="resource-link" style="cursor:pointer">Загрузить прогресс <input type="file" id="import-progress" accept="application/json,.json" style="max-width:230px"></label></p><p><button class="plain-button" id="reset-progress">Сбросить все отметки</button></p><h2>Команды и файлы</h2><p>Светло-серый блок — команда терминала, голубоватый — текст для файла. Сначала откройте файл в nano, затем впишите содержимое. Ctrl+O → Enter сохраняет, Ctrl+X закрывает редактор. В less для выхода нажмите q.</p><p>Содержимое инструкции соответствует вашему КИМ 2027. В качестве визуального образца использован <a href="https://sysahelper.ru/course/view.php?id=42" target="_blank" rel="noopener noreferrer">курс sysahelper</a> 2026 года; его адреса и команды EcoRouter не перенесены.</p>`);else{const found=all.find(x=>x.id===id);if(found)lesson(found);else{location.hash='course';return;}}window.scrollTo(0,0);sidebar.querySelector('.active')?.scrollIntoView({block:'nearest'});}
function updateProgress(){renderSidebar();for(const button of main.querySelectorAll('[data-complete]')){const done=Boolean(progress[button.dataset.complete]),item=all.find(l=>l.id===button.dataset.complete);button.classList.toggle('is-done',done);button.setAttribute('aria-pressed',String(done));button.setAttribute('aria-label',(done?'Снять отметку':'Отметить как сделано')+': '+item.title);button.innerHTML=`<span class="check" aria-hidden="true">${done?'✓':''}</span><span>${done?'Сделано':'Не сделано'}</span>`;}const n=count();main.querySelectorAll('[data-percent]').forEach(el=>el.textContent=Math.round(n/29*100)+'%');main.querySelectorAll('[data-total]').forEach(el=>el.textContent=n+' из 29 заданий сделано');const bar=main.querySelector('[role="progressbar"]');if(bar){bar.setAttribute('aria-valuenow',String(n));bar.querySelector('.progress-fill').style.width=n/29*100+'%';}for(const m of data.modules){const box=main.querySelector(`[data-module="${m.n}"]`);if(box){box.querySelector('[data-module-count]').textContent=count(m.lessons)+' / '+m.lessons.length;box.querySelector('.module-progress-mini div').style.width=count(m.lessons)/m.lessons.length*100+'%';}}const storage=main.querySelector('.storage-note');if(storage&&!storageOK)storage.textContent='Хранилище недоступно. Скачайте резервную копию прогресса.';if(filter!=='all'&&main.querySelector('#module-list'))renderCards(/^m[123]$/.test(route())?Number(route()[1]):undefined);}
document.addEventListener('click',async e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.complete){const id=button.dataset.complete;progress[id]=!progress[id];if(!progress[id])delete progress[id];save();toast(progress[id]?'Задание отмечено как сделанное':'Отметка снята');}else if(button.classList.contains('command-copy')){const text=button.closest('.command-box').querySelector('code').textContent;try{await navigator.clipboard.writeText(text);button.textContent='Скопировано';setTimeout(()=>button.textContent='Копировать',1300);}catch{const selection=getSelection(),range=document.createRange();range.selectNodeContents(button.closest('.command-box').querySelector('code'));selection.removeAllRanges();selection.addRange(range);toast('Текст выделен. Нажмите Ctrl+C.');}}else if(button.dataset.moduleDone){const m=data.modules[Number(button.dataset.moduleDone)-1];for(const l of m.lessons)progress[l.id]=true;save();toast('Модуль отмечен как сделанный');}else if(button.id==='export-progress'){const blob=new Blob([JSON.stringify({course:'alt-kim-2027',version:1,progress},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='КИМ-2027-прогресс.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Резервная копия прогресса сохранена');}else if(button.id==='reset-progress'){if(confirm('Снять все отметки выполнения? Это изменит только прогресс этого курса в браузере.')){progress={};save();toast('Все отметки сняты');}}else if(button.hasAttribute('data-print'))window.print();});
document.addEventListener('change',async e=>{if(e.target.id!=='import-progress'||!e.target.files?.[0])return;try{const imported=JSON.parse(await e.target.files[0].text());if(imported.course!=='alt-kim-2027'||!imported.progress||typeof imported.progress!=='object'||Array.isArray(imported.progress))throw Error();const clean={};for(const [id,value] of Object.entries(imported.progress))if(valid.has(id)&&value===true)clean[id]=true;progress=clean;save();toast('Прогресс загружен: '+count()+' из 29 заданий');}catch{toast('Не удалось прочитать файл прогресса этого курса.');}e.target.value='';});
const menu=document.getElementById('menu'),backdrop=document.getElementById('backdrop');function toggleMenu(){if(innerWidth<=780){const opened=sidebar.classList.toggle('mobile-open');backdrop.classList.toggle('open',opened);menu.setAttribute('aria-expanded',String(opened));}else{const hidden=document.body.classList.toggle('nav-hidden');menu.setAttribute('aria-expanded',String(!hidden));}}menu.addEventListener('click',toggleMenu);backdrop.addEventListener('click',toggleMenu);sidebar.addEventListener('click',e=>{if(e.target.closest('a')&&innerWidth<=780){sidebar.classList.remove('mobile-open');backdrop.classList.remove('open');menu.setAttribute('aria-expanded','false');}});window.addEventListener('hashchange',render);window.addEventListener('storage',e=>{if(e.key===KEY){try{progress=JSON.parse(e.newValue||'{}');updateProgress();}catch{}}});render();})();
</script></body></html>
